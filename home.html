<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script type="module" src="./auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#F59E0B',
                        success: '#10B981',
                        danger: '#EF4444',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: #0F172A;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
            transition: all 0.2s ease;
        }
        .city-card {
            background: linear-gradient(145deg, #1E293B, #1E293B);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .city-card:hover {
            border-color: #3B82F6;
            transform: translateY(-2px);
        }
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #EF4444;
            color: white;
            font-size: 10px;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-white">
    <!-- رأس الصفحة -->
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-4">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center">
                <i class="fa fa-user"></i>
            </div>
            <div class="text-center">
                <h1 class="text-xl font-bold">كشتات عائلة حسين العويشي</h1>
                <p class="text-sm text-slate-400">مرحباً، الضيف 👋</p>
            </div>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6">
        <!-- آخر الإضافات -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold">أحدث الأماكن المضافة</h2>
                <button class="text-sm text-secondary hover:text-blue-400">عرض الكل</button>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700 text-center text-slate-400">
                جاري التحميل...
            </div>
        </section>

        <!-- مجلدات المدن -->
        <section>
            <h2 class="text-lg font-semibold mb-4 text-right">المدن</h2>
            <div id="citiesContainer" class="grid grid-cols-2 gap-4">
                <div class="col-span-2 text-center py-12 text-slate-400">
                    جاري تحميل المدن...
                </div>
            </div>
        </section>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 bg-dark/90 backdrop-blur-md border-t border-slate-700 z-50">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-around">
            <button class="flex flex-col items-center gap-1 text-secondary">
                <i class="fa fa-home text-lg"></i>
                <span class="text-xs">الرئيسية</span>
            </button>
            <button onclick="openAddCityModal()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white">
                <i class="fa fa-building-o text-lg"></i>
                <span class="text-xs">مدينة</span>
            </button>
            <button class="w-14 h-14 rounded-full btn-primary flex items-center justify-center -mt-6 shadow-lg" onclick="window.location.href='add-place.html'">
                <i class="fa fa-plus text-xl"></i>
            </button>
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-white relative" onclick="openNotifications()">
                <i class="fa fa-bell text-lg"></i>
                <span class="text-xs">الإشعارات</span>
                <span class="notification-badge" id="notifBadge" style="display:none;">0</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-white" onclick="window.location.href='profile.html'">
                <i class="fa fa-user text-lg"></i>
                <span class="text-xs">حسابي</span>
            </button>
        </div>
    </nav>

    <!-- نافذة الإشعارات -->
    <div id="notificationsModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-sm mx-4 border border-slate-700 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold">الإشعارات</h3>
                <button onclick="closeNotifications()" class="text-slate-400 hover:text-white">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div id="notificationsList" class="space-y-3">
                <p class="text-center text-slate-400 py-8">لا توجد إشعارات جديدة ✅</p>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة مدينة -->
    <div id="addCityModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-sm mx-4 border border-slate-700">
            <h3 class="text-lg font-bold mb-4 text-center">إضافة مدينة جديدة</h3>
            <input type="text" id="newCityName" placeholder="أدخل اسم المدينة"
                class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 mb-4 text-white">
            <div class="flex gap-3">
                <button onclick="closeAddCityModal()" class="flex-1 py-3 rounded-lg bg-slate-700 hover:bg-slate-600">إلغاء</button>
                <button onclick="saveNewCity()" class="flex-1 py-3 rounded-lg btn-primary text-white">إضافة</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAllPlaces, addPlace, getCurrentUser, isAdmin, logout } from './auth.js';

        if (!getCurrentUser()) {
            window.location.href = 'login.html';
        }

        const user = getCurrentUser();
        document.querySelector('p:has(+h1)').textContent = `مرحباً، ${user?.name || 'مستخدم'} 👋`;

        let allPlaces = [];

        async function loadData() {
            try {
                allPlaces = await getAllPlaces();
                renderCities();
                renderRecentPlaces();
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                document.getElementById('citiesContainer').innerHTML = '<p class="col-span-2 text-center text-red-400">خطأ في تحميل البيانات</p>';
            }
        }

        function renderCities() {
            const cities = [...new Set(allPlaces.map(p => p.city).filter(c => c))];
            
            if (cities.length === 0) {
                document.getElementById('citiesContainer').innerHTML = `
                    <div class="col-span-2 text-center py-12 text-slate-400">
                        <i class="fa fa-map-o text-4xl mb-3 opacity-50"></i>
                        <p>لم تُضاف مدن بعد</p>
                        <p class="text-sm mt-1">اضغط على "مدينة" أدناه للبدء ✅</p>
                    </div>
                `;
                return;
            }

            document.getElementById('citiesContainer').innerHTML = cities.map(city => {
                const count = allPlaces.filter(p => p.city === city && !p.isCityOnly).length;
                return `
                    <div class="city-card rounded-xl p-4 cursor-pointer" onclick="openCityPage('${city}')">
                        <div class="w-12 h-12 rounded-full bg-secondary/20 flex items-center justify-center text-secondary text-xl mb-3">
                            <i class="fa fa-map-marker"></i>
                        </div>
                        <h3 class="font-bold">${city}</h3>
                        <p class="text-sm text-slate-400 mt-1">${count} مكان</p>
                    </div>
                `;
            }).join('');
        }

        function renderRecentPlaces() {
            const container = document.querySelector('section:first-of-type div:last-child');
            const recent = allPlaces.filter(p => !p.isCityOnly).slice(0, 5);
            
            if (recent.length === 0) {
                container.innerHTML = '<p class="text-slate-400">لم تُضاف أماكن بعد 😊</p>';
                return;
            }

            container.innerHTML = `
                <div class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
                    ${recent.map(place => `
                        <div class="flex-shrink-0 w-64 bg-slate-700/50 rounded-xl p-3 cursor-pointer" 
                             onclick="window.location.href='place-detail.html?id=${place.id}'">
                            <div class="w-full h-20 rounded-lg bg-slate-600 mb-2 overflow-hidden">
                                ${place.images?.length 
                                    ? `<img src="${place.images[0]}" class="w-full h-full object-cover">`
                                    : '<div class="w-full h-full flex items-center justify-center"><i class="fa fa-image text-slate-400 text-xl"></i></div>'
                                }
                            </div>
                            <h4 class="font-medium truncate">${place.name}</h4>
                            <p class="text-xs text-slate-400">${place.city}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        window.openCityPage = function(cityName) {
            window.location.href = `city.html?city=${encodeURIComponent(cityName)}`;
        };

        window.openNotifications = function() {
            document.getElementById('notificationsModal').classList.remove('hidden');
            document.getElementById('notifBadge').style.display = 'none';
        };

        window.closeNotifications = function() {
            document.getElementById('notificationsModal').classList.add('hidden');
        };

        window.openAddCityModal = function() {
            document.getElementById('addCityModal').classList.remove('hidden');
            document.getElementById('newCityName').value = '';
        };

        window.closeAddCityModal = function() {
            document.getElementById('addCityModal').classList.add('hidden');
        };

        window.saveNewCity = async function() {
            const name = document.getElementById('newCityName').value.trim();
            if (!name) return alert('أدخل اسم المدينة ❌');
            
            const exists = allPlaces.some(p => p.city === name);
            if (exists) return alert('المدينة موجودة مسبقاً ✅');
            
            await addPlace({
                name: '',
                city: name,
                category: '',
                isCityOnly: true
            });
            
            document.getElementById('addCityModal').classList.add('hidden');
            alert(`✅ تمت إضافة مدينة "${name}"`);
            loadData();
        };

        loadData();
    </script>
</body>
</html>
