<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%); min-height: 100vh; padding-bottom: 80px; }
        .city-card { transition: all 0.2s ease; cursor: pointer; }
        .city-card:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <header class="px-4 pt-8 pb-4 text-center">
        <h1 class="text-2xl font-bold text-gray-800">كشتات عائلة حسين العويشي</h1>
        <p class="text-gray-500 text-sm mt-1">اختر المدينة لعرض الأماكن</p>
    </header>

    <main class="px-4">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i class="fa fa-building text-primary"></i>
            المدن
        </h2>

        <div id="citiesList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="text-center py-12 text-gray-400 col-span-full">
                <i class="fa fa-folder-open text-5xl mb-4"></i>
                <p>لا توجد مدن مضافة حتى الآن</p>
                <p class="text-sm mt-1">أضف مدناً من لوحة تحكم المشرف أولاً 📍</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg px-6 py-3 z-40">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-xs text-primary">
                <i class="fa fa-home text-lg"></i>
                <span>الرئيسية</span>
            </button>
            <button onclick="window.location.href='add-place.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-plus-circle text-lg"></i>
                <span>إضافة مكان</span>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-user text-lg"></i>
                <span>حسابي</span>
            </button>
        </div>
    </nav>

    <script>
        function loadCities() {
            const cities = JSON.parse(localStorage.getItem('cities') || '[]');
            const places = JSON.parse(localStorage.getItem('places') || '[]');
            const container = document.getElementById('citiesList');
            
            if (cities.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400 col-span-full">
                        <i class="fa fa-folder-open text-5xl mb-4"></i>
                        <p>لا توجد مدن مضافة حتى الآن</p>
                        <p class="text-sm mt-1">أضف مدناً من لوحة تحكم المشرف أولاً 📍</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            cities.forEach(city => {
                const count = places.filter(p => p.city === city.name).length;
                container.innerHTML += `
                    <div class="city-card bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center"
                         onclick="openCity('${city.name}')">
                        <div class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-3">
                            <i class="fa fa-map-marker text-primary text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-lg">${city.name}</h3>
                        <p class="text-sm text-gray-500 mt-1">${count} مكان</p>
                    </div>
                `;
            });
        }

        // ✅ الإصلاح: حفظ اسم المدينة والانتقال مع تمرير الاسم في الرابط
        window.openCity = function(cityName) {
            localStorage.setItem('currentCity', cityName);
            window.location.href = `city.html?city=${encodeURIComponent(cityName)}`;
        };

        loadCities();
    </script>
</body>
</html>
