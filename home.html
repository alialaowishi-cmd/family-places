<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { 
            background: #0F172A; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 85px;
        }
        .city-card { 
            transition: all 0.2s ease; 
            cursor: pointer; 
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
        }
        .city-card:hover { 
            transform: translateY(-3px); 
            border-color: #3B82F6; 
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
        }
        .btn-primary { 
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); 
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.97); }
        button { cursor: pointer; font-family: inherit; }
        .skeleton { background: linear-gradient(90deg, #1E293B 25%, #334155 50%, #1E293B 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-white">
    <!-- الهيدر -->
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                    كشتات عائلة حسين العويشي
                </h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="adminQuickBtn" class="text-slate-400 hover:text-secondary transition p-2" title="لوحة المشرف">
                    <i class="fa fa-cog fa-lg"></i>
                </button>
                <button id="userBtn" class="text-slate-400 hover:text-secondary transition p-2" title="حسابي">
                    <i class="fa fa-user-circle fa-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="px-4 py-6">
        <!-- شريط البحث -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="ابحث عن مدينة أو مكان..." 
                    class="w-full px-4 py-3 pl-10 rounded-xl bg-slate-800/60 border border-slate-700 text-white focus:border-secondary focus:outline-none">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
        </div>

        <!-- آخر الأماكن المضافة -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold">✨ أحدث الأماكن المضافة</h2>
                <a href="#all-places" class="text-sm text-secondary hover:text-secondary/80">عرض الكل</a>
            </div>
            <div id="recentPlacesContainer" class="flex overflow-x-auto gap-3 pb-2 scrollbar-hide">
                <!-- جاري التحميل -->
                <div class="w-48 h-36 rounded-xl skeleton"></div>
                <div class="w-48 h-36 rounded-xl skeleton"></div>
                <div class="w-48 h-36 rounded-xl skeleton"></div>
            </div>
        </section>

        <!-- زر إضافة مدينة ومكان -->
        <section class="mb-8">
            <div class="grid grid-cols-2 gap-4">
                <button id="addCityBtn" class="btn-primary py-4 rounded-xl font-medium flex items-center justify-center gap-2">
                    <i class="fa fa-building"></i> إضافة مدينة
                </button>
                <button id="addPlaceMainBtn" class="bg-slate-700 hover:bg-slate-600 py-4 rounded-xl font-medium flex items-center justify-center gap-2 transition">
                    <i class="fa fa-map-marker"></i> إضافة مكان
                </button>
            </div>
        </section>

        <!-- مجلدات المدن -->
        <section id="all-places">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold">📁 المدن</h2>
                <span id="cityCount" class="text-sm text-slate-400">0 مدينة</span>
            </div>
            
            <div id="citiesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- جاري التحميل -->
                <div class="h-32 rounded-xl skeleton"></div>
                <div class="h-32 rounded-xl skeleton"></div>
                <div class="h-32 rounded-xl skeleton"></div>
                <div class="h-32 rounded-xl skeleton"></div>
            </div>

            <!-- حالة عدم وجود مدن -->
            <div id="noCitiesState" class="text-center py-12 hidden">
                <i class="fa fa-map-o text-5xl text-slate-600 mb-4"></i>
                <h3 class="text-lg font-medium text-slate-400 mb-2">لا توجد مدن مضافة بعد</h3>
                <p class="text-sm text-slate-500 mb-6">أضف أول مدينة لتبدأ رحلتك 🎉</p>
                <button id="addFirstCityBtn" class="btn-primary px-6 py-2 rounded-lg font-medium">
                    <i class="fa fa-plus ml-1"></i> إضافة أول مدينة
                </button>
            </div>
        </section>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-dark/95 backdrop-blur-md border-t border-slate-700 px-2 py-2">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button class="flex flex-col items-center text-xs text-secondary py-1">
                <i class="fa fa-home text-lg mb-1"></i>الرئيسية
            </button>
            <button id="navCitiesBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-building text-lg mb-1"></i>المدن
            </button>
            <button id="navAddBtn" class="flex flex-col items-center text-xs py-1">
                <div class="w-12 h-12 bg-secondary rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-secondary/30">
                    <i class="fa fa-plus text-xl text-white"></i>
                </div>
            </button>
            <button id="navNotificationsBtn" class="flex flex-col items-center text-xs text-slate-400 py-1 relative">
                <i class="fa fa-bell text-lg mb-1"></i>الإشعارات
                <span id="notifBadge" class="absolute -top-1 -right-2 w-4 h-4 bg-red-500 rounded-full text-[10px] flex items-center justify-center hidden">0</span>
            </button>
            <button id="navProfileBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-user text-lg mb-1"></i>حسابي
            </button>
        </div>
    </nav>

    <!-- نافذة إضافة مدينة -->
    <div id="addCityModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm mx-4">
           h3 class="text-lg font-bold mb-4 text-center">إضافة مدينة جديدة</h3>
            <input type="text" id="newCityName" placeholder="اسم المدينة" 
                class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white mb-4 focus:border-secondary focus:outline-none">
            <div class="flex gap-3">
                <button id="cancelCityBtn" class="flex-1 py-2 rounded-lg bg-slate-700 hover:bg-slate-600">إلغاء</button>
                <button id="saveCityBtn" class="flex-1 btn-primary py-2 rounded-lg font-medium">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        // استيراد الدوال من Firebase
        import { getCities, addCity, getPlaces } from './db.js';
        import { getCurrentUser, logout } from './auth.js';

        // التحقق من تسجيل الدخول
        const currentUser = getCurrentUser();
        if (!currentUser) {
            console.log('⚠️ المستخدم غير مسجل، جاري التوجيه لصفحة الدخول...');
            window.location.href = 'login.html';
        }

        // المتغيرات العامة
        let allCities = [];
        let allPlaces = [];

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('✅ الصفحة الرئيسية محملة');
            console.log('👤 المستخدم الحالي:', currentUser);
            
            // ربط الأحداث
            bindEvents();
            
            // تحميل البيانات
            await loadAllData();
        });

        function bindEvents() {
            // أزرار إضافة مدينة
            document.getElementById('addCityBtn').addEventListener('click', () => openCityModal());
            document.getElementById('addFirstCityBtn').addEventListener('click', () => openCityModal());
            document.getElementById('cancelCityBtn').addEventListener('click', () => closeCityModal());
            document.getElementById('saveCityBtn').addEventListener('click', handleAddCity);

            // أزرار التنقل
            document.getElementById('addPlaceMainBtn').addEventListener('click', () => {
                window.location.href = 'add-place.html';
            });
            document.getElementById('navAddBtn').addEventListener('click', () => {
                window.location.href = 'add-place.html';
            });
            document.getElementById('userBtn').addEventListener('click', () => {
                window.location.href = 'profile.html';
            });
            document.getElementById('navProfileBtn').addEventListener('click', () => {
                window.location.href = 'profile.html';
            });
            document.getElementById('adminQuickBtn').addEventListener('click', () => {
                const pass = prompt('أدخل كلمة مرور المشرف:');
                if (pass === 'admin123') {
                    window.location.href = 'admin-dashboard.html';
                } else if (pass !== null) {
                    alert('كلمة المرور غير صحيحة ❌');
                }
            });

            // البحث
            document.getElementById('searchInput').addEventListener('input', filterContent);
        }

        async function loadAllData() {
            try {
                console.log('⏳ جاري تحميل البيانات من Firebase...');
                
                // تحميل المدن
                allCities = await getCities();
                console.log('📁 المدن المحملة:', allCities);
                renderCities();

                // تحميل الأماكن
                allPlaces = await getPlaces();
                console.log('📍 الأماكن المحملة:', allPlaces);
                renderRecentPlaces();

            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
                alert('حدث خطأ في تحميل البيانات، يرجى تحديث الصفحة');
            }
        }

        function renderCities() {
            const container = document.getElementById('citiesContainer');
            const noCities = document.getElementById('noCitiesState');
            const countEl = document.getElementById('cityCount');

            // إخفاء جميع العناصر أولاً
            container.innerHTML = '';
            countEl.textContent = `${allCities.length} مدينة`;

            if (allCities.length === 0) {
                container.classList.add('hidden');
                noCities.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            noCities.classList.add('hidden');

            allCities.forEach(city => {
                const placeCount = allPlaces.filter(p => p.city === city.name).length;
                
                const card = document.createElement('div');
                card.className = 'city-card border border-slate-700 rounded-xl p-4';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold mb-1">${city.name}</h3>
                            <p class="text-sm text-slate-400">
                                <i class="fa fa-map-marker ml-1"></i>
                                ${placeCount} مكان مضاف
                            </p>
                        </div>
                        <div class="w-12 h-12 bg-secondary/20 rounded-full flex items-center justify-center">
                            <i class="fa fa-folder-open text-secondary text-xl"></i>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `city.html?name=${encodeURIComponent(city.name)}`;
                });
                container.appendChild(card);
            });
        }

        function renderRecentPlaces() {
            const container = document.getElementById('recentPlacesContainer');
            
            if (allPlaces.length === 0) {
                container.innerHTML = `
                    <p class="text-slate-400 text-sm py-4">لا توجد أماكن مضافة بعد، كن أول من يضيف! 🎉</p>
                `;
                return;
            }

            // أحدث 3 أماكن فقط
            const recent = allPlaces.slice(0, 3);
            container.innerHTML = '';

            recent.forEach(place => {
                const imageUrl = place.images && place.images.length > 0 
                    ? place.images[0] 
                    : null;
                
                const card = document.createElement('div');
                card.className = 'flex-shrink-0 w-48 bg-slate-800/60 border border-slate-700 rounded-xl overflow-hidden cursor-pointer';
                card.innerHTML = `
                    ${imageUrl 
                        ? `<img src="${imageUrl}" class="w-full h-24 object-cover">`
                        : `<div class="w-full h-24 bg-slate-700 flex items-center justify-center"><i class="fa fa-map-marker text-2xl text-slate-500"></i></div>`
                    }
                    <div class="p-3">
                        <h4 class="font-bold text-sm truncate">${place.name}</h4>
                        <p class="text-xs text-slate-400">${place.city}</p>
                        <div class="text-yellow-400 text-xs mt-1">
                            ${'★'.repeat(place.rating || 0)}${'☆'.repeat(5 - (place.rating || 0))}
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `place-detail.html?id=${encodeURIComponent(place.id)}`;
                });
                container.appendChild(card);
            });
        }

        function filterContent(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderCities();
                renderRecentPlaces();
                return;
            }

            // تصفية المدن
            const filteredCities = allCities.filter(c => 
                c.name.toLowerCase().includes(query)
            );
            
            // تصفية الأماكن
            const filteredPlaces = allPlaces.filter(p => 
                p.name.toLowerCase().includes(query) ||
                p.city.toLowerCase().includes(query) ||
                p.category?.toLowerCase().includes(query)
            );

            // عرض النتائج
            if (filteredCities.length > 0 || filteredPlaces.length > 0) {
                const container = document.getElementById('citiesContainer');
                container.innerHTML = '<h3 class="col-span-2 text-sm font-medium text-slate-400 mb-2">النتائج</h3>';
                document.getElementById('noCitiesState').classList.add('hidden');
                container.classList.remove('hidden');

                filteredCities.forEach(city => {
                    const placeCount = allPlaces.filter(p => p.city === city.name).length;
                    const card = document.createElement('div');
                    card.className = 'city-card border border-slate-700 rounded-xl p-4';
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-lg font-bold mb-1">${city.name}</h3>
                                <p class="text-sm text-slate-400">${placeCount} مكان</p>
                            </div>
                            <div class="w-12 h-12 bg-secondary/20 rounded-full flex items-center justify-center">
                                <i class="fa fa-folder-open text-secondary text-xl"></i>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = `city.html?name=${encodeURIComponent(city.name)}`;
                    });
                    container.appendChild(card);
                });

                filteredPlaces.forEach(place => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800/60 border border-slate-700 rounded-xl p-4';
                    card.innerHTML = `
                        <h4 class="font-bold">${place.name}</h4>
                        <p class="text-sm text-slate-400">${place.city} · ${place.category}</p>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = `place-detail.html?id=${encodeURIComponent(place.id)}`;
                    });
                    container.appendChild(card);
                });
            }
        }

        function openCityModal() {
            document.getElementById('addCityModal').classList.remove('hidden');
            document.getElementById('newCityName').focus();
        }

        function closeCityModal() {
            document.getElementById('addCityModal').classList.add('hidden');
            document.getElementById('newCityName').value = '';
        }

        async function handleAddCity() {
            const name = document.getElementById('newCityName').value.trim();
            if (!name) {
                alert('أدخل اسم المدينة');
                return;
            }

            const exists = allCities.some(c => c.name.trim() === name);
            if (exists) {
                alert('المدينة موجودة مسبقاً ✅');
                closeCityModal();
                return;
            }

            try {
                await addCity(name, currentUser.uid, currentUser.name || 'مستخدم');
                alert('✅ تمت إضافة المدينة بنجاح!');
                closeCityModal();
                await loadAllData(); // إعادة تحميل البيانات
            } catch (error) {
                console.error(error);
                alert('❌ حدث خطأ أثناء الإضافة');
            }
        }
    </script>
</body>
</html>
