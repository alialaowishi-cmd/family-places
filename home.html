<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007AFF',
                        primaryLight: 'rgba(0, 122, 255, 0.08)',
                        secondary: '#5E5CE6',
                        glassBg: 'rgba(255, 255, 255, 0.72)',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(180deg, rgba(0, 122, 255, 0.04) 0%, rgba(94, 92, 230, 0.03) 100%);
            min-height: 100vh;
            padding-bottom: 85px;
            font-family: 'Tajawal', sans-serif;
        }
        .glass-ios {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .card-ios {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: saturate(180%) blur(16px);
            border: 1px solid rgba(0, 122, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.2, 0, 0.2, 1);
        }
        .card-ios:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.08);
            border-color: rgba(0, 122, 255, 0.12);
        }
        .bottom-nav {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: saturate(180%) blur(25px);
            -webkit-backdrop-filter: saturate(180%) blur(25px);
            border-top: 1px solid rgba(0, 122, 255, 0.08);
        }
        .nav-item {
            transition: all 0.2s ease;
        }
        .nav-item.active {
            color: #007AFF;
        }
        .nav-item:not(.active) {
            color: '#8E8E93';
        }
        .nav-item:hover {
            transform: translateY(-2px);
        }
        .nav-fab {
            background: linear-gradient(135deg, #007AFF 0%, #0066DD 100%);
            width: 50px;
            height: 50px;
            margin-top: -20px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        .nav-fab:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <header class="glass-ios sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold text-gray-800 tracking-tight" id="siteTitle">كشتات عائلة حسين العويشي</h1>
                <p class="text-xs text-gray-400 mt-0.5" id="siteSubtitle">اكتشفوا أماكننا المفضلة</p>
            </div>
            <button id="logoutBtn" class="w-9 h-9 bg-red-50 rounded-full flex items-center justify-center text-red-500 hover:bg-red-100 transition">
                <i class="fa fa-sign-out"></i>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-5">
        <!-- آخر الأماكن -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-semibold text-gray-700">آخر الأماكن المضافة</h2>
            </div>
            <div id="recentPlaces" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-400 col-span-full text-center py-10 text-sm">جاري التحميل...</p>
            </div>
        </section>

        <!-- المدن -->
        <section>
            <h2 class="text-base font-semibold text-gray-700 mb-4">المدن</h2>
            <div id="citiesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-400 col-span-full text-center py-10 text-sm">لم تُضاف مدن بعد. كن أول من يضيف مدينة! 📍</p>
            </div>
        </section>
    </main>

    <!-- ✅ شريط التنقل السفلي الموحد والثابت -->
    <nav class="fixed bottom-0 left-0 right-0 bottom-nav z-50">
        <div class="max-w-lg mx-auto px-2 py-2.5 flex items-end justify-around">
            <!-- الرئيسية -->
            <button class="nav-item active flex flex-col items-center gap-1 px-2 py-1" onclick="window.location.href='home.html'">
                <i class="fa fa-home text-lg"></i>
                <span class="text-xs">الرئيسية</span>
            </button>

            <!-- إضافة مدينة -->
            <button id="navAddCity" class="nav-item flex flex-col items-center gap-1 px-2 py-1 text-gray-500">
                <i class="fa fa-building-o text-lg"></i>
                <span class="text-xs">مدينة</span>
            </button>

            <!-- زر المنتصف: إضافة مكان -->
            <button id="navAddPlace" class="nav-fab rounded-full flex items-center justify-center text-white text-xl">
                <i class="fa fa-plus"></i>
            </button>

            <!-- حسابي -->
            <button id="navUser" class="nav-item flex flex-col items-center gap-1 px-2 py-1 text-gray-500">
                <i class="fa fa-user text-lg"></i>
                <span class="text-xs">حسابي</span>
            </button>

            <!-- المشرف -->
            <button id="navAdmin" class="nav-item flex flex-col items-center gap-1 px-2 py-1 text-gray-500 hidden" onclick="window.location.href='admin-dashboard.html'">
                <i class="fa fa-cog text-lg"></i>
                <span class="text-xs">المشرف</span>
            </button>
        </div>
    </nav>

    <!-- نافذة إضافة مدينة -->
    <div id="addCityModal" class="fixed inset-0 bg-black/35 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="glass-ios rounded-3xl p-6 w-full max-w-sm mx-4 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800 mb-5">إضافة مدينة جديدة</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-2">اسم المدينة</label>
                    <input type="text" id="cityNameInput" placeholder="مثال: الطائف"
                        class="w-full px-4 py-3 rounded-xl bg-gray-100/60 border-0 focus:ring-2 focus:ring-primary/20 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-2">صورة للمدينة (اختياري)</label>
                    <input type="file" id="cityImageInput" accept="image/*"
                        class="w-full text-sm text-gray-500 file:mr-2 file:bg-primaryLight file:text-primary file:rounded-lg file:border-0 file:px-3 file:py-1.5">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button id="cancelCityBtn" class="flex-1 px-4 py-3 rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200/80 text-sm font-medium">إلغاء</button>
                <button id="saveCityBtn" class="flex-1 px-4 py-3 rounded-xl bg-primary text-white hover:bg-primary/90 text-sm font-medium">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getCities, getPlaces, addCity, getSettings, isUserLoggedIn, isAdmin, logout, uploadImage } from './auth.js';

        if (!isUserLoggedIn()) {
            window.location.href = 'login.html';
        }

        const logoutBtn = document.getElementById('logoutBtn');
        const navAddCity = document.getElementById('navAddCity');
        const navAddPlace = document.getElementById('navAddPlace');
        const navUser = document.getElementById('navUser');
        const navAdmin = document.getElementById('navAdmin');
        const citiesContainer = document.getElementById('citiesContainer');
        const recentPlaces = document.getElementById('recentPlaces');
        const addCityModal = document.getElementById('addCityModal');
        const cancelCityBtn = document.getElementById('cancelCityBtn');
        const saveCityBtn = document.getElementById('saveCityBtn');
        const cityNameInput = document.getElementById('cityNameInput');
        const cityImageInput = document.getElementById('cityImageInput');

        // إظهار زر المشرف إذا كان المستخدم مديراً
        if (isAdmin()) navAdmin.classList.remove('hidden');

        async function loadData() {
            const settings = await getSettings();
            document.getElementById('siteTitle').textContent = settings.siteTitle;
            document.getElementById('siteSubtitle').textContent = settings.bannerText;

            const cities = await getCities();
            renderCities(cities);

            const places = await getPlaces();
            renderRecentPlaces(places.slice(0, 6));
        }

        function renderCities(cities) {
            if (cities.length === 0) {
                citiesContainer.innerHTML = '<p class="text-gray-400 col-span-full text-center py-10 text-sm">لم تُضاف مدن بعد. كن أول من يضيف مدينة! 📍</p>';
                return;
            }
            citiesContainer.innerHTML = cities.map(city => `
                <div class="card-ios rounded-2xl p-4 cursor-pointer overflow-hidden" data-city="${city.name}">
                    <img src="${city.image || 'https://picsum.photos/seed/'+encodeURIComponent(city.name)+'/600/300.jpg'}" 
                        alt="${city.name}" class="w-full h-28 object-cover rounded-xl mb-3">
                    <h3 class="text-base font-bold text-gray-800">${city.name}</h3>
                    <p class="text-xs text-gray-400 mt-1">انقر لعرض الأماكن</p>
                </div>
            `).join('');

            document.querySelectorAll('.card-ios').forEach(card => {
                card.addEventListener('click', () => {
                    const cityName = card.dataset.city;
                    window.location.href = `city.html?name=${encodeURIComponent(cityName)}`;
                });
            });
        }

        function renderRecentPlaces(places) {
            if (places.length === 0) {
                recentPlaces.innerHTML = '<p class="text-gray-400 col-span-full text-center py-10 text-sm">لم تُضاف أماكن بعد. أضف أول مكان الآن! 📍</p>';
                return;
            }
            recentPlaces.innerHTML = places.map(place => `
                <div class="card-ios rounded-2xl p-4 cursor-pointer overflow-hidden" data-place-id="${place.id}">
                    <img src="${place.images?.[0] || 'https://picsum.photos/seed/'+place.id+'/600/300.jpg'}" 
                        alt="${place.name}" class="w-full h-28 object-cover rounded-xl mb-3">
                    <h3 class="font-semibold text-gray-800">${place.name}</h3>
                    <p class="text-xs text-gray-400 mt-0.5">${place.city}${place.category ? ' • ' + place.category : ''}</p>
                    <div class="flex items-center mt-2 text-yellow-400 text-xs">
                        ${'★'.repeat(place.rating || 0)}${'☆'.repeat(5 - (place.rating || 0))}
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('[data-place-id]').forEach(card => {
                card.addEventListener('click', () => {
                    window.location.href = `place-detail.html?id=${card.dataset.placeId}`;
                });
            });
        }

        logoutBtn.addEventListener('click', () => {
            logout();
            window.location.href = 'login.html';
        });

        navAddCity.addEventListener('click', () => {
            addCityModal.classList.remove('hidden');
            cityNameInput.value = '';
        });

        cancelCityBtn.addEventListener('click', () => {
            addCityModal.classList.add('hidden');
        });

        saveCityBtn.addEventListener('click', async () => {
            const name = cityNameInput.value.trim();
            if (!name) return alert('أدخل اسم المدينة');
            
            let imageUrl = '';
            if (cityImageInput.files[0]) {
                const result = await uploadImage(cityImageInput.files[0]);
                imageUrl = result.url;
            }
            
            await addCity({ name: name, image: imageUrl });
            addCityModal.classList.add('hidden');
            loadData();
        });

        navAddPlace.addEventListener('click', () => {
            window.location.href = 'add-place.html';
        });

        navUser.addEventListener('click', () => {
            alert('حسابي قيد التطوير');
        });

        loadData();
    </script>
</body>
</html>
