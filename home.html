<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                        light: '#f0fdf4',
                        dark: '#14532d',
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        button, .cursor-pointer { cursor: pointer !important; }
        body { padding-top: 72px; background-color: #fafafa; }
        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #16a34a 0%, #15803d 50%, #14532d 100%);
        }
        .btn-clickable {
            position: relative;
            z-index: 10;
            pointer-events: auto !important;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- 🔐 شاشة تسجيل الدخول -->
    <div id="authScreen" class="auth-screen fixed inset-0 z-[60] overflow-auto">
        <div class="w-full max-w-md px-4 py-8">
            <div class="text-center mb-8">
                <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa fa-leaf text-white text-4xl"></i>
                </div>
                <h1 id="siteTitle" class="text-3xl font-bold text-white mb-2">كشتات</h1>
                <p class="text-green-100 text-lg">عائلة حسين العويشي</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-2xl">
                <h3 class="text-xl font-bold text-gray-800 mb-2 text-center">مرحباً بك</h3>
                <p class="text-gray-500 text-sm mb-6 text-center">سجّل الدخول لاستكشاف الأماكن</p>
                
                <div id="loginFormMain">
                    <button id="adminQuickLoginMain" class="btn-clickable w-full py-3 rounded-xl font-semibold text-amber-700 flex items-center justify-center gap-2 border-2 border-amber-500 bg-amber-50 mb-4 hover:bg-amber-100 transition-colors">
                        <i class="fa fa-shield"></i>
                        <span>الدخول كمشرف</span>
                    </button>
                    <p class="text-xs text-center text-gray-400 mb-4">كلمة المرور: admin123</p>
                    
                    <div class="relative mb-5">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                        <div class="relative flex justify-center text-sm"><span class="px-3 bg-white text-gray-400">أو حساب شخصي</span></div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-medium mb-1.5">البريد الإلكتروني</label>
                        <input type="email" id="emailInputMain" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="example@email.com">
                    </div>
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-medium mb-1.5">كلمة المرور</label>
                        <input type="password" id="passwordInputMain" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40" placeholder="••••••••">
                    </div>
                    
                    <button id="loginSubmitMain" class="btn-clickable w-full bg-gradient-to-r from-primary to-secondary text-white py-3 rounded-xl font-semibold hover:opacity-90 transition-opacity">
                        تسجيل الدخول
                    </button>
                    
                    <p class="text-center mt-4 text-sm text-gray-600">
                        ليس لديك حساب؟
                        <button type="button" id="showRegisterMain" class="btn-clickable text-primary font-semibold hover:underline">إنشاء حساب جديد</button>
                    </p>
                </div>

                <div id="registerFormMain" class="hidden">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-medium mb-1.5">الاسم الكامل</label>
                        <input type="text" id="nameInputMain" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-medium mb-1.5">البريد الإلكتروني</label>
                        <input type="email" id="regEmailInputMain" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40">
                    </div>
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-medium mb-1.5">كلمة المرور</label>
                        <input type="password" id="regPasswordInputMain" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40">
                    </div>
                    
                    <button type="button" id="registerSubmitMain" class="btn-clickable w-full bg-gradient-to-r from-primary to-secondary text-white py-3 rounded-xl font-semibold hover:opacity-90 transition-opacity">
                        إنشاء حساب
                    </button>
                    
                    <p class="text-center mt-4 text-sm text-gray-600">
                        لديك حساب؟
                        <button type="button" id="showLoginMain" class="btn-clickable text-primary font-semibold hover:underline">تسجيل الدخول</button>
                    </p>
                </div>

                <div id="authErrorMain" class="mt-4 text-red-500 text-sm text-center hidden bg-red-50 p-3 rounded-lg"></div>
            </div>
            <p class="text-center text-green-200 text-xs mt-4">© 2026 كشتات - عائلة حسين العويشي</p>
        </div>
    </div>

    <!-- باقي محتوى الموقع كما هو -->
    <div id="mainContent" class="hidden">
        <div class="flex items-center justify-center min-h-screen text-gray-600">
            <p>الموقع يعمل بنجاح ✅</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const ADMIN_EMAIL = "Alihossin28@gmail.com";
        const ADMIN_PASSWORD = "admin123";

        // تبديل النماذج
        document.getElementById('showRegisterMain').addEventListener('click', () => {
            document.getElementById('loginFormMain').classList.add('hidden');
            document.getElementById('registerFormMain').classList.remove('hidden');
        });
        document.getElementById('showLoginMain').addEventListener('click', () => {
            document.getElementById('registerFormMain').classList.add('hidden');
            document.getElementById('loginFormMain').classList.remove('hidden');
        });

        // ملء بيانات المشرف تلقائياً
        document.getElementById('adminQuickLoginMain').addEventListener('click', () => {
            document.getElementById('emailInputMain').value = ADMIN_EMAIL;
            document.getElementById('passwordInputMain').value = ADMIN_PASSWORD;
            document.getElementById('authErrorMain').classList.add('hidden');
        });

        // تسجيل الدخول
        document.getElementById('loginSubmitMain').addEventListener('click', async () => {
            const email = document.getElementById('emailInputMain').value.trim();
            const password = document.getElementById('passwordInputMain').value;
            const errorEl = document.getElementById('authErrorMain');
            errorEl.classList.add('hidden');

            if (!email || !password) {
                errorEl.textContent = '❌ أدخل البريد الإلكتروني وكلمة المرور';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                let msg = '❌ بيانات الدخول غير صحيحة';
                if (err.code === 'auth/user-not-found') {
                    msg = '❌ الحساب غير موجود! أنشئ حساباً جديداً أولاً';
                } else if (err.code === 'auth/wrong-password') {
                    msg = '❌ كلمة المرور غير صحيحة';
                }
                errorEl.textContent = msg;
                errorEl.classList.remove('hidden');
            }
        });

        // إنشاء حساب جديد
        document.getElementById('registerSubmitMain').addEventListener('click', async () => {
            const name = document.getElementById('nameInputMain').value.trim();
            const email = document.getElementById('regEmailInputMain').value.trim();
            const password = document.getElementById('regPasswordInputMain').value;
            const errorEl = document.getElementById('authErrorMain');
            errorEl.classList.add('hidden');

            if (!name || !email || !password) {
                errorEl.textContent = '❌ أدخل جميع البيانات المطلوبة';
                errorEl.classList.remove('hidden');
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (err) {
                let msg = '❌ حدث خطأ أثناء التسجيل';
                if (err.code === 'auth/email-already-in-use') {
                    msg = '❌ هذا البريد مستخدم بالفعل! سجل الدخول بدلاً من ذلك';
                }
                errorEl.textContent = msg;
                errorEl.classList.remove('hidden');
            }
        });

        // حالة المصادقة
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                console.log('✅ تم تسجيل الدخول بنجاح:', user.email);
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainContent').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
