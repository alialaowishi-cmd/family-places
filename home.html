<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: #0F172A;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .city-card {
            transition: all 0.2s ease;
        }
        .city-card:active {
            transform: scale(0.98);
        }
        .nav-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .nav-btn:active {
            transform: scale(0.95);
        }
        .skeleton {
            background: linear-gradient(90deg, #1E293B 25%, #334155 50%, #1E293B 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s infinite;
        }
        @keyframes skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .sticky-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #1E293B;
        }
    </style>
</head>
<body class="text-white">
    <!-- رأس الصفحة -->
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">كشتات عائلة حسين العويشي</h1>
                <p class="text-sm text-slate-400">اكتشفوا أماكننا المفضلة</p>
            </div>
            <button id="logoutBtn" class="text-slate-400 hover:text-white transition p-2">
                <i class="fa fa-sign-out"></i>
            </button>
        </div>
    </header>

    <main class="px-4 py-4">
        <!-- آخر الأماكن المضافة -->
        <section class="mb-8">
            <h2 class="text-md font-semibold mb-3 flex items-center">
                <i class="fa fa-clock-o ml-2 text-secondary"></i>
                أحدث الأماكن المضافة
            </h2>
            <div id="recentPlaces" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- جاري التحميل -->
                <div class="skeleton h-24 rounded-xl"></div>
                <div class="skeleton h-24 rounded-xl"></div>
            </div>
        </section>

        <!-- المدن -->
        <section>
            <h2 class="text-md font-semibold mb-3 flex items-center">
                <i class="fa fa-map-marker ml-2 text-secondary"></i>
                المدن
            </h2>
            <div id="citiesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- جاري التحميل -->
                <div class="skeleton h-32 rounded-2xl"></div>
                <div class="skeleton h-32 rounded-2xl"></div>
            </div>
        </section>

        <!-- رسالة عند عدم وجود بيانات -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa fa-map-o text-6xl text-slate-600 mb-4"></i>
            <h3 class="text-lg font-medium text-slate-400">لم تُضاف مدن بعد</h3>
            <p class="text-sm text-slate-500 mt-1">كن أول من يضيف مدينة! 📍</p>
        </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="sticky-nav px-2 py-3">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button id="navHome" class="nav-btn flex flex-col items-center text-xs text-secondary">
                <i class="fa fa-home text-lg mb-1"></i>
                الرئيسية
            </button>
            <button id="navCity" class="nav-btn flex flex-col items-center text-xs text-slate-400">
                <i class="fa fa-building text-lg mb-1"></i>
                مدينة
            </button>
            <button id="navAdd" class="nav-btn flex flex-col items-center text-xs">
                <div class="w-12 h-12 btn-primary rounded-full flex items-center justify-center -mt-6 shadow-lg">
                    <i class="fa fa-plus text-xl"></i>
                </div>
            </button>
            <button id="navAccount" class="nav-btn flex flex-col items-center text-xs text-slate-400">
                <i class="fa fa-user text-lg mb-1"></i>
                حسابي
            </button>
            <button id="navAdmin" class="nav-btn flex flex-col items-center text-xs text-slate-400">
                <i class="fa fa-cog text-lg mb-1"></i>
                المشرف
            </button>
        </div>
    </nav>

    <!-- نافذة إضافة مدينة -->
    <div id="addCityModal" class="hidden fixed inset-0 z-200 flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-center">إضافة مدينة جديدة</h3>
            <input type="text" id="newCityInput" placeholder="اسم المدينة" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white mb-4">
            <div class="flex gap-3">
                <button id="cancelCityBtn" class="flex-1 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 transition">إلغاء</button>
                <button id="saveCityBtn" class="flex-1 btn-primary py-3 rounded-lg font-medium">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            getCurrentUser, isAdmin, logout,
            getCities, addCity, getPlaces
        } from './auth.js';

        // التحقق من تسجيل الدخول
        if (!getCurrentUser()) {
            window.location.href = 'login.html';
        }

        // العناصر
        const citiesContainer = document.getElementById('citiesContainer');
        const recentPlaces = document.getElementById('recentPlaces');
        const emptyState = document.getElementById('emptyState');
        const logoutBtn = document.getElementById('logoutBtn');
        
        // أزرار التنقل
        const navHome = document.getElementById('navHome');
        const navCity = document.getElementById('navCity');
        const navAdd = document.getElementById('navAdd');
        const navAccount = document.getElementById('navAccount');
        const navAdmin = document.getElementById('navAdmin');
        
        // نافذة إضافة مدينة
        const addCityModal = document.getElementById('addCityModal');
        const newCityInput = document.getElementById('newCityInput');
        const cancelCityBtn = document.getElementById('cancelCityBtn');
        const saveCityBtn = document.getElementById('saveCityBtn');

        // حالة التحميل
        let isLoading = false;

        // ==========================================
        // تحميل المدن
        // ==========================================
        async function loadCities() {
            if (isLoading) return;
            isLoading = true;
            
            // عرض حالة التحميل
            citiesContainer.innerHTML = `
                <div class="skeleton h-32 rounded-2xl"></div>
                <div class="skeleton h-32 rounded-2xl"></div>
            `;
            emptyState.classList.add('hidden');

            try {
                const cities = await getCities();
                isLoading = false;

                if (!cities || cities.length === 0) {
                    citiesContainer.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                // ترتيب المدن أبجدياً
                cities.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

                citiesContainer.innerHTML = '';
                cities.forEach(city => {
                    const card = document.createElement('div');
                    card.className = 'city-card bg-slate-800/60 border border-slate-700 rounded-2xl p-4 cursor-pointer hover:border-secondary/50 hover:bg-slate-700/60';
                    card.innerHTML = `
                        <h3 class="text-lg font-semibold mb-1">${city.name}</h3>
                        <p class="text-sm text-slate-400">انقر لعرض الأماكن</p>
                    `;
                    // ✅ إضافة حدث النقر مباشرة
                    card.addEventListener('click', () => {
                        window.location.href = `city.html?name=${encodeURIComponent(city.name)}`;
                    });
                    citiesContainer.appendChild(card);
                });
            } catch (error) {
                console.error('❌ خطأ تحميل المدن:', error);
                isLoading = false;
                citiesContainer.innerHTML = `
                    <div class="col-span-2 text-center py-8 text-slate-400">
                        <i class="fa fa-exclamation-triangle text-2xl text-amber-500 mb-2"></i>
                        <p>حدث خطأ في تحميل المدن</p>
                        <button onclick="loadCities()" class="mt-2 px-4 py-2 bg-secondary/20 text-secondary rounded-lg text-sm">إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        // ==========================================
        // تحميل أحدث الأماكن
        // ==========================================
        async function loadRecentPlaces() {
            try {
                const places = await getPlaces();
                
                if (!places || places.length === 0) {
                    recentPlaces.innerHTML = `
                        <div class="col-span-2 text-center py-4 text-slate-500 text-sm">
                            لم تُضاف أماكن بعد. كن أول من يضيف مكاناً! 📍
                        </div>
                    `;
                    return;
                }

                // أحدث 4 أماكن فقط
                const recent = places.slice(-4).reverse();
                
                recentPlaces.innerHTML = '';
                recent.forEach(place => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800/60 border border-slate-700 rounded-xl p-3 cursor-pointer hover:border-secondary/50';
                    card.innerHTML = `
                        <h4 class="font-medium text-sm">${place.name}</h4>
                        <p class="text-xs text-slate-400">${place.city || 'بدون مدينة'} • ${place.category || 'أخرى'}</p>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = `place-detail.html?id=${place.id}`;
                    });
                    recentPlaces.appendChild(card);
                });
            } catch (error) {
                console.error('❌ خطأ تحميل الأماكن:', error);
                recentPlaces.innerHTML = '<div class="col-span-2 text-center py-4 text-red-400 text-sm">خطأ في تحميل الأماكن</div>';
            }
        }

        // ==========================================
        // أحداث النقر — ✅ جميع الأزرار تعمل الآن
        // ==========================================
        
        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                logout();
                window.location.href = 'login.html';
            }
        });

        // زر الرئيسية
        navHome.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // زر إضافة مدينة
        navCity.addEventListener('click', () => {
            addCityModal.classList.remove('hidden');
            newCityInput.focus();
        });

        // زر إضافة مكان
        navAdd.addEventListener('click', () => {
            window.location.href = 'add-place.html';
        });

        // زر حسابي
        navAccount.addEventListener('click', () => {
            alert('قيد التطوير 🚧');
        });

        // زر المشرف
        navAdmin.addEventListener('click', () => {
            if (isAdmin()) {
                window.location.href = 'admin-dashboard.html';
            } else {
                const password = prompt('أدخل كلمة مرور المشرف:');
                if (password === 'admin123') {
                    localStorage.setItem('currentUser', JSON.stringify({
                        name: 'المشرف',
                        isAdmin: true
                    }));
                    window.location.href = 'admin-dashboard.html';
                } else if (password) {
                    alert('كلمة المرور غير صحيحة ❌');
                }
            }
        });

        // إلغاء إضافة مدينة
        cancelCityBtn.addEventListener('click', () => {
            addCityModal.classList.add('hidden');
            newCityInput.value = '';
        });

        // حفظ مدينة جديدة
        saveCityBtn.addEventListener('click', async () => {
            const name = newCityInput.value.trim();
            if (!name) {
                alert('أدخل اسم المدينة');
                return;
            }

            saveCityBtn.disabled = true;
            saveCityBtn.innerHTML = '<i class="fa fa-spinner fa-spin ml-1"></i> جاري الحفظ...';

            try {
                await addCity({ name: name });
                alert('✅ تمت إضافة المدينة');
                addCityModal.classList.add('hidden');
                newCityInput.value = '';
                await loadCities();
            } catch (error) {
                console.error('❌ خطأ:', error);
                alert('حدث خطأ أثناء الإضافة');
            } finally {
                saveCityBtn.disabled = false;
                saveCityBtn.innerHTML = 'حفظ';
            }
        });

        // إغلاق النافذة عند النقر خارجها
        addCityModal.addEventListener('click', (e) => {
            if (e.target === addCityModal) {
                addCityModal.classList.add('hidden');
                newCityInput.value = '';
            }
        });

        // تحميل البيانات عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            loadCities();
            loadRecentPlaces();
        });
    </script>
</body>
</html>
