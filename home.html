<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                        danger: '#dc2626',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .city-card:hover { transform: translateY(-4px); }
        .place-card:hover { border-color: #16a34a; }
        .scroll-container { overflow-x: auto; scrollbar-width: thin; }
        .scroll-container::-webkit-scrollbar { height: 4px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 4px; }
        .action-btn { transition: all 0.2s ease; }
        .action-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- شريط التنقل العلوي -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold">كشتات عائلة حسين العويشي</h1>
                <div class="flex items-center gap-3">
                    <button id="userMenuBtn" class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
                        <i class="fa fa-user-circle text-lg"></i>
                    </button>
                    <button id="adminBtn" class="bg-amber-400/80 hover:bg-amber-400 px-3 py-1 rounded-lg text-sm font-medium hidden">
                        <i class="fa fa-cog ml-1"></i>المشرف
                    </button>
                    <button id="logoutBtn" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm hidden">
                        <i class="fa fa-sign-out ml-1"></i>خروج
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 🔘 زر إضافة مكان جديد ثابت -->
    <div class="fixed bottom-6 left-6 z-40">
        <button id="addPlaceFAB" class="bg-gradient-to-r from-accent to-amber-500 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl hover:scale-110 transition-all">
            <i class="fa fa-plus"></i>
        </button>
    </div>

    <!-- 👤 قائمة المستخدم المنسدلة -->
    <div id="userDropdown" class="fixed top-16 left-4 bg-white rounded-xl shadow-2xl p-5 w-72 z-50 hidden">
        <div class="text-center mb-4">
            <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-2">
                <i class="fa fa-user text-primary text-2xl"></i>
            </div>
            <h3 id="userNameDisplay" class="font-bold text-gray-800">زائر</h3>
            <p id="userEmailDisplay" class="text-sm text-gray-500"></p>
        </div>
        <hr class="my-3">
        <div class="space-y-2">
            <button id="myPlacesBtn" class="w-full text-right px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-700">
                <i class="fa fa-map-pin ml-2 text-primary"></i>أماكني المضافة
            </button>
            <button id="editProfileBtn" class="w-full text-right px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-700">
                <i class="fa fa-pencil ml-2 text-accent"></i>تعديل معلوماتي
            </button>
            <button id="loginRegisterBtn" class="w-full text-right px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-700">
                <i class="fa fa-sign-in ml-2 text-primary"></i>تسجيل الدخول
            </button>
        </div>
    </div>

    <main class="container mx-auto px-4 py-6">

        <!-- 🆕 أحدث الأماكن المضافة - شريط متحرك علوي -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-bolt text-accent"></i> أحدث الأماكن المضافة
                </h2>
            </div>
            <div id="recentPlacesScroll" class="scroll-container flex gap-4 pb-2">
                <div class="text-gray-500 text-sm py-4">جاري التحميل...</div>
            </div>
        </section>

        <hr class="my-6 border-gray-200">

        <!-- 📂 قسم عرض المدن -->
        <section id="citiesSection">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa fa-building text-primary"></i> المدن
            </h2>
            <div id="citiesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="text-center py-8 text-gray-500">جاري التحميل...</div>
            </div>
        </section>

        <!-- 👤 قسم أماكني المضافة (مخفي بشكل افتراضي) -->
        <section id="myPlacesSection" class="hidden mt-10">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa fa-map-pin text-primary"></i> أماكني المضافة
                </h2>
                <button id="backToCitiesBtn" class="text-sm text-primary hover:underline">
                    <i class="fa fa-arrow-right ml-1"></i> العودة للمدن
                </button>
            </div>
            <div id="myPlacesContainer" class="space-y-3">
                <div class="text-center py-8 text-gray-500">لم تقم بإضافة أي أماكن بعد</div>
            </div>
        </section>

    </main>

    <!-- ✏️ نافذة تعديل المكان -->
    <div id="editPlaceModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-gray-800 mb-4">تعديل المكان</h3>
            <form id="editPlaceForm" class="space-y-4">
                <input type="hidden" id="editPlaceId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اسم المكان</label>
                    <input type="text" id="editPlaceName" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">المدينة</label>
                    <input type="text" id="editPlaceCity" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">التصنيف</label>
                    <input type="text" id="editPlaceCategory" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">السعر</label>
                    <input type="text" id="editPlacePrice" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">رقم الجوال</label>
                    <input type="text" id="editPlacePhone" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">رابط الموقع</label>
                    <input type="url" id="editPlaceLocation" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الوصف</label>
                    <textarea id="editPlaceDescription" rows="3" class="w-full p-2.5 border rounded-lg"></textarea>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" id="cancelEditBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 rounded-lg">إلغاء</button>
                    <button type="submit" class="flex-1 bg-primary text-white py-2 rounded-lg hover:bg-secondary">حفظ التغييرات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🖼️ نافذة إضافة صور للمكان -->
    <div id="addImagesModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-bold text-gray-800 mb-4">إضافة صور للمكان</h3>
            <input type="hidden" id="imagePlaceId">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center mb-4 cursor-pointer hover:border-primary hover:bg-green-50" id="modalUploadTrigger">
                <input type="file" id="modalImageUpload" accept="image/*" multiple class="hidden">
                <i class="fa fa-cloud-upload text-3xl text-primary mb-2"></i>
                <p class="text-sm text-gray-600">اضغط لاختيار الصور</p>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">أو الصق رابط الصورة:</label>
                <div class="flex gap-2">
                    <input type="url" id="modalImageUrl" class="flex-1 p-2 border rounded-lg text-sm" placeholder="https://...">
                    <button id="modalAddUrlBtn" class="bg-primary text-white px-3 rounded-lg">إضافة</button>
                </div>
            </div>
            <div id="modalImagePreview" class="grid grid-cols-3 gap-2 mb-4"></div>
            <div class="flex gap-3">
                <button id="closeImagesModal" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 rounded-lg">إغلاق</button>
                <button id="saveImagesBtn" class="flex-1 bg-primary text-white py-2 rounded-lg hover:bg-secondary">حفظ الصور</button>
            </div>
        </div>
    </div>

    <!-- ⚠️ نافذة تأكيد الحذف -->
    <div id="deleteConfirmModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-4">
            <h3 class="text-lg font-bold text-gray-800 mb-2">حذف المكان</h3>
            <p class="text-sm text-gray-500 mb-4">هل أنت متأكد من حذف هذا المكان؟ لا يمكن التراجع عن هذا الإجراء.</p>
            <div class="flex gap-3">
                <button id="cancelDeleteBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2.5 rounded-lg">إلغاء</button>
                <button id="confirmDeleteBtn" class="flex-1 bg-danger text-white py-2.5 rounded-lg hover:bg-red-700">حذف</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where, orderBy, limit, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "Alihossin28@gmail.com";
        let currentUser = null;
        let isAdmin = false;
        let allPlaces = [];
        let allCities = [];
        let currentDeletePlaceId = null;
        let tempNewImages = [];

        // عناصر الصفحة
        const userMenuBtn = document.getElementById('userMenuBtn');
        const userDropdown = document.getElementById('userDropdown');
        const loginRegisterBtn = document.getElementById('loginRegisterBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminBtn = document.getElementById('adminBtn');
        const myPlacesBtn = document.getElementById('myPlacesBtn');
        const editProfileBtn = document.getElementById('editProfileBtn');
        const addPlaceFAB = document.getElementById('addPlaceFAB');
        const recentPlacesScroll = document.getElementById('recentPlacesScroll');
        const citiesContainer = document.getElementById('citiesContainer');
        const citiesSection = document.getElementById('citiesSection');
        const myPlacesSection = document.getElementById('myPlacesSection');
        const myPlacesContainer = document.getElementById('myPlacesContainer');
        const backToCitiesBtn = document.getElementById('backToCitiesBtn');

        // تبديل قائمة المستخدم
        userMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', () => userDropdown.classList.add('hidden'));
        userDropdown.addEventListener('click', (e) => e.stopPropagation());

        // التحقق من حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isAdmin = user.email === ADMIN_EMAIL;
                document.getElementById('userNameDisplay').textContent = user.displayName || 'مستخدم';
                document.getElementById('userEmailDisplay').textContent = user.email;
                loginRegisterBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                myPlacesBtn.classList.remove('hidden');
                editProfileBtn.classList.remove('hidden');
                if (isAdmin) adminBtn.classList.remove('hidden');
            } else {
                isAdmin = false;
                document.getElementById('userNameDisplay').textContent = 'زائر';
                document.getElementById('userEmailDisplay').textContent = '';
                loginRegisterBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                myPlacesBtn.classList.add('hidden');
                editProfileBtn.classList.add('hidden');
                adminBtn.classList.add('hidden');
                myPlacesSection.classList.add('hidden');
                citiesSection.classList.remove('hidden');
            }
            loadAllData();
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            userDropdown.classList.add('hidden');
        });

        // الانتقال لصفحة المشرف
        adminBtn.addEventListener('click', () => {
            window.location.href = 'admin-settings.html';
        });

        // زر إضافة مكان جديد
        addPlaceFAB.addEventListener('click', () => {
            if (!currentUser) {
                alert('يرجى تسجيل الدخول أولاً');
                window.location.href = 'login.html';
                return;
            }
            window.location.href = 'add-place.html';
        });

        // عرض أماكني المضافة
        myPlacesBtn.addEventListener('click', () => {
            if (!currentUser) return;
            userDropdown.classList.add('hidden');
            citiesSection.classList.add('hidden');
            myPlacesSection.classList.remove('hidden');
            loadMyPlaces();
        });

        backToCitiesBtn.addEventListener('click', () => {
            myPlacesSection.classList.add('hidden');
            citiesSection.classList.remove('hidden');
        });

        editProfileBtn.addEventListener('click', () => {
            alert('قريباً: صفحة تعديل الملف الشخصي');
            userDropdown.classList.add('hidden');
        });

        loginRegisterBtn.addEventListener('click', () => {
            window.location.href = 'login.html';
        });

        // تحميل جميع البيانات
        async function loadAllData() {
            await Promise.all([
                loadRecentPlaces(),
                loadCitiesWithPlaces()
            ]);
        }

        // تحميل أحدث الأماكن
        async function loadRecentPlaces() {
            try {
                const q = query(collection(db, 'places'), orderBy('createdAt', 'desc'), limit(8));
                const snap = await getDocs(q);
                const places = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                if (places.length === 0) {
                    recentPlacesScroll.innerHTML = '<div class="text-gray-500 text-sm py-4">لا توجد أماكن مضافة بعد</div>';
                    return;
                }

                recentPlacesScroll.innerHTML = places.map(p => `
                    <div class="flex-shrink-0 w-56 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="h-32 bg-gray-100 overflow-hidden">
                            ${p.images && p.images.length > 0 
                                ? `<img src="${p.images[0]}" class="w-full h-full object-cover" alt="${p.name}">`
                                : `<div class="w-full h-full flex items-center justify-center text-gray-400"><i class="fa fa-image text-2xl"></i></div>`
                            }
                        </div>
                        <div class="p-3">
                            <h4 class="font-bold text-gray-800 text-sm truncate">${p.name}</h4>
                            <p class="text-xs text-gray-500">${p.city}</p>
                            <div class="flex items-center text-amber-400 text-xs mt-1">
                                ${'★'.repeat(p.rating || 0)}${'☆'.repeat(5 - (p.rating || 0))}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                recentPlacesScroll.innerHTML = '<div class="text-red-500 text-sm py-4">خطأ في التحميل</div>';
            }
        }

        // تحميل المدن مع أماكنها
        async function loadCitiesWithPlaces() {
            try {
                // تحميل المدن
                const citiesSnap = await getDocs(collection(db, 'cities'));
                allCities = citiesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                allCities.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

                // تحميل جميع الأماكن
                const placesSnap = await getDocs(collection(db, 'places'));
                allPlaces = placesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                // تجميع الأماكن حسب المدينة
                const citiesWithPlaces = {};
                
                // إضافة المدن من قاعدة البيانات أولاً
                allCities.forEach(c => {
                    citiesWithPlaces[c.name] = { cityId: c.id, places: [] };
                });
                // إضافة الأماكن لمدنها
                allPlaces.forEach(p => {
                    if (!citiesWithPlaces[p.city]) {
                        citiesWithPlaces[p.city] = { cityId: null, places: [] };
                    }
                    citiesWithPlaces[p.city].places.push(p);
                });

                renderCities(citiesWithPlaces);
            } catch (err) {
                console.error(err);
                citiesContainer.innerHTML = '<div class="text-center py-8 text-red-500">❌ خطأ في تحميل البيانات</div>';
            }
        }

        function renderCities(citiesWithPlaces) {
            if (Object.keys(citiesWithPlaces).length === 0) {
                citiesContainer.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">لا توجد مدن مضافة بعد</div>';
                return;
            }

            citiesContainer.innerHTML = Object.entries(citiesWithPlaces).map(([cityName, data]) => {
                const places = data.places;
                return `
                    <div class="city-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transition-all duration-300">
                        <!-- رأس بطاقة المدينة مع أزرار التحكم -->
                        <div class="bg-gradient-to-r from-primary/10 to-secondary/10 p-4 border-b border-gray-100">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                                    <i class="fa fa-map-marker text-primary"></i> ${cityName}
                                    <span class="text-sm font-normal text-gray-500">(${places.length})</span>
                                </h3>
                                ${isAdmin ? `
                                    <div class="flex gap-1">
                                        <button class="action-btn text-xs bg-blue-50 text-blue-600 p-1.5 rounded-lg hover:bg-blue-100" title="تعديل المدينة">
                                            <i class="fa fa-pencil"></i>
                                        </button>
                                        <button class="action-btn text-xs bg-danger/10 text-danger p-1.5 rounded-lg hover:bg-danger/20" title="حذف المدينة">
                                            <i class="fa fa-trash"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        
                        <!-- أماكن المدينة -->
                        <div class="p-3 space-y-3 max-h-96 overflow-y-auto">
                            ${places.length === 0 
                                ? '<p class="text-sm text-gray-400 text-center py-2">لا توجد أماكن مضافة</p>'
                                : places.map(p => renderPlaceCard(p)).join('')
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPlaceCard(p) {
            const isOwner = currentUser && p.createdBy === currentUser.uid;
            const canModify = isOwner || isAdmin;
            
            return `
                <div class="place-card border border-gray-200 rounded-xl p-3 hover:border-primary transition-colors">
                    <div class="flex gap-3">
                        <!-- صورة المكان -->
                        <div class="w-20 h-20 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0">
                            ${p.images && p.images.length > 0 
                                ? `<img src="${p.images[0]}" class="w-full h-full object-cover" alt="${p.name}">`
                                : `<div class="w-full h-full flex items-center justify-center text-gray-400"><i class="fa fa-image"></i></div>`
                            }
                        </div>
                        
                        <!-- معلومات المكان -->
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-gray-800 truncate">${p.name}</h4>
                            <p class="text-xs text-gray-500 mt-0.5">${p.category || 'غير مصنف'} ${p.price ? `• ${p.price}` : ''}</p>
                            <div class="flex items-center text-amber-400 text-xs mt-1">
                                ${'★'.repeat(p.rating || 0)}${'☆'.repeat(5 - (p.rating || 0))}
                            </div>
                            ${p.phone ? `<a href="tel:${p.phone}" class="text-xs text-primary hover:underline mt-1 inline-block"><i class="fa fa-phone ml-1"></i>${p.phone}</a>` : ''}
                            ${p.location ? `<a href="${p.location}" target="_blank" class="text-xs text-accent hover:underline mt-1 ml-2 inline-block"><i class="fa fa-map-o ml-1"></i>عرض في الخريطة</a>` : ''}
                        </div>
                    </div>
                    
                    <!-- أزرار التحكم بالمكان -->
                    ${canModify ? `
                        <div class="flex gap-2 mt-3 pt-2 border-t border-gray-100">
                            <button data-place-id="${p.id}" class="edit-place-btn flex-1 text-xs bg-blue-50 text-blue-600 py-1.5 rounded-lg hover:bg-blue-100">
                                <i class="fa fa-pencil ml-1"></i>تعديل
                            </button>
                            <button data-place-id="${p.id}" class="add-images-btn flex-1 text-xs bg-green-50 text-green-600 py-1.5 rounded-lg hover:bg-green-100">
                                <i class="fa fa-camera ml-1"></i>صور
                            </button>
                            <button data-place-id="${p.id}" class="delete-place-btn flex-1 text-xs bg-danger/10 text-danger py-1.5 rounded-lg hover:bg-danger/20">
                                <i class="fa fa-trash ml-1"></i>حذف
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // تحميل أماكني المضافة
        async function loadMyPlaces() {
            if (!currentUser) return;
            try {
                const q = query(collection(db, 'places'), where('createdBy', '==', currentUser.uid), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                const myPlaces = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                if (myPlaces.length === 0) {
                    myPlacesContainer.innerHTML = '<div class="text-center py-8 text-gray-500">لم تقم بإضافة أي أماكن بعد<br><button onclick="window.location.href=\'add-place.html\'" class="mt-3 bg-primary text-white px-4 py-2 rounded-lg text-sm">إضافة مكان جديد</button></div>';
                    return;
                }

                myPlacesContainer.innerHTML = myPlaces.map(p => renderPlaceCard(p)).join('');
            } catch (err) {
                console.error(err);
                myPlacesContainer.innerHTML = '<div class="text-center py-8 text-red-500">❌ خطأ في التحميل</div>';
            }
        }

        // ربط أحداث الأزرار (تعمل ديناميكياً بعد تحميل المحتوى)
        document.addEventListener('click', async (e) => {
            // تعديل مكان
            if (e.target.closest('.edit-place-btn')) {
                const placeId = e.target.closest('.edit-place-btn').dataset.placeId;
                const place = allPlaces.find(p => p.id === placeId) || 
                    (await getDocs(query(collection(db, 'places'), where('__name__', '==', placeId)))).docs[0]?.data();
                if (!place) return;
                
                document.getElementById('editPlaceId').value = placeId;
                document.getElementById('editPlaceName').value = place.name || '';
                document.getElementById('editPlaceCity').value = place.city || '';
                document.getElementById('editPlaceCategory').value = place.category || '';
                document.getElementById('editPlacePrice').value = place.price || '';
                document.getElementById('editPlacePhone').value = place.phone || '';
                document.getElementById('editPlaceLocation').value = place.location || '';
                document.getElementById('editPlaceDescription').value = place.description || '';
                document.getElementById('editPlaceModal').classList.remove('hidden');
            }

            // إضافة صور
            if (e.target.closest('.add-images-btn')) {
                const placeId = e.target.closest('.add-images-btn').dataset.placeId;
                document.getElementById('imagePlaceId').value = placeId;
                tempNewImages = [];
                document.getElementById('modalImagePreview').innerHTML = '';
                document.getElementById('addImagesModal').classList.remove('hidden');
            }

            // حذف مكان
            if (e.target.closest('.delete-place-btn')) {
                currentDeletePlaceId = e.target.closest('.delete-place-btn').dataset.placeId;
                document.getElementById('deleteConfirmModal').classList.remove('hidden');
            }
        });

        // نافذة تعديل المكان
        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            document.getElementById('editPlaceModal').classList.add('hidden');
        });
        document.getElementById('editPlaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const placeId = document.getElementById('editPlaceId').value;
            try {
                await updateDoc(doc(db, 'places', placeId), {
                    name: document.getElementById('editPlaceName').value.trim(),
                    city: document.getElementById('editPlaceCity').value.trim(),
                    category: document.getElementById('editPlaceCategory').value.trim(),
                    price: document.getElementById('editPlacePrice').value.trim(),
                    phone: document.getElementById('editPlacePhone').value.trim(),
                    location: document.getElementById('editPlaceLocation').value.trim(),
                    description: document.getElementById('editPlaceDescription').value.trim(),
                    updatedAt: serverTimestamp()
                });
                document.getElementById('editPlaceModal').classList.add('hidden');
                await loadAllData();
                if (!myPlacesSection.classList.contains('hidden')) loadMyPlaces();
                alert('✅ تم التحديث بنجاح');
            } catch (err) {
                console.error(err);
                alert('❌ خطأ في التحديث');
            }
        });

        // نافذة إضافة الصور
        document.getElementById('modalUploadTrigger').addEventListener('click', () => {
            document.getElementById('modalImageUpload').click();
        });
        document.getElementById('modalImageUpload').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    tempNewImages.push(ev.target.result);
                    const preview = document.getElementById('modalImagePreview');
                    preview.innerHTML += `<img src="${ev.target.result}" class="w-full h-20 object-cover rounded-lg">`;
                };
                reader.readAsDataURL(file);
            });
        });
        document.getElementById('modalAddUrlBtn').addEventListener('click', () => {
            const url = document.getElementById('modalImageUrl').value.trim();
            if (!url) return;
            tempNewImages.push(url);
            const preview = document.getElementById('modalImagePreview');
            preview.innerHTML += `<img src="${url}" class="w-full h-20 object-cover rounded-lg" onerror="this.style.display='none'">`;
            document.getElementById('modalImageUrl').value = '';
        });
        document.getElementById('saveImagesBtn').addEventListener('click', async () => {
            const placeId = document.getElementById('imagePlaceId').value;
            if (tempNewImages.length === 0) {
                alert('لم تقم باختيار أي صور');
                return;
            }
            try {
                const placeRef = doc(db, 'places', placeId);
                const placeSnap = await getDocs(query(collection(db, 'places'), where('__name__', '==', placeId)));
                const currentImages = placeSnap.docs[0]?.data()?.images || [];
                await updateDoc(placeRef, {
                    images: [...currentImages, ...tempNewImages],
                    updatedAt: serverTimestamp()
                });
                document.getElementById('addImagesModal').classList.add('hidden');
                tempNewImages = [];
                document.getElementById('modalImagePreview').innerHTML = '';
                await loadAllData();
                alert('✅ تم حفظ الصور بنجاح');
            } catch (err) {
                console.error(err);
                alert('❌ خطأ في حفظ الصور');
            }
        });
        document.getElementById('closeImagesModal').addEventListener('click', () => {
            document.getElementById('addImagesModal').classList.add('hidden');
            tempNewImages = [];
        });

        // تأكيد الحذف
        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('deleteConfirmModal').classList.add('hidden');
            currentDeletePlaceId = null;
        });
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!currentDeletePlaceId) return;
            try {
                await deleteDoc(doc(db, 'places', currentDeletePlaceId));
                document.getElementById('deleteConfirmModal').classList.add('hidden');
                currentDeletePlaceId = null;
                await loadAllData();
                if (!myPlacesSection.classList.contains('hidden')) loadMyPlaces();
                alert('✅ تم الحذف بنجاح');
            } catch (err) {
                console.error(err);
                alert('❌ خطأ في الحذف');
            }
        });
    </script>
</body>
</html>
