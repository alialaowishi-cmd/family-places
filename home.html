<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6', light: '#F0FDF4', danger: '#EF4444' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%); min-height: 100vh; padding-bottom: 90px; }
        .city-card { transition: all 0.2s ease; cursor: pointer; }
        .city-card:active { transform: scale(0.97); }
        .place-card { transition: all 0.2s ease; cursor: pointer; }
        .place-card:active { transform: scale(0.97); }
        .section-title { border-right: 3px solid #22C55E; padding-right: 10px; }
        .notification-item { transition: all 0.15s ease; }
        .notification-item:active { background: #F0FDF4; }
        .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; background: #EF4444; color: white; font-size: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body>
    <header class="px-4 pt-8 pb-6 text-center">
        <h1 class="text-2xl font-bold text-gray-800">كشتات عائلة حسين العويشي</h1>
        <p class="text-gray-500 text-sm mt-1">اختر المدينة لعرض الأماكن أو تصفح الإضافات الجديدة</p>
    </header>

    <main class="px-4">
        <!-- قسم أحدث الأماكن المضافة -->
        <div class="mb-8">
            <h2 class="text-lg font-bold mb-4 section-title">
                <i class="fa fa-clock-o ml-2 text-primary"></i>
                أحدث الأماكن المضافة
            </h2>
            <div id="recentPlaces" class="space-y-3">
                <div class="text-center py-6 text-gray-400 text-sm">
                    لا توجد أماكن مضافة حتى الآن
                </div>
            </div>
        </div>

        <!-- قسم المدن -->
        <div>
            <h2 class="text-lg font-bold mb-4 section-title">
                <i class="fa fa-building ml-2 text-primary"></i>
                المدن
            </h2>
            <div id="citiesList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="text-center py-12 text-gray-400 col-span-full">
                    <i class="fa fa-folder-open text-5xl mb-4"></i>
                    <p>لا توجد مدن مضافة حتى الآن</p>
                    <p class="text-sm mt-1">أضف مدناً أولاً من الأسفل 👇</p>
                </div>
            </div>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg px-4 py-3 z-40">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-xs text-primary">
                <i class="fa fa-home text-lg"></i>
                <span>الرئيسية</span>
            </button>
            <button onclick="openAddCityModal()" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-building text-lg"></i>
                <span>إضافة مدينة</span>
            </button>
            <button onclick="window.location.href='add-place.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-plus-circle text-lg"></i>
                <span>إضافة مكان</span>
            </button>
            <button onclick="openNotificationsModal()" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary relative">
                <i class="fa fa-bell text-lg"></i>
                <span>الإشعارات</span>
                <span id="notificationsBadge" class="badge hidden">0</span>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-user text-lg"></i>
                <span>حسابي</span>
            </button>
        </div>
    </nav>

    <!-- ====================================== -->
    <!-- نافذة الإشعارات -->
    <!-- ====================================== -->
    <div id="notificationsModal" class="modal fixed inset-0 bg-black/50 z-50 items-end justify-center">
        <div class="w-full max-w-lg bg-white rounded-t-3xl p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa fa-bell text-primary"></i>
                    الإشعارات
                </h2>
                <div class="flex items-center gap-2">
                    <button onclick="markAllAsRead()" class="text-sm text-secondary">تحديد الكل كمقروء</button>
                    <button onclick="clearAllNotifications()" class="text-sm text-danger">مسح الكل</button>
                    <button onclick="closeNotificationsModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                        <i class="fa fa-times text-gray-500"></i>
                    </button>
                </div>
            </div>

            <div id="notificationsList" class="space-y-2">
                <div class="text-center py-10 text-gray-400">
                    <i class="fa fa-bell-o text-4xl mb-3"></i>
                    <p>لا توجد إشعارات حتى الآن</p>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة مدينة جديدة -->
    <div id="addCityModal" class="modal fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl p-6">
            <h3 class="text-lg font-bold mb-4 text-center">إضافة مدينة جديدة</h3>
            <input type="text" id="newCityName" placeholder="أدخل اسم المدينة" 
                class="w-full p-3.5 rounded-xl bg-gray-50 border border-gray-200 outline-none mb-4">
            <div class="flex gap-3">
                <button onclick="closeAddCityModal()" class="flex-1 p-3 rounded-xl bg-gray-100">إلغاء</button>
                <button onclick="saveNewCity()" class="flex-1 p-3 bg-primary text-white rounded-xl">إضافة ✅</button>
            </div>
        </div>
    </div>

    <script>
        // ======================================
        // دوال الإشعارات
        // ======================================
        function initNotifications() {
            // إنشاء مصفوفة الإشعارات إذا لم تكن موجودة
            if (!localStorage.getItem('notifications')) {
                localStorage.setItem('notifications', JSON.stringify([]));
            }
        }

        // إضافة إشعار جديد
        window.addNotification = function(place, type = 'new') {
            initNotifications();
            const notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
            
            let title, message;
            if (type === 'new') {
                title = '📍 مكان جديد مضاف';
                message = `أُضيف "${place.name}" في ${place.city || 'مدينة غير محددة'}`;
            } else if (type === 'updated') {
                title = '✏️ تم تحديث مكان';
                message = `تم تحديث "${place.name}" في ${place.city || 'مدينة غير محددة'}`;
            }

            const newNotification = {
                id: Date.now(),
                title: title,
                message: message,
                placeId: place.id,
                placeName: place.name,
                city: place.city,
                type: type,
                read: false,
                createdAt: new Date().toISOString()
            };

            notifications.unshift(newNotification);
            localStorage.setItem('notifications', JSON.stringify(notifications));
            updateNotificationsBadge();
        };

        // تحديث شارة الإشعارات
        function updateNotificationsBadge() {
            initNotifications();
            const notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
            const unreadCount = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notificationsBadge');
            
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // عرض قائمة الإشعارات
        function renderNotifications() {
            initNotifications();
            const notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
            const container = document.getElementById('notificationsList');
            
            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <i class="fa fa-bell-o text-4xl mb-3"></i>
                        <p>لا توجد إشعارات حتى الآن</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            notifications.forEach(notification => {
                const timeAgo = getTimeAgo(notification.createdAt);
                container.innerHTML += `
                    <div class="notification-item p-3 rounded-xl ${notification.read ? 'bg-gray-50' : 'bg-green-50 border-l-4 border-primary'}"
                         onclick="goToNotificationPlace('${notification.id}', '${notification.placeId || ''}', '${encodeURIComponent(notification.city || '')}')">
                        <div class="flex items-start gap-3">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-sm ${notification.read ? 'text-gray-600' : 'text-gray-800'}">${notification.title}</h4>
                                <p class="text-sm text-gray-500 mt-1">${notification.message}</p>
                                <p class="text-xs text-gray-400 mt-1">${timeAgo}</p>
                            </div>
                            ${!notification.read ? '<div class="w-2 h-2 rounded-full bg-primary flex-shrink-0 mt-2"></div>' : ''}
                        </div>
                    </div>
                `;
            });
        }

        // الانتقال إلى المكان من الإشعار
        window.goToNotificationPlace = function(notificationId, placeId, cityName) {
            // تحديث الإشعار إلى مقروء
            markAsRead(notificationId);
            
            if (cityName) {
                localStorage.setItem('currentCity', decodeURIComponent(cityName));
                window.location.href = `city.html?city=${cityName}#place-${placeId}`;
            } else {
                window.location.href = 'home.html';
            }
        };

        // تحديد إشعار كمقروء
        window.markAsRead = function(notificationId) {
            initNotifications();
            const notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
            const idx = notifications.findIndex(n => n.id == notificationId);
            if (idx !== -1) {
                notifications[idx].read = true;
                localStorage.setItem('notifications', JSON.stringify(notifications));
                updateNotificationsBadge();
                renderNotifications();
            }
        };

        // تحديد الكل كمقروء
        window.markAllAsRead = function() {
            initNotifications();
            const notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
            notifications.forEach(n => n.read = true);
            localStorage.setItem('notifications', JSON.stringify(notifications));
            updateNotificationsBadge();
            renderNotifications();
        };

        // مسح جميع الإشعارات
        window.clearAllNotifications = function() {
            if (!confirm('⚠️ مسح جميع الإشعارات؟ لا يمكن التراجع!')) return;
            localStorage.setItem('notifications', JSON.stringify([]));
            updateNotificationsBadge();
            renderNotifications();
        };

        // فتح وإغلاق نافذة الإشعارات
        window.openNotificationsModal = function() {
            renderNotifications();
            document.getElementById('notificationsModal').classList.add('active', 'flex');
            document.body.style.overflow = 'hidden';
        };

        window.closeNotificationsModal = function() {
            document.getElementById('notificationsModal').classList.remove('active', 'flex');
            document.body.style.overflow = 'auto';
        };

        // حساب الوقت المنقضي
        function getTimeAgo(dateString) {
            const now = new Date();
            const created = new Date(dateString);
            const diffMs = now - created;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return 'الآن';
            if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
            if (diffHours < 24) return `منذ ${diffHours} ساعة`;
            if (diffDays < 7) return `منذ ${diffDays} يوم`;
            return created.toLocaleDateString('ar-SA');
        }

        // ======================================
        // دوال الصفحة
        // ======================================
        function loadRecentPlaces() {
            const places = JSON.parse(localStorage.getItem('places') || '[]');
            const container = document.getElementById('recentPlaces');
            
            if (places.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm">لا توجد أماكن مضافة حتى الآن</div>`;
                return;
            }

            const sorted = places.sort((a, b) => new Date(b.addedAt || 0) - new Date(a.addedAt || 0)).slice(0, 5);
            
            container.innerHTML = '';
            sorted.forEach(place => {
                const stars = '★'.repeat(place.rating || 0) + '☆'.repeat(5 - (place.rating || 0));
                const mainImage = place.images && place.images.length > 0 ? place.images[0] : null;
                
                container.innerHTML += `
                    <div class="place-card bg-white rounded-xl shadow-sm border border-gray-100 p-3 flex items-center gap-3"
                         onclick="openCity('${place.city || ''}')">
                        ${mainImage 
                            ? `<img src="${mainImage}" class="w-14 h-14 rounded-lg object-cover">` 
                            : `<div class="w-14 h-14 rounded-lg bg-green-50 flex items-center justify-center"><i class="fa fa-map-marker text-primary"></i></div>`
                        }
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold truncate">${place.name || 'بدون اسم'}</h4>
                            <p class="text-xs text-gray-500">${place.city || 'بدون مدينة'} — ${place.category || 'أخرى'}</p>
                            <p class="text-yellow-400 text-xs">${stars}</p>
                        </div>
                    </div>
                `;
            });
        }

        function loadCities() {
            let cities = JSON.parse(localStorage.getItem('cities') || '[]');
            const places = JSON.parse(localStorage.getItem('places') || '[]');
            const container = document.getElementById('citiesList');
            
            cities = cities.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            
            if (cities.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400 col-span-full">
                        <i class="fa fa-folder-open text-5xl mb-4"></i>
                        <p>لا توجد مدن مضافة حتى الآن</p>
                        <p class="text-sm mt-1">أضف مدناً أولاً من الأسفل 👇</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            cities.forEach(city => {
                const count = places.filter(p => p.city === city.name).length;
                container.innerHTML += `
                    <div class="city-card bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center hover:shadow-md"
                         onclick="openCity('${city.name}')">
                        <div class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-3">
                            <i class="fa fa-folder-open text-primary text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-lg">${city.name}</h3>
                        <p class="text-sm text-gray-500 mt-1">${count} مكان</p>
                    </div>
                `;
            });
        }

        window.openCity = function(cityName) {
            localStorage.setItem('currentCity', cityName);
            window.location.href = `city.html?city=${encodeURIComponent(cityName)}`;
        };

        window.openAddCityModal = function() {
            document.getElementById('newCityName').value = '';
            document.getElementById('addCityModal').classList.remove('hidden');
            document.getElementById('addCityModal').classList.add('flex');
        };

        window.closeAddCityModal = function() {
            document.getElementById('addCityModal').classList.add('hidden');
            document.getElementById('addCityModal').classList.remove('flex');
        };

        window.saveNewCity = function() {
            const name = document.getElementById('newCityName').value.trim();
            if (!name) return alert('⚠️ أدخل اسم المدينة');
            
            let cities = JSON.parse(localStorage.getItem('cities') || '[]');
            const exists = cities.find(c => c.name.trim() === name.trim());
            if (exists) return alert('⚠️ هذه المدينة موجودة مسبقاً!');
            
            cities.push({ name: name, createdAt: new Date().toISOString() });
            localStorage.setItem('cities', JSON.stringify(cities));
            alert(`✅ تمت إضافة مدينة "${name}" بنجاح`);
            closeAddCityModal();
            loadCities();
        };

        // إغلاق النافذة عند النقر خارجها
        document.getElementById('notificationsModal').addEventListener('click', (e) => {
            if (e.target.id === 'notificationsModal') closeNotificationsModal();
        });

        // تحميل أولي
        initNotifications();
        updateNotificationsBadge();
        loadRecentPlaces();
        loadCities();
    </script>
</body>
</html>
