<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدينة — كشتات العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6', danger: '#EF4444' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%); min-height: 100vh; padding-bottom: 40px; }
        .place-card { transition: all 0.2s ease; cursor: pointer; }
        .place-card:active { transform: scale(0.98); }
        .modal { display: none; }
        .modal.active { display: flex; }
        .stars { color: #FBBF24; }
    </style>
</head>
<body>
    <header class="px-4 pt-6 pb-4">
        <div class="flex items-center justify-between mb-6">
            <button onclick="goBack()" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center">
                <i class="fa fa-arrow-right text-gray-600"></i>
            </button>
            <h1 class="text-xl font-bold text-dark" id="cityNameHeader">المدينة</h1>
            <button onclick="logout()" class="text-gray-500 hover:text-danger text-sm">
                <i class="fa fa-sign-out"></i>
            </button>
        </div>

        <button onclick="goToAddPlace()" class="w-full bg-primary text-white py-4 rounded-xl text-lg font-bold mb-3 shadow-md">
            <i class="fa fa-plus ml-2"></i> إضافة مكان جديد
        </button>
        <button onclick="goBack()" class="w-full bg-gray-100 text-gray-600 py-3 rounded-xl text-sm font-medium flex items-center justify-center gap-2">
            <i class="fa fa-home"></i> الرجوع للمدن
        </button>
    </header>

    <main class="px-4">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i class="fa fa-map-marker text-primary"></i>
            الأماكن في <span id="citySubtitle">المدينة</span>
        </h2>

        <div id="placesList" class="space-y-4">
            <div class="text-center py-16 text-gray-400">
                <i class="fa fa-map-o text-5xl mb-4"></i>
                <p>لا توجد أماكن مضافة في هذه المدينة حتى الآن</p>
                <p class="text-sm mt-1">كن أول من يضيف مكاناً جديداً! 🎉</p>
            </div>
        </div>
    </main>

    <!-- نافذة تفاصيل المكان -->
    <div id="placeDetailModal" class="modal fixed inset-0 bg-black/50 z-50 items-end justify-center">
        <div class="w-full max-w-lg bg-white rounded-t-3xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold" id="modalPlaceName">اسم المكان</h2>
                <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                    <i class="fa fa-times text-gray-500"></i>
                </button>
            </div>

            <div id="modalImagesContainer" class="mb-4">
                <img id="modalMainImage" src="" class="w-full h-48 object-cover rounded-xl mb-2 hidden">
                <div id="modalGallery" class="grid grid-cols-3 gap-2 mt-2"></div>
            </div>

            <div class="space-y-3 mb-6">
                <div class="flex items-center gap-2">
                    <span class="px-3 py-1 bg-sky-100 text-sky-700 rounded-full text-sm" id="modalCategory">تصنيف</span>
                    <span class="stars" id="modalStars">★★★★★</span>
                </div>
                
                <div class="flex items-center gap-2 text-gray-600" id="modalPriceContainer">
                    <i class="fa fa-tag text-sm"></i>
                    <span>السعر: </span>
                    <span class="font-medium" id="modalPrice">غير محدد</span>
                </div>

                <div class="text-gray-600 text-sm" id="modalNotesContainer">
                    <i class="fa fa-sticky-note-o ml-1"></i>
                    <span id="modalNotes"></span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6" id="actionButtons">
                <a id="callBtn" href="#" class="bg-green-500 text-white py-3 rounded-xl flex items-center justify-center gap-2 font-medium hidden">
                    <i class="fa fa-phone"></i>
                    <span>اتصال مباشر</span>
                </a>
                <a id="mapBtn" href="#" target="_blank" class="bg-blue-500 text-white py-3 rounded-xl flex items-center justify-center gap-2 font-medium hidden">
                    <i class="fa fa-map"></i>
                    <span>فتح في الخريطة</span>
                </a>
            </div>

            <div id="manageButtons" class="grid grid-cols-2 gap-3 mt-4 hidden">
                <button onclick="editCurrentPlace()" class="bg-indigo-500 text-white py-3 rounded-xl flex items-center justify-center gap-2 font-medium">
                    <i class="fa fa-pencil"></i>
                    <span>تعديل</span>
                </button>
                <button onclick="deleteCurrentPlace()" class="bg-red-50 text-red-500 py-3 rounded-xl flex items-center justify-center gap-2 font-medium">
                    <i class="fa fa-trash"></i>
                    <span>حذف</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // التحقق من تسجيل الدخول
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // ✅ دالة الرجوع للصفحة الرئيسية
        function goBack() {
            window.location.href = 'home.html';
        }

        // ✅ دالة الانتقال لصفحة إضافة مكان
        function goToAddPlace() {
            const city = localStorage.getItem('currentCity') || '';
            window.location.href = `add-place.html?city=${encodeURIComponent(city)}`;
        }

        // ✅ دالة تسجيل الخروج
        function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }

        function getCityName() {
            const params = new URLSearchParams(window.location.search);
            const cityFromUrl = params.get('city');
            if (cityFromUrl) {
                localStorage.setItem('currentCity', cityFromUrl);
                return cityFromUrl;
            }
            return localStorage.getItem('currentCity') || 'الطائف';
        }

        let currentCity = getCityName();
        let allPlaces = [];
        let currentPlace = null;

        document.getElementById('cityNameHeader').textContent = currentCity;
        document.getElementById('citySubtitle').textContent = currentCity;
        document.title = `${currentCity} — كشتات العويشي`;

        function loadPlaces() {
            const places = JSON.parse(localStorage.getItem('places') || '[]');
            allPlaces = places.filter(p => p.city === currentCity);
            renderPlaces();
        }

        function renderPlaces() {
            const container = document.getElementById('placesList');
            if (allPlaces.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-gray-400">
                        <i class="fa fa-map-o text-5xl mb-4"></i>
                        <p>لا توجد أماكن مضافة في ${currentCity} حتى الآن</p>
                        <p class="text-sm mt-1">كن أول من يضيف مكاناً جديداً! 🎉</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = '';
            allPlaces.forEach((place, index) => {
                const stars = '★'.repeat(place.rating || 0) + '☆'.repeat(5 - (place.rating || 0));
                const mainImage = place.images && place.images.length > 0 ? place.images[0] : null;
                container.innerHTML += `
                    <div class="place-card bg-white rounded-2xl shadow-sm border border-gray-100 p-4" 
                         onclick="openDetailModal(${index})">
                        <div class="flex gap-3">
                            ${mainImage ? `<img src="${mainImage}" class="w-20 h-20 rounded-xl object-cover">` 
                                : `<div class="w-20 h-20 rounded-xl bg-green-50 flex items-center justify-center"><i class="fa fa-map-marker text-green-500 text-xl"></i></div>`
                            }
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-lg truncate">${place.name || 'بدون اسم'}</h3>
                                <p class="text-sm text-sky-600">${place.category || 'أخرى'}</p>
                                <p class="stars text-sm">${stars}</p>
                                ${place.phone ? `<p class="text-sm text-gray-500 mt-1">📱 ${place.phone}</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.openDetailModal = function(index) {
            currentPlace = allPlaces[index];
            const modal = document.getElementById('placeDetailModal');
            
            document.getElementById('modalPlaceName').textContent = currentPlace.name || 'بدون اسم';
            document.getElementById('modalCategory').textContent = currentPlace.category || 'أخرى';
            const stars = '★'.repeat(currentPlace.rating || 0) + '☆'.repeat(5 - (currentPlace.rating || 0));
            document.getElementById('modalStars').textContent = stars;
            
            if (currentPlace.price) {
                document.getElementById('modalPrice').textContent = currentPlace.price;
                document.getElementById('modalPriceContainer').classList.remove('hidden');
            } else {
                document.getElementById('modalPriceContainer').classList.add('hidden');
            }
            
            if (currentPlace.notes) {
                document.getElementById('modalNotes').textContent = currentPlace.notes;
                document.getElementById('modalNotesContainer').classList.remove('hidden');
            } else {
                document.getElementById('modalNotesContainer').classList.add('hidden');
            }
            
            const callBtn = document.getElementById('callBtn');
            if (currentPlace.phone) {
                callBtn.href = `tel:${currentPlace.phone}`;
                callBtn.classList.remove('hidden');
            } else {
                callBtn.classList.add('hidden');
            }
            
            const mapBtn = document.getElementById('mapBtn');
            if (currentPlace.mapUrl) {
                mapBtn.href = currentPlace.mapUrl;
                mapBtn.classList.remove('hidden');
            } else {
                mapBtn.classList.add('hidden');
            }
            
            const mainImg = document.getElementById('modalMainImage');
            const gallery = document.getElementById('modalGallery');
            if (currentPlace.images && currentPlace.images.length > 0) {
                mainImg.src = currentPlace.images[0];
                mainImg.classList.remove('hidden');
                gallery.innerHTML = '';
                currentPlace.images.forEach((img, i) => {
                    if (i > 0) gallery.innerHTML += `<img src="${img}" class="w-full h-20 object-cover rounded-lg">`;
                });
                if (currentPlace.images.length <= 1) gallery.innerHTML = '';
            } else {
                mainImg.classList.add('hidden');
                gallery.innerHTML = '';
            }
            
            const manageBtns = document.getElementById('manageButtons');
            if (currentUser && (currentUser.type === 'admin' || currentUser.phone === currentPlace.createdByPhone)) {
                manageBtns.classList.remove('hidden');
            } else {
                manageBtns.classList.add('hidden');
            }
            
            modal.classList.add('active', 'flex');
            document.body.style.overflow = 'hidden';
        };

        window.closeDetailModal = function() {
            document.getElementById('placeDetailModal').classList.remove('active', 'flex');
            document.body.style.overflow = 'auto';
            currentPlace = null;
        };

        window.editCurrentPlace = function() {
            if (!currentPlace) return;
            localStorage.setItem('editPlaceData', JSON.stringify(currentPlace));
            localStorage.setItem('editPlaceCity', currentCity);
            window.location.href = `add-place.html?edit=${encodeURIComponent(currentPlace.id || '')}&city=${encodeURIComponent(currentCity)}`;
        };

        window.deleteCurrentPlace = function() {
            if (!currentPlace) return;
            if (!confirm(`⚠️ هل أنت متأكد من حذف "${currentPlace.name}"؟ لا يمكن التراجع!`)) return;
            let places = JSON.parse(localStorage.getItem('places') || '[]');
            places = places.filter(p => p.id !== currentPlace.id);
            localStorage.setItem('places', JSON.stringify(places));
            alert(`✅ تم حذف "${currentPlace.name}" بنجاح`);
            closeDetailModal();
            loadPlaces();
        };

        document.getElementById('placeDetailModal').addEventListener('click', (e) => {
            if (e.target.id === 'placeDetailModal') closeDetailModal();
        });

        loadPlaces();
    </script>
</body>
</html>
