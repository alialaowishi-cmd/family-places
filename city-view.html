<body>

    <!-- نافذة تفاصيل المكان -->

            </div>

                    <i class="fa fa-pencil ml-1"></i> تعديل
                </button>
                <button id="deleteBtn" class="flex-1 py-2 rounded-lg bg-danger/10 text-danger text-sm">
                    <i class="fa fa-trash ml-1"></i> حذف
                </button>
            </div>
        </div>
    </div>

        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // بيانات الصفحة
        const params = new URLSearchParams(location.search);
        const cityName = params.get('name') || 'مدينة';
        document.getElementById('cityTitle').textContent = cityName;
        const userData = JSON.parse(localStorage.getItem('user') || 'null');
        const isAdmin = userData?.type === 'admin';

        // زر إضافة مكان لهذه المدينة
        document.getElementById('addPlaceHere').addEventListener('click', () => {
            if (!userData) return alert('يرجى تسجيل الدخول أولاً');
            location.href = `add-place.html?city=${encodeURIComponent(cityName)}`;
        });

        // تحميل أماكن المدينة
        let allPlaces = [];
        async function loadPlaces() {
            const container = document.getElementById('placesContainer');
            try {
                const q = query(collection(db, 'places'), where('city', '==', cityName));
                const snap = await getDocs(q);
                allPlaces = [];
                if (snap.empty) {
                    container.innerHTML = `<div class="text-center py-12"><i class="fa fa-map-o text-4xl text-gray-300 mb-3"></i><p class="text-gray-500">لا توجد أماكن مضافة في ${cityName}</p><p class="text-sm text-gray-400 mt-1">اضغط على الزر + لإضافة أول مكان</p></div>`;
                    return;
                }
                container.innerHTML = '';
                snap.forEach(d => {
                    allPlaces.push({id: d.id, ...d.data()});
                });
                renderPlaces();
            } catch (e) {
                container.innerHTML = `<p class="text-red-500 text-center">❌ خطأ في التحميل — تحقق من Firebase Rules</p>`;
            }
        }
        function renderPlaces() {
            const container = document.getElementById('placesContainer');
            container.innerHTML = '';
            allPlaces.forEach(p => {
                const stars = '★'.repeat(p.rating||0) + '☆'.repeat(5-(p.rating||0));
                container.innerHTML += `<div class="place-card p-4" onclick="openDetail('${p.id}')">
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <p class="text-sm text-gray-500">${p.category}</p>
                    <p class="text-yellow-500 text-sm mt-1">${stars}</p>
                    ${p.price ? `<p class="text-sm text-gray-600 mt-1">💰 ${p.price}</p>` : ''}
                    <p class="text-xs text-gray-400 mt-2">أضيف بواسطة: ${p.createdBy || 'مجهول'}</p>
                </div>`;
            });
        }
