<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد — كشتات العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6', danger: '#EF4444' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%); min-height: 100vh; padding-bottom: 40px; }
        .star { cursor: pointer; font-size: 24px; color: #D1D5DB; transition: color 0.2s; }
        .star.active { color: #FBBF24; }
        .preview-img { width: 80px; height: 80px; object-cover: rounded-lg; }
    </style>
</head>
<body class="px-4 py-6">
    <header class="mb-6">
        <div class="flex items-center justify-between">
            <button onclick="goBack()" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center">
                <i class="fa fa-arrow-right text-gray-600"></i>
            </button>
            <h1 class="text-xl font-bold" id="pageTitle">إضافة مكان جديد</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <form id="placeForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">اسم المكان *</label>
            <input type="text" id="placeName" required 
                class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">المدينة</label>
            <div class="flex gap-2 mb-2">
                <select id="citySelect" class="flex-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50">
                    <option value="">-- اختر المدينة --</option>
                </select>
                <button type="button" onclick="toggleManualCity()" class="px-4 py-3 bg-gray-100 rounded-xl text-sm">
                    <i class="fa fa-pencil"></i>
                </button>
            </div>
            <input type="text" id="manualCity" placeholder="أو اكتب اسم المدينة يدوياً..." 
                class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50 hidden">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">التصنيف</label>
            <select id="category" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50">
                <option value="">-- اختر التصنيف --</option>
                <option value="مطعم">مطعم</option>
                <option value="كوفي">كوفي</option>
                <option value="منتزه">منتزه</option>
                <option value="محل">محل</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">التقييم</label>
            <div id="starsContainer" class="flex gap-1">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <input type="hidden" id="rating" value="0">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">السعر التقريبي</label>
            <input type="text" id="price" placeholder="مثال: 50 - 100 ريال" 
                class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">رقم الجوال</label>
            <input type="tel" id="phone" placeholder="05xxxxxxxx" 
                class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">رابط الموقع في قوقل ماب</label>
            <input type="url" id="mapUrl" placeholder="الصق رابط الموقع هنا..." 
                class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">إضافة صور للمكان</label>
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
            <button type="button" onclick="document.getElementById('imageInput').click()" 
                class="w-full p-3 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-primary hover:text-primary transition-colors">
                <i class="fa fa-upload ml-2"></i> اختر الصور
            </button>
            <div id="imagePreviewContainer" class="flex flex-wrap gap-2 mt-3"></div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ملاحظات إضافية</label>
            <textarea id="notes" rows="3" placeholder="أي معلومات أخرى عن المكان..." 
                class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50 resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl text-lg font-bold mt-6">
            <i class="fa fa-save ml-2"></i> حفظ المكان
        </button>
    </form>

    <script>
        // التحقق من تسجيل الدخول
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // دوال الإشعارات
        function initNotifications() {
            if (!localStorage.getItem('notifications')) {
                localStorage.setItem('notifications', JSON.stringify([]));
            }
        }

        function addNotification(place, type = 'new') {
            initNotifications();
            const notifications = JSON.parse(localStorage.getItem('notifications
