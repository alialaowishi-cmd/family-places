<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأماكن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#22C55E', danger: '#EF4444' } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #F0FDF4 0%, #EFF6FF 100%); min-height: 100vh; padding-bottom: 80px; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
        .place-card { background: rgba(255,255,255,0.85); border-radius: 16px; transition: all 0.2s ease; cursor: pointer; }
        .place-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .star { color: #FACC15; }
        .star-empty { color: #D1D5DB; }
    </style>
</head>
<body>
    <header class="glass sticky top-0 z-30 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="location.href='home.html'" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center border-0">
                <i class="fa fa-arrow-right"></i>
            </button>
            <h1 id="cityTitle" class="text-lg font-bold">الأماكن</h1>
            <button id="addPlaceHere" class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary border-0">
                <i class="fa fa-plus"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-5">
        <div id="placesContainer" class="space-y-4">
            <p class="text-gray-500 text-center py-10">جاري التحميل...</p>
        </div>
    </main>

    <!-- نافذة تفاصيل المكان -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-lg rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-4">
                <h2 id="dName" class="text-xl font-bold"></h2>
                <button id="closeDetail" class="text-gray-400 text-xl bg-transparent border-0 cursor-pointer">&times;</button>
            </div>
            <div id="dImages" class="flex overflow-x-auto gap-2 mb-4"></div>
            <div class="space-y-2 text-sm">
                <p><strong>التصنيف:</strong> <span id="dCat"></span></p>
                <p><strong>التقييم:</strong> <span id="dStars"></span></p>
                <p><strong>السعر:</strong> <span id="dPrice"></span></p>
                <p id="dPhoneWrap" class="hidden"><strong>للتواصل:</strong> 
                    <a id="dPhone" href="" class="text-primary underline"></a>
                </p>
                <p id="dMapWrap" class="hidden"><strong>الموقع:</strong> 
                    <a id="dMap" href="" target="_blank" class="text-secondary underline">افتح في جوجل ماب ↗</a>
                </p>
                <p id="dNotesWrap" class="hidden"><strong>ملاحظات:</strong><br><span id="dNotes" class="text-gray-600"></span></p>
                <p class="text-xs text-gray-400 mt-3">أضيف بواسطة: <span id="dBy"></span></p>
            </div>
            <div id="adminActions" class="flex gap-2 mt-5 pt-3 border-t hidden">
                <div class="flex-1 py-2 rounded-lg bg-gray-100 text-sm text-center">
                    <i class="fa fa-info-circle ml-1"></i> فقط المشرف يمكنه التعديل والحذف
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // بيانات الصفحة
        const params = new URLSearchParams(location.search);
        const cityName = params.get('name');
        
        if (!cityName) {
            alert('❌ خطأ: لم يتم تحديد المدينة');
            location.href = 'home.html';
        }
        
        document.getElementById('cityTitle').textContent = cityName;
        const userData = JSON.parse(localStorage.getItem('user') || 'null');
        const isLoggedIn = !!userData;
        const isAdmin = userData?.type === 'admin';

        // زر إضافة مكان لهذه المدينة
        document.getElementById('addPlaceHere').addEventListener('click', () => {
            if (!isLoggedIn) {
                alert('يرجى تسجيل الدخول أولاً');
                location.href = 'login.html';
                return;
            }
            location.href = `add-place.html?city=${encodeURIComponent(cityName)}`;
        });

        // تحميل أماكن المدينة
        let allPlaces = [];
        async function loadPlaces() {
            const container = document.getElementById('placesContainer');
            container.innerHTML = '<p class="text-gray-500 text-center py-10">جاري التحميل...</p>';
            
            try {
                console.log('جاري تحميل أماكن:', cityName);
                const q = query(collection(db, 'places'), where('city', '==', cityName));
                const snap = await getDocs(q);
                allPlaces = [];
                
                if (snap.empty) {
                    container.innerHTML = `<div class="text-center py-12"><i class="fa fa-map-o text-4xl text-gray-300 mb-3"></i><p class="text-gray-500">لا توجد أماكن مضافة في ${cityName}</p><p class="text-sm text-gray-400 mt-1">${isLoggedIn ? 'اضغط على الزر + لإضافة أول مكان' : 'سجل دخول لإضافة أماكن'}</p></div>`;
                    return;
                }
                
                snap.forEach(d => {
                    allPlaces.push({id: d.id, ...d.data()});
                });
                console.log('تم تحميل', allPlaces.length, 'أماكن');
                renderPlaces();
            } catch (e) {
                console.error('خطأ في تحميل الأماكن:', e);
                container.innerHTML = `<p class="text-red-500 text-center">❌ خطأ في التحميل: ${e.message}</p>`;
            }
        }

        function renderPlaces() {
            const container = document.getElementById('placesContainer');
            container.innerHTML = '';
            allPlaces.forEach(p => {
                const stars = '★'.repeat(p.rating||0) + '☆'.repeat(5-(p.rating||0));
                container.innerHTML += `<div class="place-card p-4" data-id="${p.id}">
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <p class="text-sm text-gray-500">${p.category || 'بدون تصنيف'}</p>
                    <p class="text-yellow-500 text-sm mt-1">${stars}</p>
                    ${p.price ? `<p class="text-sm text-gray-600 mt-1">💰 ${p.price}</p>` : ''}
                    <p class="text-xs text-gray-400 mt-2">أضيف بواسطة: ${p.createdBy || 'مجهول'}</p>
                </div>`;
            });
            
            // إضافة حدث النقر بعد إنشاء العناصر
            document.querySelectorAll('.place-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.getAttribute('data-id');
                    openDetail(id);
                });
            });
        }

        // نافذة التفاصيل
        const detailModal = document.getElementById('detailModal');
        const closeDetail = document.getElementById('closeDetail');
        
        closeDetail.addEventListener('click', () => {
            detailModal.classList.add('hidden');
        });
        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) detailModal.classList.add('hidden');
        });

        window.openDetail = function(id) {
            const place = allPlaces.find(p => p.id === id);
            if (!place) return;
            
            document.getElementById('dName').textContent = place.name;
            document.getElementById('dCat').textContent = place.category || 'غير محدد';
            const stars = '★'.repeat(place.rating||0) + '☆'.repeat(5-(place.rating||0));
            document.getElementById('dStars').textContent = stars;
            document.getElementById('dPrice').textContent = place.price || 'غير محدد';
            document.getElementById('dBy').textContent = place.createdBy || 'مجهول';
            
            // جوال
            const phoneWrap = document.getElementById('dPhoneWrap');
            const phoneEl = document.getElementById('dPhone');
            if (place.phone) {
                phoneWrap.classList.remove('hidden');
                phoneEl.textContent = place.phone;
                phoneEl.href = `tel:${place.phone}`;
            } else {
                phoneWrap.classList.add('hidden');
            }
            
            // خريطة
            const mapWrap = document.getElementById('dMapWrap');
            const mapEl = document.getElementById('dMap');
            if (place.mapUrl) {
                mapWrap.classList.remove('hidden');
                mapEl.href = place.mapUrl;
            } else {
                mapWrap.classList.add('hidden');
            }
            
            // ملاحظات
            const notesWrap = document.getElementById('dNotesWrap');
            if (place.notes) {
                notesWrap.classList.remove('hidden');
                document.getElementById('dNotes').textContent = place.notes;
            } else {
                notesWrap.classList.add('hidden');
            }
            
            // صور
            const imgBox = document.getElementById('dImages');
            imgBox.innerHTML = '';
            if (place.images && place.images.length > 0) {
                place.images.forEach(url => {
                    imgBox.innerHTML += `<img src="${url}" class="w-24 h-24 object-cover rounded-lg">`;
                });
            } else {
                imgBox.innerHTML = '<p class="text-sm text-gray-400">لا صور متاحة</p>';
            }
            
            // أزرار المشرف
            document.getElementById('adminActions').classList.toggle('hidden', !isAdmin);
            
            detailModal.classList.remove('hidden');
        };

        // حذف مكان
        document.getElementById('adminActions').innerHTML = `
            <button id="deleteBtn" class="flex-1 py-2 rounded-lg bg-danger/10 text-danger text-sm">
                <i class="fa fa-trash ml-1"></i> حذف
            </button>
        `;
        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!isAdmin) return alert('❌ غير مسموح لك');
            if (!confirm('حذف هذا المكان؟')) return;
            const placeId = allPlaces.find(p => p.name === document.getElementById('dName').textContent)?.id;
            if (!placeId) return;
            try {
                await deleteDoc(doc(db, 'places', placeId));
                alert('✅ تم الحذف');
                detailModal.classList.add('hidden');
                loadPlaces();
            } catch (e) {
                alert('❌ خطأ في الحذف: ' + e.message);
            }
        });

        loadPlaces();
    </script>
</body>
</html>
