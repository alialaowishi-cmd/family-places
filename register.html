<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>

                        secondary: '#15803d',

                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa fa-user-plus text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">إنشاء حساب جديد</h1>
            <p class="text-gray-500 mt-1">انضم إلينا وأضف أماكنك المفضلة</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-6">
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الاسم الكامل *</label>
                    <input type="text" id="fullName" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-primary/20" placeholder="أدخل اسمك الكامل" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني *</label>
                    <input type="email" id="email" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-primary/20" placeholder="example@email.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">رقم الجوال *</label>
                    <input type="tel" id="phone" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-primary/20" placeholder="05xxxxxxxx" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور *</label>
                    <input type="password" id="password" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-primary/20" placeholder="أدخل كلمة المرور" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">تأكيد كلمة المرور *</label>
                    <input type="password" id="confirmPassword" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-primary/20" placeholder="أدخل كلمة المرور مرة أخرى" required>
                </div>
