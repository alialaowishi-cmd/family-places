<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#34C759',
                        secondary: '#007AFF',
                        dark: '#1C1C1E',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body {
            background: linear-gradient(135deg, #E8F5E9 0%, #F0F9FF 50%, #FEF3C7 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .input-glass {
            background: rgba(118, 118, 128, 0.12);
            border: none;
        }
        .input-glass:focus { background: rgba(118, 118, 128, 0.18); outline: none; }
        .btn-primary {
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.97); }
    </style>
</head>
<body class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 glass rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fa fa-user-plus text-primary text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-dark">إنشاء حساب جديد</h1>
            <p class="text-gray-500 mt-1">انضم إلينا وأضف أماكنك المفضلة</p>
        </div>

        <div class="glass rounded-3xl shadow-xl p-6">
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">الاسم الكامل</label>
                    < <input type="text" id="fullName" class="w-full p-3.5 rounded-xl input-glass" placeholder="أدخل اسمك الكامل" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">البريد الإلكتروني</label>
                    <input type="email" id="email" class="w-full p-3.5 rounded-xl input-glass" placeholder="example@email.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">رقم الجوال</label>
                    <input type="tel" id="phone" class="w-full p-3.5 rounded-xl input-glass" placeholder="05xxxxxxxx" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                    <input type="password" id="password" class="w-full p-3.5 rounded-xl input-glass" placeholder="••••••••" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" class="w-full p-3.5 rounded-xl input-glass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full btn-primary text-white py-3.5 rounded-xl font-medium mt-2">
                    <i class="fa fa-check ml-2"></i> إنشاء الحساب
                </button>
            </form>
            <p class="text-center text-sm mt-4">
                لديك حساب؟ <a href="login.html" class="text-secondary font-medium">تسجيل الدخول</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('كلمة المرور غير متطابقة');
                return;
            }
            
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userType', 'user');
            localStorage.setItem('userName', fullName);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPhone', phone);
            localStorage.setItem('userPassword', password);
            
            showAlert('✅ تم إنشاء الحساب بنجاح');
            setTimeout(() => window.location.href = 'home.html', 1200);
        });

        function showAlert(msg) {
            const box = document.createElement('div');
            box.className = 'fixed top-4 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-2xl shadow-lg z-50';
            box.innerHTML = `<p class="font-medium">${msg}</p>`;
            document.body.appendChild(box);
            setTimeout(() => box.remove(), 2500);
        }
    </script>
</body>
</html>
