<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 50%, #1E40AF 100%);
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tab-active { background: #3B82F6; color: white; border-color: #3B82F6; }
        .tab-inactive { background: transparent; color: #94A3B8; border-color: #475569; }
        input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; }
        input::placeholder { color: rgba(255,255,255,0.5); }
        input:focus { outline: none; border-color: #3B82F6; background: rgba(255,255,255,0.15); }
        .btn-login { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); transition: all 0.3s ease; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .card-bg { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .error-msg { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); color: #FCA5A5; }
    </style>
</head>
<body>
    <div class="w-full max-w-md px-4 py-8">
        <!-- الشعار والعنوان -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fa fa-map-marker text-4xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">كشتات عائلة حسين العويشي</h1>
            <p class="text-blue-200 mt-2">الرجاء تسجيل الدخول للمتابعة</p>
        </div>

        <!-- بطاقة الدخول -->
        <div class="card-bg rounded-3xl p-6 shadow-2xl">
            <!-- التبويبات -->
            <div class="flex rounded-xl border border-slate-500/30 mb-6 overflow-hidden">
                <button class="login-tab tab-active flex-1 py-3 text-sm font-medium border-r border-slate-500/30" data-tab="phone">رقم الجوال</button>
                <button class="login-tab tab-inactive flex-1 py-3 text-sm font-medium border-r border-slate-500/30" data-tab="email">البريد</button>
                <button class="login-tab tab-inactive flex-1 py-3 text-sm font-medium" data-tab="admin">المشرف</button>
            </div>

            <!-- رسالة الخطأ -->
            <div id="errorMessage" class="hidden error-msg p-3 rounded-lg text-center text-sm mb-4"></div>

            <!-- ============== رقم الجوال ============== -->
            <div id="phoneTab" class="tab-panel">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">رقم الجوال</label>
                        <input type="tel" id="phoneInput" placeholder="05XXXXXXXX" maxlength="10" class="w-full px-4 py-3 rounded-lg text-center">
                    </div>
                    <button id="phoneLoginBtn" class="btn-login w-full py-3 rounded-xl text-white font-medium">
                        <i class="fa fa-sign-in ml-2"></i> تسجيل الدخول
                    </button>
                </div>
            </div>

            <!-- ============== البريد ============== -->
            <div id="emailTab" class="tab-panel hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">البريد الإلكتروني</label>
                        <input type="email" id="emailInput" placeholder="example@email.com" class="w-full px-4 py-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">كلمة المرور</label>
                        <input type="password" id="emailPasswordInput" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg">
                    </div>
                    <button id="emailLoginBtn" class="btn-login w-full py-3 rounded-xl text-white font-medium">
                        <i class="fa fa-sign-in ml-2"></i> تسجيل الدخول
                    </button>
                    <p class="text-center text-sm text-blue-200 mt-2">
                        <a href="#" class="hover:text-white transition">نسيت كلمة المرور؟</a>
                    </p>
                </div>
            </div>

            <!-- ============== المشرف ============== -->
            <div id="adminTab" class="tab-panel hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">كلمة مرور المشرف</label>
                        <input type="password" id="adminPasswordInput" placeholder="أدخل كلمة المرور" class="w-full px-4 py-3 rounded-lg text-center">
                    </div>
                    <button id="adminLoginBtn" class="btn-login w-full py-3 rounded-xl text-white font-medium">
                        <i class="fa fa-shield ml-2"></i> دخول المشرف
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-sm text-blue-200 mt-6">
            © 2026 كشتات عائلة حسين العويشي
        </p>
    </div>

    <script type="module">
        import { loginWithPhone, loginAsAdmin, getCurrentUser } from './auth.js';

        // منع الدخول إذا كان مسجلاً مسبقاً
        if (getCurrentUser()) {
            window.location.href = 'home.html';
        }

        const tabs = document.querySelectorAll('.login-tab');
        const panels = document.querySelectorAll('.tab-panel');
        const errorBox = document.getElementById('errorMessage');

        // عرض رسالة الخطأ
        function showError(text) {
            errorBox.textContent = text;
            errorBox.classList.remove('hidden');
            setTimeout(() => errorBox.classList.add('hidden'), 4000);
        }

        // ✅ التبديل بين التبويبات — تم إصلاحها
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                
                // تحديث حالة الأزرار
                tabs.forEach(t => {
                    t.classList.remove('tab-active');
                    t.classList.add('tab-inactive');
                });
                tab.classList.remove('tab-inactive');
                tab.classList.add('tab-active');
                
                // إخفاء جميع المحتويات وإظهار المحتوى المحدد
                panels.forEach(p => p.classList.add('hidden'));
                document.getElementById(`${tabName}Tab`).classList.remove('hidden');
                
                // إخفاء رسالة الخطأ عند التبديل
                errorBox.classList.add('hidden');
            });
        });

        // ✅ تسجيل الدخول برقم الجوال — تم إصلاح الحدث
        document.getElementById('phoneLoginBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phoneInput').value.trim();
            
            if (!phone) {
                showError('أدخل رقم الجوال');
                return;
            }
            if (phone.length < 9) {
                showError('أدخل رقم جوال صحيح');
                return;
            }

            const btn = document.getElementById('phoneLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin ml-2"></i> جاري التحقق...';

            const result = await loginWithPhone(phone);
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-sign-in ml-2"></i> تسجيل الدخول';

            if (result.success) {
                window.location.href = 'home.html';
            } else {
                showError(result.message || 'رقم الجوال غير مسجل لدى المشرف');
            }
        });

        // ✅ تسجيل الدخول بالبريد — تم إصلاح الحدث
        document.getElementById('emailLoginBtn').addEventListener('click', () => {
            showError('تسجيل الدخول بالبريد قيد التطوير حالياً، استخدم رقم الجوال');
        });

        // ✅ دخول المشرف — تم إصلاح الحدث
        document.getElementById('adminLoginBtn').addEventListener('click', async () => {
            const password = document.getElementById('adminPasswordInput').value.trim();
            
            if (!password) {
                showError('أدخل كلمة المرور');
                return;
            }

            const btn = document.getElementById('adminLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin ml-2"></i> جاري التحقق...';

            const result = await loginAsAdmin(password);
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-shield ml-2"></i> دخول المشرف';

            if (result.success) {
                window.location.href = 'home.html';
            } else {
                showError('كلمة المرور غير صحيحة');
            }
        });
    </script>
</body>
</html>
