<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007AFF',
                        primaryLight: 'rgba(0, 122, 255, 0.08)',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(135deg, #007AFF 0%, #5E5CE6 100%);
            min-height: 100vh;
            font-family: 'Tajawal', sans-serif;
        }
        .glass-ios {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: saturate(180%) blur(25px);
            -webkit-backdrop-filter: saturate(180%) blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .input-ios {
            background: rgba(118, 118, 128, 0.08);
            border: none;
        }
        .input-ios:focus {
            background: rgba(118, 118, 128, 0.04);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
            outline: none;
        }
        .btn-primary-ios {
            background: linear-gradient(135deg, #007AFF 0%, #0066DD 100%);
            transition: all 0.2s ease;
        }
        .btn-primary-ios:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.25);
        }
        .tab-active {
            background: rgba(0, 122, 255, 0.1);
            color: #007AFF;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="glass-ios rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fa fa-map-marker text-white text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800">كشتات عائلة حسين العويشي</h1>
                <p class="text-sm text-gray-400 mt-1">الرجاء تسجيل الدخول للمتابعة</p>
            </div>

            <!-- التبويبات -->
            <div class="flex bg-gray-100/60 rounded-xl p-1 mb-6">
                <button class="login-tab tab-active flex-1 py-2 rounded-lg text-sm" data-tab="phone">رقم الجوال</button>
                <button class="login-tab flex-1 py-2 rounded-lg text-sm text-gray-500" data-tab="email">البريد</button>
                <button class="login-tab flex-1 py-2 rounded-lg text-sm text-gray-500" data-tab="admin">المشرف</button>
            </div>

            <!-- رسالة الخطأ/النجاح -->
            <div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

            <!-- تسجيل الدخول برقم الجوال -->
            <div id="phoneTab" class="tab-content">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">رقم الجوال</label>
                        <input type="tel" id="phoneInput" placeholder="05XXXXXXXX"
                            class="w-full px-4 py-3.5 rounded-xl input-ios text-center" maxlength="10">
                    </div>
                    <button id="phoneLoginBtn" class="w-full btn-primary-ios text-white py-3.5 rounded-xl font-medium">
                        تسجيل الدخول
                    </button>
                </div>
            </div>

            <!-- تسجيل الدخول بالبريد -->
            <div id="emailTab" class="tab-content hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">البريد الإلكتروني</label>
                        <input type="email" id="emailInput" placeholder="example@email.com"
                            class="w-full px-4 py-3.5 rounded-xl input-ios">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">كلمة المرور</label>
                        <input type="password" id="passwordInput" placeholder="••••••••"
                            class="w-full px-4 py-3.5 rounded-xl input-ios">
                    </div>
                    <button id="emailLoginBtn" class="w-full btn-primary-ios text-white py-3.5 rounded-xl font-medium">
                        تسجيل الدخول
                    </button>
                </div>
            </div>

            <!-- دخول المشرف -->
            <div id="adminTab" class="tab-content hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">كلمة مرور المشرف</label>
                        <input type="password" id="adminPasswordInput" placeholder="أدخل كلمة المرور"
                            class="w-full px-4 py-3.5 rounded-xl input-ios text-center">
                    </div>
                    <button id="adminLoginBtn" class="w-full btn-primary-ios text-white py-3.5 rounded-xl font-medium">
                        دخول لوحة المشرف
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginWithPhone, loginWithEmail, loginAsAdmin, isUserLoggedIn } from './auth.js';

        // إذا كان مسجلاً الدخول مسبقاً
        if (isUserLoggedIn()) {
            window.location.href = 'home.html';
        }

        const tabs = document.querySelectorAll('.login-tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const messageBox = document.getElementById('messageBox');

        function showTab(tabName) {
            tabs.forEach(t => {
                t.classList.remove('tab-active');
                t.classList.add('text-gray-500');
            });
            tabContents.forEach(c => c.classList.add('hidden'));
            
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('tab-active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.remove('text-gray-500');
            document.getElementById(`${tabName}Tab`).classList.remove('hidden');
            hideMessage();
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => showTab(tab.dataset.tab));
        });

        function showMessage(text, isError = true) {
            messageBox.textContent = text;
            messageBox.className = `mb-4 p-3 rounded-xl text-sm text-center ${isError ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`;
            messageBox.classList.remove('hidden');
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        // تسجيل الدخول برقم الجوال
        document.getElementById('phoneLoginBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone || phone.length < 9) {
                showMessage('أدخل رقم جوال صحيح');
                return;
            }
            const btn = document.getElementById('phoneLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>جاري التحقق...';
            
            const result = await loginWithPhone(phone);
            
            btn.disabled = false;
            btn.textContent = 'تسجيل الدخول';
            
            if (result.success) {
                showMessage('✅ تم الدخول بنجاح', false);
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 800);
            } else {
                showMessage(result.message);
            }
        });

        // تسجيل الدخول بالبريد
        document.getElementById('emailLoginBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) {
                showMessage('أدخل البريد وكلمة المرور');
                return;
            }
            const btn = document.getElementById('emailLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>جاري التحقق...';
            
            const result = await loginWithEmail(email, password);
            
            btn.disabled = false;
            btn.textContent = 'تسجيل الدخول';
            
            if (result.success) {
                showMessage('✅ تم الدخول بنجاح', false);
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 800);
            } else {
                showMessage(result.message);
            }
        });

        // دخول المشرف
        document.getElementById('adminLoginBtn').addEventListener('click', async () => {
            const password = document.getElementById('adminPasswordInput').value.trim();
            if (!password) {
                showMessage('أدخل كلمة المرور');
                return;
            }
            const btn = document.getElementById('adminLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>جاري التحقق...';
            
            const result = await loginAsAdmin(password);
            
            btn.disabled = false;
            btn.textContent = 'دخول لوحة المشرف';
            
            if (result.success) {
                showMessage('✅ مرحباً بك يا المشرف', false);
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 800);
            } else {
                showMessage(result.message);
            }
        });
    </script>
</body>
</html>
