<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6', dark: '#1F2937', admin: '#6366F1', warning: '#F59E0B' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #F0FDF4 0%, #EFF6FF 100%); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
        .btn-primary { background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); }
        .input-focus:focus { box-shadow: 0 0 0 2px rgba(34,197,94,0.3); }
        .logo-circle { background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); }
    </style>
</head>
<body class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="logo-circle w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa fa-map-marker text-white text-4xl"></i>
            </div>
            <h1 class="text-xl font-bold text-dark">كشتات عائلة حسين العويشي</h1>
            <p class="text-gray-500 text-sm mt-1">اكتشف واستمتع بأجمل الأماكن</p>
        </div>

        <div class="glass rounded-3xl shadow-lg p-6">
            <div class="flex mb-6 bg-gray-100/60 rounded-xl p-1">
                <button class="tab-btn flex-1 py-2 rounded-lg text-sm font-medium bg-white shadow-sm text-primary" data-tab="phone">رقم الجوال</button>
                <button class="tab-btn flex-1 py-2 rounded-lg text-sm text-gray-500" data-tab="email">بريد إلكتروني</button>
                <button class="tab-btn flex-1 py-2 rounded-lg text-sm text-gray-500" data-tab="admin">مشرف</button>
            </div>

            <!-- تسجيل بالجوال - بدون كلمة سر فقط تحقق من الموافقة -->
            <div id="phoneTab" class="tab-content space-y-4">
                <input type="tel" id="phone" placeholder="أدخل رقم الجوال * مثال: 05xxxxxxxx" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <button onclick="loginPhone()" class="w-full btn-primary text-white py-3.5 rounded-xl font-medium">
                    <i class="fa fa-sign-in ml-2"></i> تسجيل الدخول
                </button>
                <p id="pendingNote" class="hidden text-sm text-warning text-center bg-warning/10 p-2 rounded-lg">
                    <i class="fa fa-clock-o ml-1"></i> رقمك بانتظار موافقة المشرف
                </p>
                <p id="rejectedNote" class="hidden text-sm text-danger text-center bg-red-50 p-2 rounded-lg">
                    <i class="fa fa-times-circle ml-1"></i> تم رفض هذا الرقم من المشرف
                </p>
                <p class="text-xs text-gray-400 text-center">لا تحتاج لكلمة مرور فقط أدخل رقمك الموافق عليه ✅</p>
            </div>

            <!-- تسجيل بالبريد وكلمة المرور -->
            <div id="emailTab" class="tab-content hidden space-y-4">
                <input type="email" id="email" placeholder="بريدك الإلكتروني" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <input type="password" id="emailPass" placeholder="كلمة المرور" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <button onclick="loginEmail()" class="w-full btn-primary text-white py-3.5 rounded-xl font-medium">
                    <i class="fa fa-sign-in ml-2"></i> تسجيل الدخول
                </button>
            </div>

            <!-- دخول المشرف -->
            <div id="adminTab" class="tab-content hidden space-y-4">
                <div class="text-center mb-2">
                    <div class="w-16 h-16 rounded-full bg-admin/10 flex items-center justify-center mx-auto mb-2">
                        <i class="fa fa-shield text-admin text-3xl"></i>
                    </div>
                    <p class="text-sm text-gray-500 mt-2">أدخل كلمة سر المشرف للدخول</p>
                </div>
                <input type="password" id="adminPass" placeholder="••••••••" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none text-center text-lg tracking-widest">
                <button onclick="loginAdmin()" class="w-full bg-admin text-white py-3.5 rounded-xl font-medium hover:bg-indigo-700">
                    <i class="fa fa-unlock ml-2"></i> دخول لوحة التحكم
                </button>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200/50 text-center text-sm space-y-2">
                <p>ليس لديك حساب؟ <a href="register.html" class="text-primary font-medium">طلب تسجيل جديد</a></p>
                <p><a href="home.html" class="text-gray-500">الدخول كزائر</a></p>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => {
                    b.classList.remove('bg-white','shadow-sm','text-primary','text-admin');
                    b.classList.add('text-gray-500');
                });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                if (btn.dataset.tab === 'admin') {
                    btn.classList.add('bg-white','shadow-sm','text-admin');
                } else {
                    btn.classList.add('bg-white','shadow-sm','text-primary');
                }
                document.getElementById(btn.dataset.tab + 'Tab').classList.remove('hidden');
                document.getElementById('pendingNote').classList.add('hidden');
                document.getElementById('rejectedNote').classList.add('hidden');
            });
        });

        function loginEmail() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('emailPass').value;
            if (!email || !pass) return alert('أدخل البريد وكلمة المرور');
            localStorage.setItem('user', JSON.stringify({email, phone: '', name: email.split('@')[0], type: 'user', status: 'approved', avatar: ''}));
            alert('✅ تم الدخول');
            location.href = 'home.html';
        }

        function loginPhone() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) return alert('أدخل رقم الجوال');
            
            const users = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
            const found = users.find(u => u.phone === phone);
            
            if (!found) return alert('❌ هذا الرقم غير مسجل لدينا. يرجى تقديم طلب تسجيل أولاً');
            
            if (found.status === 'pending') {
                document.getElementById('pendingNote').classList.remove('hidden');
                return;
            }
            if (found.status === 'rejected') {
                document.getElementById('rejectedNote').classList.remove('hidden');
                return;
            }
            if (found.status === 'approved') {
                localStorage.setItem('user', JSON.stringify({
                    id: found.id,
                    name: found.name,
                    phone: found.phone,
                    email: found.email || '',
                    type: 'user',
                    status: 'approved',
                    avatar: found.avatar || ''
                }));
                alert('✅ تم الدخول بنجاح، أهلاً بك يا ' + found.name);
                location.href = 'home.html';
            }
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'admin123') {
                localStorage.setItem('user', JSON.stringify({
                    name: 'المشرف',
                    type: 'admin',
                    avatar: '',
                    status: 'approved'
                }));
                alert('✅ دخول لوحة التحكم بنجاح');
                location.href = 'admin-dashboard.html';
            } else {
                alert('❌ كلمة سر المشرف غير صحيحة');
            }
        }
    </script>
</body>
</html>
