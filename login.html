<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007AFF',
                        primaryLight: 'rgba(0, 122, 255, 0.1)',
                        secondary: '#5E5CE6',
                        secondaryLight: 'rgba(94, 92, 230, 0.1)',
                        glassBg: 'rgba(255, 255, 255, 0.72)',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(180deg, rgba(0, 122, 255, 0.06) 0%, rgba(94, 92, 230, 0.04) 100%);
            min-height: 100vh;
        }
        .glass-ios {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .input-ios {
            background: rgba(118, 118, 128, 0.12);
            border: none;
            transition: all 0.2s ease;
        }
        .input-ios:focus {
            background: rgba(118, 118, 128, 0.08);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
            outline: none;
        }
        .btn-primary-ios {
            background: linear-gradient(135deg, #007AFF 0%, #0066DD 100%);
            transition: all 0.2s ease;
        }
        .btn-primary-ios:hover {
            transform: translateY(-0.5px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }
        .btn-secondary-ios {
            background: linear-gradient(135deg, #5E5CE6 0%, #4A48D4 100%);
            transition: all 0.2s ease;
        }
        .btn-secondary-ios:hover {
            transform: translateY(-0.5px);
            box-shadow: 0 4px 12px rgba(94, 92, 230, 0.25);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-md">
        <!-- الشعار والعنوان -->
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-primaryLight rounded-full flex items-center justify-center mx-auto mb-5">
                <i class="fa fa-map text-primary text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">كشتات عائلة حسين العويشي</h1>
            <p class="text-gray-500 mt-2 text-sm">منصة عائلية لمشاركة الأماكن المفضلة</p>
        </div>

        <!-- بطاقة الدخول -->
        <div class="glass-ios rounded-3xl shadow-xl p-7">
            <!-- دخول برقم الجوال -->
            <div>
                <h2 class="text-base font-semibold text-gray-700 mb-4 text-center">دخول أفراد العائلة</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">رقم الجوال</label>
                        <input 
                            type="tel" 
                            id="phoneInput" 
                            placeholder="05XXXXXXXX" 
                            maxlength="10"
                            class="w-full px-4 py-3.5 rounded-xl input-ios text-gray-800"
                        >
                    </div>
                    <button 
                        id="phoneLoginBtn"
                        class="w-full btn-primary-ios text-white font-medium py-3.5 rounded-xl"
                    >
                        <span>تسجيل الدخول</span>
                    </button>
                </div>
            </div>

            <div class="relative my-7">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200/60"></div>
                </div>
                <div class="relative flex justify-center">
                    <span class="px-4 bg-transparent text-gray-400 text-sm">أو</span>
                </div>
            </div>

            <!-- دخول المشرف -->
            <div>
                <h2 class="text-base font-semibold text-gray-700 mb-4 text-center">لوحة المشرف</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">كلمة المرور</label>
                        <input 
                            type="password" 
                            id="adminPasswordInput" 
                            placeholder="••••••••"
                            class="w-full px-4 py-3.5 rounded-xl input-ios text-gray-800"
                        >
                    </div>
                    <button 
                        id="adminLoginBtn"
                        class="w-full btn-secondary-ios text-white font-medium py-3.5 rounded-xl"
                    >
                        <span>دخول المشرف</span>
                    </button>
                </div>
            </div>

            <!-- رسالة الخطأ/النجاح -->
            <div id="message" class="mt-5 text-center hidden text-sm"></div>
        </div>

        <p class="text-center text-xs text-gray-400 mt-6 leading-relaxed">
            ⚠️ إذا لم تتمكن من الدخول، يرجى طلب إضافة رقم جوالك من المشرف
        </p>
    </div>

    <script type="module">
        import { loginWithPhone, loginAsAdmin } from './auth.js';

        const phoneInput = document.getElementById('phoneInput');
        const phoneLoginBtn = document.getElementById('phoneLoginBtn');
        const adminPasswordInput = document.getElementById('adminPasswordInput');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = true) {
            messageDiv.textContent = text;
            messageDiv.className = `mt-5 text-center p-3 rounded-xl text-sm ${isError ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-primary'}`;
            messageDiv.classList.remove('hidden');
            setTimeout(() => messageDiv.classList.add('hidden'), 5000);
        }

        phoneLoginBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            if (!phone) return showMessage('يرجى إدخال رقم الجوال');
            
            const result = await loginWithPhone(phone);
            if (result.success) {
                showMessage('✅ تم الدخول بنجاح', false);
                setTimeout(() => window.location.href = 'home.html', 800);
            } else {
                showMessage(result.message);
            }
        });

        adminLoginBtn.addEventListener('click', () => {
            const password = adminPasswordInput.value;
            if (!password) return showMessage('يرجى إدخال كلمة المرور');
            
            const result = loginAsAdmin(password);
            if (result.success) {
                showMessage('✅ مرحباً يا المشرف', false);
                setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
            } else {
                showMessage(result.message);
            }
        });

        phoneInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') phoneLoginBtn.click();
        });
        adminPasswordInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') adminLoginBtn.click();
        });
    </script>
</body>
</html>
