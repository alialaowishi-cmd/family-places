<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6', dark: '#1F2937' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #F0FDF4 0%, #EFF6FF 100%); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
        .btn-primary { background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); }
        .btn-primary:active { transform: scale(0.97); }
        .input-focus:focus { box-shadow: 0 0 0 2px rgba(34,197,94,0.3); }
    </style>
</head>
<body class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 glass rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i class="fa fa-map-marker-alt text-primary text-3xl"></i>
            </div>
            <h1 class="text-xl font-bold text-dark">كشتات عائلة حسين العويشي</h1>
            <p class="text-gray-500 text-sm mt-1">سجل الدخول للمتابعة</p>
        </div>

        <div class="glass rounded-3xl shadow-lg p-6">
            <div class="flex mb-6 bg-gray-100/60 rounded-xl p-1">
                <button class="tab-btn flex-1 py-2 rounded-lg text-sm font-medium bg-white shadow-sm text-primary" data-tab="email">بريد إلكتروني</button>
                <button class="tab-btn flex-1 py-2 rounded-lg text-sm text-gray-500" data-tab="phone">رقم الجوال</button>
                <button class="tab-btn flex-1 py-2 rounded-lg text-sm text-gray-500" data-tab="admin">مشرف</button>
            </div>

            <!-- تسجيل بالبريد -->
            <div id="emailTab" class="tab-content space-y-4">
                <input type="email" id="email" placeholder="بريدك الإلكتروني" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <input type="password" id="emailPass" placeholder="كلمة المرور" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <button onclick="loginEmail()" class="w-full btn-primary text-white py-3.5 rounded-xl font-medium">
                    <i class="fa fa-sign-in ml-2"></i> تسجيل الدخول
                </button>
            </div>

            <!-- تسجيل بالجوال -->
            <div id="phoneTab" class="tab-content hidden space-y-4">
                <input type="tel" id="phone" placeholder="05xxxxxxxx" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <input type="password" id="phonePass" placeholder="كلمة المرور" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <button onclick="loginPhone()" class="w-full btn-primary text-white py-3.5 rounded-xl font-medium">
                    <i class="fa fa-sign-in ml-2"></i> تسجيل الدخول
                </button>
            </div>

            <!-- دخول المشرف -->
            <div id="adminTab" class="tab-content hidden space-y-4">
                <input type="email" id="adminEmail" placeholder="بريد المشرف" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <input type="password" id="adminPass" placeholder="كلمة المرور" 
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 input-focus outline-none">
                <button onclick="loginAdmin()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-medium hover:bg-indigo-700">
                    <i class="fa fa-shield ml-2"></i> دخول المشرف
                </button>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200/50 text-center text-sm space-y-2">
                <p>ليس لديك حساب؟ <a href="register.html" class="text-primary font-medium">إنشاء حساب جديد</a></p>
                <p><a href="home.html" class="text-gray-500">الدخول كزائر</a></p>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => {
                    b.classList.remove('bg-white','shadow-sm','text-primary');
                    b.classList.add('text-gray-500');
                });
                btn.classList.add('bg-white','shadow-sm','text-primary');
                btn.classList.remove('text-gray-500');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.dataset.tab + 'Tab').classList.remove('hidden');
            });
        });

        function loginEmail() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('emailPass').value;
            if (!email || !pass) return alert('أدخل البريد وكلمة المرور');
            localStorage.setItem('user', JSON.stringify({email, phone: '', name: email.split('@')[0], type: 'user', avatar: ''}));
            alert('✅ تم الدخول');
            location.href = 'home.html';
        }
        function loginPhone() {
            const phone = document.getElementById('phone').value.trim();
            const pass = document.getElementById('phonePass').value;
            if (!phone || !pass) return alert('أدخل رقم الجوال وكلمة المرور');
            localStorage.setItem('user', JSON.stringify({phone, email: '', name: 'مستخدم', type: 'user', avatar: ''}));
            alert('✅ تم الدخول');
            location.href = 'home.html';
        }
        function loginAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            if (email === 'Alihossin28@gmail.com' && pass === 'admin123') {
                localStorage.setItem('user', JSON.stringify({email, name: 'المشرف', type: 'admin', avatar: ''}));
                alert('✅ دخول المشرف بنجاح');
                location.href = 'home.html';
            } else alert('❌ بيانات المشرف غير صحيحة');
        }
    </script>
</body>
</html>
