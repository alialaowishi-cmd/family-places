<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.97); }
        .tab-active { border-bottom: 2px solid #3B82F6; color: #3B82F6; }
    </style>
</head>
<body class="text-white flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <!-- الشعار -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                كشتات عائلة حسين العويشي
            </h1>
            <p class="text-slate-400 mt-2">منصة العائلة لمشاركة الأماكن المفضلة</p>
        </div>

        <!-- بطاقة الدخول -->
        <div class="bg-slate-800/60 backdrop-blur-md border border-slate-700 rounded-2xl p-6 shadow-xl">
            <!-- التبويبات -->
            <div class="flex border-b border-slate-700 mb-6">
                <button id="tabEmail" class="flex-1 py-3 text-center tab-active">
                    <i class="fa fa-envelope ml-2"></i>البريد الإلكتروني
                </button>
                <button id="tabPhone" class="flex-1 py-3 text-center text-slate-400">
                    <i class="fa fa-mobile ml-2"></i>رقم الجوال
                </button>
                <button id="tabAdmin" class="flex-1 py-3 text-center text-slate-400">
                    <i class="fa fa-shield ml-2"></i>المشرف
                </button>
            </div>

            <!-- نموذج البريد الإلكتروني -->
            <div id="formEmail" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="emailInput" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:border-secondary focus:outline-none" placeholder="example@email.com">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">كلمة المرور</label>
                    <input type="password" id="passwordInput" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:border-secondary focus:outline-none" placeholder="••••••••">
                </div>
                <button id="loginEmailBtn" class="w-full btn-primary py-3 rounded-lg font-medium mt-2">
                    <span>تسجيل الدخول</span>
                    <i id="emailLoading" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
                <p id="emailError" class="text-red-400 text-sm text-center hidden"></p>
            </div>

            <!-- نموذج رقم الجوال -->
            <div id="formPhone" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">رقم الجوال</label>
                    <input type="tel" id="phoneInput" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:border-secondary focus:outline-none" placeholder="05XXXXXXXX">
                </div>
                <button id="loginPhoneBtn" class="w-full btn-primary py-3 rounded-lg font-medium mt-2">
                    <span>تسجيل الدخول</span>
                    <i id="phoneLoading" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
                <p id="phoneError" class="text-red-400 text-sm text-center hidden"></p>
                <div class="text-center pt-2">
                    <button id="showRegisterBtn" class="text-sm text-secondary hover:underline">ليس لدي حساب؟ سجل الآن</button>
                </div>
            </div>

            <!-- نموذج المشرف -->
            <div id="formAdmin" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">كلمة مرور المشرف</label>
                    <input type="password" id="adminPassInput" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:border-secondary focus:outline-none" placeholder="••••••••">
                </div>
                <button id="loginAdminBtn" class="w-full bg-yellow-600 hover:bg-yellow-500 py-3 rounded-lg font-medium mt-2 transition">
                    <span>دخول لوحة المشرف</span>
                    <i id="adminLoading" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
                <p id="adminError" class="text-red-400 text-sm text-center hidden"></p>
            </div>

            <!-- نموذج التسجيل -->
            <div id="formRegister" class="space-y-4 hidden">
                <button id="backToPhoneBtn" class="text-sm text-slate-400 mb-2 inline-block">
                    <i class="fa fa-arrow-right ml-1"></i>الرجوع
                </button>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">الاسم الكامل</label>
                    <input type="text" id="regNameInput" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:border-secondary focus:outline-none" placeholder="أدخل اسمك الكامل">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">رقم الجوال</label>
                    <input type="tel" id="regPhoneInput" class="w-full px-4 py-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:border-secondary focus:outline-none" placeholder="05XXXXXXXX">
                </div>
                <button id="registerBtn" class="w-full btn-primary py-3 rounded-lg font-medium mt-2">
                    <span>إرسال طلب التسجيل</span>
                    <i id="regLoading" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
                <p id="regMessage" class="text-green-400 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginWithEmail, loginWithPhone, loginAsAdmin, registerWithPhone } from './auth.js';

        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ صفحة الدخول جاهزة');
            
            // التبويبات
            document.getElementById('tabEmail').onclick = () => switchTab('email');
            document.getElementById('tabPhone').onclick = () => switchTab('phone');
            document.getElementById('tabAdmin').onclick = () => switchTab('admin');

            // أزرار الدخول
            document.getElementById('loginEmailBtn').onclick = handleEmailLogin;
            document.getElementById('loginPhoneBtn').onclick = handlePhoneLogin;
            document.getElementById('loginAdminBtn').onclick = handleAdminLogin;

            // التسجيل
            document.getElementById('showRegisterBtn').onclick = () => {
                document.getElementById('formPhone').classList.add('hidden');
                document.getElementById('formRegister').classList.remove('hidden');
            };
            document.getElementById('backToPhoneBtn').onclick = () => {
                document.getElementById('formRegister').classList.add('hidden');
                document.getElementById('formPhone').classList.remove('hidden');
            };
            document.getElementById('registerBtn').onclick = handleRegister;
        });

        function switchTab(tab) {
            // إخفاء جميع النماذج
            document.getElementById('formEmail').classList.add('hidden');
            document.getElementById('formPhone').classList.add('hidden');
            document.getElementById('formAdmin').classList.add('hidden');
            document.getElementById('formRegister').classList.add('hidden');

            // إزالة التنشيط من جميع التبويبات
            document.getElementById('tabEmail').classList.remove('tab-active');
            document.getElementById('tabPhone').classList.remove('tab-active');
            document.getElementById('tabAdmin').classList.remove('tab-active');
            document.getElementById('tabEmail').classList.add('text-slate-400');
            document.getElementById('tabPhone').classList.add('text-slate-400');
            document.getElementById('tabAdmin').classList.add('text-slate-400');

            // عرض النموذج المحدد
            if (tab === 'email') {
                document.getElementById('formEmail').classList.remove('hidden');
                document.getElementById('tabEmail').classList.add('tab-active');
                document.getElementById('tabEmail').classList.remove('text-slate-400');
            } else if (tab === 'phone') {
                document.getElementById('formPhone').classList.remove('hidden');
                document.getElementById('tabPhone').classList.add('tab-active');
                document.getElementById('tabPhone').classList.remove('text-slate-400');
            } else if (tab === 'admin') {
                document.getElementById('formAdmin').classList.remove('hidden');
                document.getElementById('tabAdmin').classList.add('tab-active');
                document.getElementById('tabAdmin').classList.remove('text-slate-400');
            }
        }

        async function handleEmailLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const loading = document.getElementById('emailLoading');
            const error = document.getElementById('emailError');

            if (!email || !password) {
                error.textContent = 'أدخل البريد وكلمة المرور';
                error.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            error.classList.add('hidden');

            const result = await loginWithEmail(email, password);
            loading.classList.add('hidden');

            if (result.success) {
                window.location.href = 'home.html';
            } else {
                error.textContent = result.error || 'فشل تسجيل الدخول';
                error.classList.remove('hidden');
            }
        }

        async function handlePhoneLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            const loading = document.getElementById('phoneLoading');
            const error = document.getElementById('phoneError');

            if (!phone) {
                error.textContent = 'أدخل رقم الجوال';
                error.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            error.classList.add('hidden');

            const result = await loginWithPhone(phone);
            loading.classList.add('hidden');

            if (result.success) {
                window.location.href = 'home.html';
            } else {
                error.textContent = result.error || 'فشل تسجيل الدخول';
                error.classList.remove('hidden');
            }
        }

        async function handleAdminLogin() {
            const pass = document.getElementById('adminPassInput').value;
            const loading = document.getElementById('adminLoading');
            const error = document.getElementById('adminError');

            if (!pass) {
                error.textContent = 'أدخل كلمة المرور';
                error.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            error.classList.add('hidden');

            const result = await loginAsAdmin(pass);
            loading.classList.add('hidden');

            if (result.success) {
                window.location.href = 'admin-dashboard.html';
            } else {
                error.textContent = result.error || 'كلمة المرور غير صحيحة';
                error.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regNameInput').value.trim();
            const phone = document.getElementById('regPhoneInput').value.trim();
            const loading = document.getElementById('regLoading');
            const message = document.getElementById('regMessage');

            if (!name || !phone) {
                message.textContent = 'أدخل الاسم ورقم الجوال';
                message.classList.remove('hidden', 'text-green-400');
                message.classList.add('text-red-400');
                return;
            }

            loading.classList.remove('hidden');
            message.classList.add('hidden');

            const result = await registerWithPhone(name, phone);
            loading.classList.add('hidden');

            if (result.success) {
                message.textContent = '✅ تم استلام طلبك، انتظر موافقة المشرف';
                message.classList.remove('hidden', 'text-red-400');
                message.classList.add('text-green-400');
                document.getElementById('regNameInput').value = '';
                document.getElementById('regPhoneInput').value = '';
            } else {
                message.textContent = result.error || 'حدث خطأ، حاول مرة أخرى';
                message.classList.remove('hidden', 'text-green-400');
                message.classList.add('text-red-400');
            }
        }
    </script>
</body>
</html>
