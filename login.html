<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                        admin: '#7c3aed',
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .tab-active { background: linear-gradient(135deg, #16a34a, #15803d); color: white; }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
        .shake { animation: shake 0.4s ease; }
        @keyframes shake {
            0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}
        }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity:0; transform:translateY(15px); }
            to { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-50 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md fade-in">
        <!-- الشعار -->
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa fa-home text-white text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800">كشتات عائلة حسين العويشي</h1>
        </div>

        <!-- تبديل نوع الدخول -->
        <div class="bg-gray-100 p-1 rounded-xl mb-6 flex">
            <button id="tabUser" class="flex-1 py-2.5 rounded-lg font-medium transition tab-active">
                <i class="fa fa-user ml-1"></i> مستخدم
            </button>
            <button id="tabAdmin" class="flex-1 py-2.5 rounded-lg font-medium transition text-gray-600 hover:bg-gray-200">
                <i class="fa fa-shield ml-1"></i> مشرف
            </button>
        </div>

        <!-- بطاقة الدخول -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
            
            <!-- 📱 نموذج المستخدم برقم الجوال -->
            <form id="userLoginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fa fa-mobile ml-1 text-primary"></i> رقم الجوال
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 font-medium">+966</span>
                        <input 
                            type="tel" id="userPhone" maxlength="9" inputmode="numeric"
                            class="w-full pr-12 pl-4 py-3 border border-gray-300 rounded-lg outline-none transition input-focus text-lg"
                            placeholder="5XXXXXXXX" required
                        >
                    </div>
                    <p id="userPhoneError" class="text-red-500 text-sm mt-1 hidden">رقم الجوال غير مسجل، تواصل مع المشرف</p>
                    <p class="text-xs text-gray-400 mt-1">أدخل 9 أرقام بدون الصفر الأول</p>
                </div>
                <button type="submit" id="userLoginBtn" 
                    class="w-full bg-gradient-to-r from-primary to-secondary text-white py-3 rounded-lg font-semibold hover:shadow-lg transition">
                    <span id="userLoginText">الدخول</span>
                    <i id="userSpinner" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </form>

            <!-- 🔐 نموذج المشرف (مخفي افتراضياً) -->
            <form id="adminLoginForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fa fa-envelope ml-1 text-admin"></i> البريد الإلكتروني
                    </label>
                    <input 
                        type="email" id="adminEmail"
                        class="w-full p-3 border border-gray-300 rounded-lg outline-none transition focus:ring-2 focus:ring-admin/20"
                        placeholder="البريد" required
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fa fa-lock ml-1 text-admin"></i> كلمة المرور
                    </label>
                    <input 
                        type="password" id="adminPass"
                        class="w-full p-3 border border-gray-300 rounded-lg outline-none transition focus:ring-2 focus:ring-admin/20"
                        placeholder="••••••••" required
                    >
                </div>
                <p id="adminError" class="text-red-500 text-sm hidden">بريد أو كلمة مرور غير صحيحة</p>
                <button type="submit" id="adminLoginBtn"
                    class="w-full bg-gradient-to-r from-admin to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition">
                    <span id="adminLoginText">دخول المشرف</span>
                    <i id="adminSpinner" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </form>
        </div>

        <p class="text-center mt-4">
            <a href="home.html" class="text-primary hover:underline text-sm">
                <i class="fa fa-home ml-1"></i> العودة للصفحة الرئيسية
            </a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // بيانات المشرف الثابتة
        const ADMIN_DATA = {
            email: "Alihossin28@gmail.com",
            password: "admin123",
            fullName: "المشرف",
            phone: "0500509134"
        };

        // عناصر التبديل
        const tabUser = document.getElementById('tabUser');
        const tabAdmin = document.getElementById('tabAdmin');
        const userLoginForm = document.getElementById('userLoginForm');
        const adminLoginForm = document.getElementById('adminLoginForm');

        tabUser.addEventListener('click', () => {
            tabUser.classList.add('tab-active');
            tabUser.classList.remove('text-gray-600', 'hover:bg-gray-200');
            tabAdmin.classList.remove('tab-active');
            tabAdmin.classList.add('text-gray-600', 'hover:bg-gray-200');
            userLoginForm.classList.remove('hidden');
            adminLoginForm.classList.add('hidden');
        });

        tabAdmin.addEventListener('click', () => {
            tabAdmin.classList.add('tab-active');
            tabAdmin.classList.remove('text-gray-600', 'hover:bg-gray-200');
            tabUser.classList.remove('tab-active');
            tabUser.classList.add('text-gray-600', 'hover:bg-gray-200');
            userLoginForm.classList.add('hidden');
            adminLoginForm.classList.remove('hidden');
        });

        // 👤 تسجيل دخول المستخدم برقم الجوال
        const userPhone = document.getElementById('userPhone');
        const userPhoneError = document.getElementById('userPhoneError');
        const userLoginBtn = document.getElementById('userLoginBtn');
        const userLoginText = document.getElementById('userLoginText');
        const userSpinner = document.getElementById('userSpinner');

        userPhone.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            userPhoneError.classList.add('hidden');
            userPhone.classList.remove('border-red-500', 'shake');
        });

        userLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let phone = userPhone.value.trim();
            
            if (phone.length !== 9) {
                showUserError('أدخل 9 أرقام فقط');
                return;
            }

            setUserLoading(true);

            try {
                const fullPhone = "+966" + phone;
                // التحقق من أن الرقم مسجل لدى المشرف
                const q = query(collection(db, 'authorizedUsers'), where('phone', '==', fullPhone));
                const snap = await getDocs(q);

                if (snap.empty) {
                    showUserError('رقم الجوال غير مسجل، تواصل مع المشرف');
                    setUserLoading(false);
                    return;
                }

                const userData = snap.docs[0].data();
                
                // ✅ تسجيل ناجح
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userType', 'user');
                localStorage.setItem('userName', userData.fullName || 'مستخدم');
                localStorage.setItem('userPhone', fullPhone);
                localStorage.setItem('loginTime', new Date().toISOString());

                window.location.href = 'home.html';
            } catch (err) {
                console.error(err);
                showUserError('حدث خطأ، حاول مرة أخرى');
            } finally {
                setUserLoading(false);
            }
        });

        function showUserError(msg) {
            userPhoneError.textContent = msg;
            userPhoneError.classList.remove('hidden');
            userPhone.classList.add('border-red-500', 'shake');
            setTimeout(() => userPhone.classList.remove('shake'), 400);
        }

        function setUserLoading(loading) {
            userPhone.disabled = loading;
            userLoginBtn.disabled = loading;
            userLoginText.textContent = loading ? 'جاري التحقق...' : 'الدخول';
            userSpinner.classList.toggle('hidden', !loading);
        }

        // 🛡️ تسجيل دخول المشرف
        const adminEmail = document.getElementById('adminEmail');
        const adminPass = document.getElementById('adminPass');
        const adminError = document.getElementById('adminError');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminLoginText = document.getElementById('adminLoginText');
        const adminSpinner = document.getElementById('adminSpinner');

        adminLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = adminEmail.value.trim();
            const pass = adminPass.value;

            setAdminLoading(true);

            // التحقق من بيانات المشرف
            if (email === ADMIN_DATA.email && pass === ADMIN_DATA.password) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userType', 'admin');
                localStorage.setItem('userName', ADMIN_DATA.fullName);
                localStorage.setItem('userEmail', ADMIN_DATA.email);
                localStorage.setItem('userPhone', ADMIN_DATA.phone);
                localStorage.setItem('loginTime', new Date().toISOString());
                
                window.location.href = 'admin-users.html'; // توجيه للوحة التحكم
            } else {
                adminError.classList.remove('hidden');
                adminEmail.classList.add('border-red-500', 'shake');
                adminPass.classList.add('border-red-500');
                setTimeout(() => {
                    adminEmail.classList.remove('shake');
                    adminEmail.classList.remove('border-red-500');
                    adminPass.classList.remove('border-red-500');
                }, 2000);
            }

            setAdminLoading(false);
        });

        function setAdminLoading(loading) {
            adminEmail.disabled = loading;
            adminPass.disabled = loading;
            adminLoginBtn.disabled = loading;
            adminLoginText.textContent = loading ? 'جاري التحقق...' : 'دخول المشرف';
            adminSpinner.classList.toggle('hidden', !loading);
        }
    </script>
</body>
</html>
