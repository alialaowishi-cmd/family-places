<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="cityTitle">المدينة — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { 
            background: #0F172A; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 85px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); 
            transition: all 0.2s ease;
        }
        .place-card { 
            background: #1E293B; 
            border: 1px solid #334155; 
            transition: all 0.2s ease;
        }
        .place-card:hover { 
            border-color: #3B82F6; 
            transform: translateY(-2px);
        }
        button { cursor: pointer; font-family: inherit; }
        .skeleton { background: linear-gradient(90deg, #1E293B 25%, #334155 50%, #1E293B 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 p-2"><i class="fa fa-arrow-right fa-lg"></i></button>
            <h1 id="cityNameHeader" class="text-lg font-bold">اسم المدينة</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="px-4 py-6">
        <div id="authLoading" class="flex flex-col items-center justify-center py-20">
            <i class="fa fa-spinner fa-spin text-3xl text-secondary mb-4"></i>
            <p class="text-slate-400">جاري التحقق من الحالة...</p>
        </div>

        <div id="mainContent" class="hidden">
            <div class="flex gap-3 mb-6">
                <button id="addPlaceInCityBtn" class="flex-1 btn-primary py-3 rounded-xl font-medium flex items-center justify-center gap-2">
                    <i class="fa fa-plus"></i> إضافة مكان
                </button>
                <button id="backToCitiesBtn" class="bg-slate-700 hover:bg-slate-600 py-3 px-4 rounded-xl transition">
                    <i class="fa fa-home"></i>
                </button>
            </div>

            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold">📍 الأماكن</h2>
                    <span id="placeCount" class="text-sm text-slate-400">جاري التحميل...</span>
                </div>

                <div id="placesContainer" class="space-y-4">
                    <div class="h-28 rounded-xl skeleton"></div>
                    <div class="h-28 rounded-xl skeleton"></div>
                </div>

                <div id="noPlacesState" class="text-center py-12 hidden">
                    <i class="fa fa-map-marker text-5xl text-slate-600 mb-4"></i>
                    <h3 class="text-lg font-medium text-slate-400 mb-2">لا توجد أماكن مضافة بعد</h3>
                    <p class="text-sm text-slate-500 mb-6">كن أول من يضيف مكاناً في هذه المدينة 🎉</p>
                    <button id="addFirstPlaceBtn" class="btn-primary px-6 py-2 rounded-lg font-medium">
                        <i class="fa fa-plus ml-1"></i> إضافة أول مكان
                    </button>
                </div>
            </section>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-dark/95 backdrop-blur-md border-t border-slate-700 px-2 py-2">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button id="navHomeBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-home text-lg mb-1"></i>الرئيسية
            </button>
            <button class="flex flex-col items-center text-xs text-secondary py-1">
                <i class="fa fa-building text-lg mb-1"></i>المدن
            </button>
            <button id="navAddBtn" class="flex flex-col items-center text-xs py-1">
                <div class="w-12 h-12 bg-secondary rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-secondary/30">
                    <i class="fa fa-plus text-xl text-white"></i>
                </div>
            </button>
            <button id="navNotificationsBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-bell text-lg mb-1"></i>الإشعارات
            </button>
            <button id="navProfileBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-user text-lg mb-1"></i>حسابي
            </button>
        </div>
    </nav>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getPlaces } from './db.js';
        import './firebase-config.js';

        const auth = getAuth();
        let currentCity = '';
        let places = [];

        // ✅ التحقق من Firebase Authentication وليس localStorage
        onAuthStateChanged(auth, (user) => {
            document.getElementById('authLoading').classList.add('hidden');
            
            if (!user) {
                console.log('⚠️ المستخدم غير مسجل، الانتقال لصفحة الدخول');
                window.location.href = 'login.html';
                return;
            }

            console.log('✅ المستخدم مسجل الدخول:', user.uid);
            document.getElementById('mainContent').classList.remove('hidden');
            initPage();
        });

        function initPage() {
            const params = new URLSearchParams(window.location.search);
            currentCity = params.get('name');
            
            if (!currentCity) {
                alert('⚠️ اسم المدينة غير صالح');
                window.location.href = 'home.html';
                return;
            }

            document.getElementById('cityNameHeader').textContent = currentCity;
            document.getElementById('cityTitle').textContent = currentCity + ' — كشتات عائلة حسين العويشي';

            bindEvents();
            loadPlaces();
        }

        function bindEvents() {
            document.getElementById('backBtn').onclick = () => window.location.href = 'home.html';
            document.getElementById('backToCitiesBtn').onclick = () => window.location.href = 'home.html';
            document.getElementById('addPlaceInCityBtn').onclick = goToAddPlace;
            document.getElementById('addFirstPlaceBtn').onclick = goToAddPlace;
            document.getElementById('navAddBtn').onclick = goToAddPlace;
            document.getElementById('navHomeBtn').onclick = () => window.location.href = 'home.html';
            document.getElementById('navProfileBtn').onclick = () => window.location.href = 'profile.html';
        }

        function goToAddPlace() {
            window.location.href = `add-place.html?city=${encodeURIComponent(currentCity)}`;
        }

        async function loadPlaces() {
            try {
                console.log('⏳ جاري تحميل أماكن:', currentCity);
                places = await getPlaces(currentCity);
                console.log('✅ تم تحميل الأماكن:', places);
                renderPlaces();
            } catch (error) {
                console.error('❌ خطأ تحميل الأماكن:', error);
                document.getElementById('placesContainer').innerHTML = '<p class="text-center text-slate-400 py-8">حدث خطأ في تحميل الأماكن</p>';
            }
        }

        function renderPlaces() {
            const container = document.getElementById('placesContainer');
            const noPlaces = document.getElementById('noPlacesState');
            const countEl = document.getElementById('placeCount');

            container.innerHTML = '';
            countEl.textContent = `${places.length} مكان`;

            if (places.length === 0) {
                container.classList.add('hidden');
                noPlaces.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            noPlaces.classList.add('hidden');

            places.forEach(place => {
                const imageUrl = place.images && place.images.length > 0 ? place.images[0] : null;
                
                const card = document.createElement('div');
                card.className = 'place-card rounded-xl p-4 cursor-pointer';
                card.innerHTML = `
                    <div class="flex gap-4">
                        ${imageUrl 
                            ? `<img src="${imageUrl}" class="w-20 h-20 rounded-lg object-cover flex-shrink-0">`
                            : `<div class="w-20 h-20 rounded-lg bg-slate-700 flex items-center justify-center flex-shrink-0">
                                <i class="fa fa-map-marker text-xl text-slate-500"></i>
                               </div>`
                        }
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-lg truncate">${place.name}</h3>
                            <p class="text-sm text-slate-400">${place.category || 'غير مصنف'}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-yellow-400 text-sm">
                                    ${'★'.repeat(place.rating || 0)}${'☆'.repeat(5 - (place.rating || 0))}
                                </span>
                                ${place.price ? `<span class="text-xs text-slate-400">· ${place.price}</span>` : ''}
                            </div>
                            ${place.phone ? `
                                <a href="tel:${place.phone}" class="inline-flex items-center text-sm text-green-400 mt-1">
                                    <i class="fa fa-phone ml-1 text-xs"></i>${place.phone}
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;
                card.onclick = () => {
                    window.location.href = `place-detail.html?id=${encodeURIComponent(place.id)}`;
                };
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
