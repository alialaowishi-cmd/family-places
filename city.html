<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدينة — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { background: #0F172A; font-family: 'Tajawal', sans-serif; min-height: 100vh; padding-bottom: 85px; }
        .place-card { transition: all 0.2s ease; cursor: pointer; }
        .place-card:hover { transform: translateY(-2px); border-color: #3B82F6; }
        .avatar-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        button { cursor: pointer; font-family: inherit; }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 hover:text-white transition p-2">
                <i class="fa fa-arrow-right fa-lg"></i>
            </button>
            <h1 id="cityTitle" class="text-lg font-bold">المدينة</h1>
            <button id="addPlaceBtn" class="text-secondary hover:text-secondary/80 text-sm font-medium">
                <i class="fa fa-plus ml-1"></i> إضافة مكان
            </button>
        </div>
    </header>

    <main class="px-4 py-6">
        <div id="placesContainer" class="space-y-4">
            <!-- الأماكن ستظهر هنا -->
        </div>
        <div id="emptyState" class="text-center py-16 hidden">
            <i class="fa fa-map-o text-5xl text-slate-600 mb-4"></i>
            <h3 class="text-lg font-medium text-slate-400 mb-2">لا توجد أماكن مضافة بعد</h3>
            <p class="text-sm text-slate-500 mb-6">كن أول من يضيف مكاناً في هذه المدينة! 🎉</p>
            <button id="addFirstPlaceBtn" class="btn-primary px-6 py-2 rounded-lg font-medium">
                <i class="fa fa-plus ml-1"></i> إضافة أول مكان
            </button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-dark/95 backdrop-blur-md border-t border-slate-700 px-2 py-2">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-home text-lg mb-1"></i>الرئيسية
            </button>
            <button class="flex flex-col items-center text-xs text-secondary py-1">
                <i class="fa fa-building text-lg mb-1"></i>مدينة
            </button>
            <button onclick="window.location.href='add-place.html'" class="flex flex-col items-center text-xs py-1">
                <div class="w-11 h-11 bg-slate-700 rounded-full flex items-center justify-center -mt-5 border border-slate-600">
                    <i class="fa fa-plus text-lg text-slate-300"></i>
                </div>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-user text-lg mb-1"></i>حسابي
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-cog text-lg mb-1"></i>المشرف
            </button>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const cityName = params.get('name');
            
            if (!cityName) {
                window.location.href = 'home.html';
                return;
            }

            document.getElementById('cityTitle').textContent = cityName;
            const backBtn = document.getElementById('backBtn');
            const addPlaceBtn = document.getElementById('addPlaceBtn');
            const addFirstPlaceBtn = document.getElementById('addFirstPlaceBtn');
            const placesContainer = document.getElementById('placesContainer');
            const emptyState = document.getElementById('emptyState');

            backBtn.addEventListener('click', () => window.location.href = 'home.html');
            addPlaceBtn.addEventListener('click', () => window.location.href = 'add-place.html?city=' + encodeURIComponent(cityName));
            addFirstPlaceBtn.addEventListener('click', () => window.location.href = 'add-place.html?city=' + encodeURIComponent(cityName));

            loadPlaces();

            function loadPlaces() {
                const allPlaces = JSON.parse(localStorage.getItem('places') || '[]');
                const cityPlaces = allPlaces.filter(p => p.city === cityName);

                if (cityPlaces.length === 0) {
                    placesContainer.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                placesContainer.classList.remove('hidden');
                emptyState.classList.add('hidden');
                placesContainer.innerHTML = '';

                cityPlaces.forEach(place => {
                    const stars = '★'.repeat(place.rating) + '☆'.repeat(5 - place.rating);
                    const imageUrl = place.images && place.images.length > 0 ? place.images[0] : null;
                    const ownerAvatar = place.ownerAvatar || '';
                    
                    const card = document.createElement('div');
                    card.className = 'place-card bg-slate-800/60 border border-slate-700 rounded-xl overflow-hidden';
                    card.innerHTML = `
                        ${imageUrl ? `<img src="${imageUrl}" class="w-full h-40 object-cover">` : '<div class="w-full h-40 bg-slate-700 flex items-center justify-center"><i class="fa fa-image text-3xl text-slate-500"></i></div>'}
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-bold">${place.name}</h3>
                                <span class="text-yellow-400 text-sm">${stars}</span>
                            </div>
                            <p class="text-sm text-slate-400 mb-3">
                                <i class="fa fa-tag ml-1"></i> ${place.category}
                                ${place.price ? ` · ${place.price}` : ''}
                            </p>
                            
                            <!-- اسم وصورة صاحب المكان ✅ -->
                            <div class="flex items-center gap-2 pt-3 border-t border-slate-700">
                                ${ownerAvatar 
                                    ? `<img src="${ownerAvatar}" class="avatar-sm">` 
                                    : `<div class="avatar-sm bg-secondary/20 flex items-center justify-center"><i class="fa fa-user text-xs text-secondary"></i></div>`
                                }
                                <div>
                                    <p class="text-sm font-medium">${place.ownerName || 'مستخدم'}</p>
                                    <p class="text-xs text-slate-500">أضاف هذا المكان</p>
                                </div>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = 'place-detail.html?id=' + encodeURIComponent(place.id);
                    });
                    placesContainer.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
