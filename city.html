<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدينة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .place-card { transition: all 0.2s ease; border-radius: 20px; min-height: 160px; }
        .place-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .star-rating .fa-star { color: #d1d5db; }
        .star-rating .fa-star.filled { color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- الهيدر -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="home.html" class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
                <i class="fa fa-arrow-right"></i>
            </a>
            <h1 id="cityTitle" class="text-lg font-bold">اسم المدينة</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <!-- شريط البحث داخل المدينة -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" id="searchPlaces" placeholder="ابحث عن مكان..." 
                    class="w-full p-3 pl-10 border rounded-xl shadow-sm focus:ring-2 focus:ring-primary/20 outline-none">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>
        </div>

        <!-- تصنيفات -->
        <div class="mb-6 flex flex-wrap gap-2">
            <button class="filter-btn active bg-primary text-white px-3 py-1.5 rounded-full text-sm" data-filter="all">الكل</button>
            <button class="filter-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full text-sm hover:bg-gray-200" data-filter="مطعم">مطاعم</button>
            <button class="filter-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full text-sm hover:bg-gray-200" data-filter="كوفي">مقاهي</button>
            <button class="filter-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full text-sm hover:bg-gray-200" data-filter="منتزه">منتزهات</button>
            <button class="filter-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full text-sm hover:bg-gray-200" data-filter="محل">محلات</button>
        </div>

        <!-- قائمة الأماكن -->
        <section>
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa fa-map-marker text-primary"></i> الأماكن
            </h2>
            <div id="placesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-10 text-gray-500">
                    <i class="fa fa-spinner fa-spin text-2xl text-primary"></i>
                    <p class="mt-2">جاري التحميل...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- زر إضافة مكان عائم -->
    <a href="add-place.html" class="fixed bottom-6 left-6 w-14 h-14 bg-accent hover:bg-amber-500 text-white rounded-full shadow-lg flex items-center justify-center text-xl z-40">
        <i class="fa fa-plus"></i>
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // استلام معرف المدينة من الرابط
        const params = new URLSearchParams(window.location.search);
        const cityId = params.get('id');
        let currentFilter = 'all';
        let allPlaces = [];

        if (!cityId) {
            document.getElementById('cityTitle').textContent = 'مدينة غير معروفة';
            document.getElementById('placesContainer').innerHTML = `
                <div class="col-span-full text-center py-10">
                    <i class="fa fa-exclamation-circle text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500">لم يتم تحديد المدينة</p>
                    <a href="home.html" class="mt-3 inline-block px-4 py-2 bg-primary text-white rounded-lg">العودة للرئيسية</a>
                </div>
            `;
        } else {
            loadCityData();
            loadPlaces();
        }

        // تحميل اسم المدينة
        async function loadCityData() {
            try {
                const citySnap = await getDocs(doc(db, 'cities', cityId));
                if (citySnap.exists()) {
                    document.getElementById('cityTitle').textContent = citySnap.data().name || 'مدينة';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('cityTitle').textContent = 'مدينة';
            }
        }

        // تحميل الأماكن التابعة لهذه المدينة
        async function loadPlaces() {
            try {
                const q = query(collection(db, 'places'), where('cityId', '==', cityId));
                const snap = await getDocs(q);
                allPlaces = [];
                
                if (snap.empty) {
                    document.getElementById('placesContainer').innerHTML = `
                        <div class="col-span-full text-center py-10">
                            <i class="fa fa-map-marker text-4xl text-gray-300 mb-3"></i>
                            <p class="text-gray-500">لا توجد أماكن مضافة في هذه المدينة حتى الآن</p>
                            <p class="text-sm text-gray-400 mt-1">كن أول من يضيف مكاناً! 👇</p>
                            <a href="add-place.html" class="mt-3 inline-block px-4 py-2 bg-primary text-white rounded-lg">إضافة أول مكان</a>
                        </div>
                    `;
                    return;
                }

                allPlaces = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderPlaces(allPlaces);
            } catch (err) {
                console.error(err);
                document.getElementById('placesContainer').innerHTML = `
                    <div class="col-span-full text-center py-10 text-red-500">
                        <i class="fa fa-exclamation-triangle text-2xl"></i>
                        <p class="mt-2">تعذر تحميل الأماكن</p>
                        <button onclick="loadPlaces()" class="mt-3 px-4 py-2 bg-primary text-white rounded-lg text-sm">إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        // عرض الأماكن
        function renderPlaces(places) {
            const container = document.getElementById('placesContainer');
            container.innerHTML = '';

            if (places.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500"><p>لا توجد أماكن تطابق البحث</p></div>`;
                return;
            }

            places.forEach(place => {
                const rating = Math.round(place.rating || 0);
                const stars = Array(5).fill(0).map((_, i) => 
                    `<i class="fa fa-star ${i < rating ? 'filled' : ''}"></i>`
                ).join('');

                const priceText = place.price ? `<p class="text-sm text-amber-600 font-medium mt-1">💰 ${place.price}</p>` : '';
                const phoneHtml = place.phone ? 
                    `<a href="tel:${place.phone}" class="inline-flex items-center gap-1 text-sm text-primary hover:underline mt-1"><i class="fa fa-phone"></i> اتصال</a>` : '';
                const mapHtml = place.mapUrl ? 
                    `<a href="${place.mapUrl}" target="_blank" class="inline-flex items-center gap-1 text-sm text-blue-600 hover:underline mt-1 ml-2"><i class="fa fa-map-marker"></i> الموقع</a>` : '';

                container.innerHTML += `
                    <div class="place-card bg-white shadow-sm p-5 border border-gray-100" data-category="${place.category || 'أخرى'}">
                        <div class="flex flex-col justify-between h-full">
                            <div>
                                <h3 class="font-bold text-gray-800 text-lg">${place.name || 'مكان بدون اسم'}</h3>
                                <p class="text-sm text-gray-500 mt-1">${place.category || 'أخرى'}</p>
                                <div class="star-rating mt-2">${stars}</div>
                                ${priceText}
                                <p class="text-sm text-gray-600 mt-2 line-clamp2">${
                                    (place.description || '').substring(0, 60)
                                }${(place.description || '').length > 60 ? '...' : ''}</p>
                            </div>
                            <div class="mt-3">
                                ${phoneHtml} ${mapHtml}
            <button onclick="window.location.href='place-detail.html?id=${place.id}'" 
                class="ml-2 text-sm text-primary hover:underline">
                عرض التفاصيل <i class="fa fa-arrow-left text-xs"></i>
            </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // تصفية حسب التصنيف
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                   b.classList.remove('bg-primary', 'text-white', 'active');
                    b.classList.add('bg-gray-100', 'text-gray-700');
                });
                btn.classList.remove('bg-gray-100', 'text-gray-700');
                btn.classList.add('bg-primary', 'text-white', 'active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // البحث
        document.getElementById('searchPlaces').addEventListener('input', applyFilters);

        function applyFilters() {
            const searchTerm = document.getElementById('searchPlaces').value.toLowerCase().trim();
            let filtered = allPlaces;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => (p.category || 'أخرى') === currentFilter);
            }

            if (searchTerm) {
                filtered = filtered.filter(p => 
                    (p.name || '').toLowerCase().includes(searchTerm) ||
                    (p.description || '').toLowerCase().includes(searchTerm)
                );
            }

            renderPlaces(filtered);
        }
    </script>
</body>
</html>
