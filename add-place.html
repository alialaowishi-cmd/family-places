<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                    },
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        .star-input .fa-star { cursor: pointer; font-size: 24px; color: #d1d5db; transition: color 0.2s; }
        .star-input .fa-star:hover, .star-input .fa-star.hover, .star-input .fa-star.selected { color: #f59e0b; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <!-- الهيدر -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
                <i class="fa fa-arrow-right"></i>
            </button>
            <h1 class="text-lg font-bold">إضافة مكان جديد</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <form id="placeForm" class="space-y-5">
            <!-- المدينة -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">اسم المدينة *</label>
                <select id="placeCity" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none">
                    <option value="">-- اختر المدينة --</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">أو اكتب اسم مدينة جديدة أدناه</p>
                <input type="text" id="newCityName" class="w-full p-3 border rounded-lg mt-2 focus:ring-2 focus:ring-primary/20 outline-none" placeholder="اكتب اسم مدينة جديدة">
            </div>

            <!-- اسم المكان -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">اسم المكان *</label>
                <input type="text" id="placeName" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none" placeholder="أدخل اسم المكان" required>
            </div>

            <!-- التصنيف -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">التصنيف</label>
                <select id="placeCategory" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none">
                    <option value="مطعم">مطعم</option>
                    <option value="كوفي">كوفي</option>
                    <option value="منتزه">منتزه</option>
                    <option value="محل">محل</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>

            <!-- الوصف -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">وصف المكان</label>
                <textarea id="placeDescription" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none" rows="3" placeholder="أدخل وصفاً للمكان..."></textarea>
            </div>

            <!-- رقم الجوال -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رقم الجوال</label>
                <input type="tel" id="placePhone" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none" placeholder="05xxxxxxxx">
            </div>

            <!-- السعر -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">السعر التقريبي</label>
                <input type="text" id="placePrice" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none" placeholder="مثال: 50 - 100 ريال">
            </div>

            <!-- رابط الموقع -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رابط الموقع في جوجل ماب</label>
                <input type="url" id="placeMap" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary/20 outline-none" placeholder="https://goo.gl/maps/...">
            </div>

            <!-- التقييم بالنجوم -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">التقييم</label>
                <div class="star-input flex gap-1" id="starRating">
                    <i class="fa fa-star" data-value="1"></i>
                    <i class="fa fa-star" data-value="2"></i>
                    <i class="fa fa-star" data-value="3"></i>
                    <i class="fa fa-star" data-value="4"></i>
                    <i class="fa fa-star" data-value="5"></i>
                </div>
                <input type="hidden" id="placeRating" value="0">
            </div>

            <!-- زر الحفظ -->
            <button type="submit" class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-xl font-medium flex items-center justify-center gap-2 mt-6">
                <i class="fa fa-save"></i> حفظ ونشر المكان
            </button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التحقق من تسجيل الدخول
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const userPhone = localStorage.getItem('userPhone') || '';
        const userName = localStorage.getItem('userName') || '';

        if (!isLoggedIn) {
            alert('يرجى تسجيل الدخول أولاً');
            window.location.href = 'login.html';
        }

        // تحميل قائمة المدن
        const citySelect = document.getElementById('placeCity');
        async function loadCities() {
            try {
                const snap = await getDocs(collection(db, 'cities'));
                snap.forEach(doc => {
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = doc.data().name;
                    citySelect.appendChild(option);
                });
            } catch (e) {
                console.error(e);
            }
        }
        loadCities();

        // نظام النجوم
        const stars = document.querySelectorAll('#starRating i');
        let selectedRating = 0;

        stars.forEach(star => {
            star.addEventListener('mouseover', () => {
                const value = parseInt(star.dataset.value);
                stars.forEach(s => {
                    s.classList.toggle('hover', parseInt(s.dataset.value) <= value);
                });
            });
            star.addEventListener('mouseout', () => {
                stars.forEach(s => s.classList.remove('hover'));
            });
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.value);
                document.getElementById('placeRating').value = selectedRating;
                stars.forEach(s => {
                    const val = parseInt(s.dataset.value);
                    s.classList.toggle('selected', val <= selectedRating);
                });
            });
        });

        // حفظ البيانات
        document.getElementById('placeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('placeName').value.trim();
            const category = document.getElementById('placeCategory').value;
            const description = document.getElementById('placeDescription').value.trim();
            const phone = document.getElementById('placePhone').value.trim();
            const price = document.getElementById('placePrice').value.trim();
            const mapUrl = document.getElementById('placeMap').value.trim();
            const rating = parseInt(document.getElementById('placeRating').value) || 0;
            const selectedCityId = document.getElementById('placeCity').value;
            const newCityName = document.getElementById('newCityName').value.trim();

            if (!name) {
                alert('يرجى إدخال اسم المكان');
                return;
            }

            try {
                let cityId = selectedCityId;

                // إضافة مدينة جديدة إذا تم كتابتها
                if (newCityName) {
                    const cityRef = await addDoc(collection(db, 'cities'), {
                        name: newCityName,
                        createdAt: new Date()
                    });
                    cityId = cityRef.id;
                }

                if (!cityId) {
                    alert('يرجى اختيار مدينة أو كتابة اسم مدينة جديدة');
                    return;
                }

                // حفظ المكان
                await addDoc(collection(db, 'places'), {
                    name,
                    category,
                    description,
                    phone,
                    price,
                    mapUrl,
                    rating,
                    cityId,
                    createdBy: userName || userPhone,
                    createdAt: new Date()
                });

                alert('✅ تم إضافة المكان بنجاح!');
                window.location.href = 'home.html';
            } catch (err) {
                console.error(err);
                alert('❌ حدث خطأ أثناء الحفظ: ' + err.message);
            }
        });
    </script>
</body>
</html>
