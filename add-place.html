<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد - كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { padding-top: 70px; background-color: #fafafa; }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15); }
        .star-rating i { cursor: pointer; font-size: 1.4rem; transition: color 0.2s; }
        .star-active { color: #f59e0b; }
        .star-inactive { color: #d1d5db; }
        .image-preview { max-height: 150px; object-fit: cover; border-radius: 8px; }
        .upload-box { border: 2px dashed #d1d5db; transition: all 0.3s ease; }
        .upload-box:hover { border-color: #16a34a; background-color: #f0fdf4; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg fixed top-0 left-0 right-0 z-40">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <button id="backBtn" class="bg-white/20 hover:bg-white/30 p-2 rounded-xl transition">
                    <i class="fa fa-arrow-right"></i>
                </button>
                <h1 class="text-lg font-bold">إضافة مكان جديد</h1>
                <div class="w-8"></div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-lg">
        <form id="placeForm" class="bg-white rounded-2xl shadow-sm p-6 space-y-5">
            
            <!-- اسم المكان -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-map-marker ml-1 text-primary"></i> اسم المكان *
                </label>
                <input type="text" id="placeName" required
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition"
                    placeholder="مثال: منتزه الهدا">
            </div>

            <!-- المدينة: اختيار من القائمة أو إضافة جديدة -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-building-o ml-1 text-primary"></i> المدينة *
                </label>
                <select id="citySelect" required
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition mb-2">
                    <option value="">اختر المدينة...</option>
                    <option value="__new__">➕ إضافة مدينة جديدة</option>
                </select>
                <input type="text" id="newCityInput" 
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition hidden"
                    placeholder="أدخل اسم المدينة الجديدة">
            </div>

            <!-- التصنيف -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-tag ml-1 text-primary"></i> التصنيف
                </label>
                <select id="placeCategory"
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition">
                    <option value="">اختر التصنيف...</option>
                    <option value="مطاعم">مطاعم</option>
                    <option value="مقاهي">مقاهي</option>
                    <option value="حدائق">حدائق ومنتزهات</option>
                    <option value="مراكز ترفيه">مراكز ترفيه</option>
                    <option value="معالم سياحية">معالم سياحية</option>
                    <option value="محلات">محلات</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>

            <!-- رقم الجوال -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-phone ml-1 text-primary"></i> رقم الجوال
                </label>
                <input type="tel" id="placePhone" dir="ltr"
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition"
                    placeholder="05XXXXXXXXX">
            </div>

            <!-- رابط الموقع (قوقل ماب) -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-map ml-1 text-primary"></i> رابط الموقع من قوقل ماب
                </label>
                <input type="url" id="placeLocation"
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition text-sm"
                    placeholder="https://www.google.com/maps/...">
            </div>

            <!-- السعر - يدوي -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-tags ml-1 text-primary"></i> السعر
                </label>
                <input type="text" id="placePrice"
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition"
                    placeholder="مثال: متوسط - 50 ريال، أو مجاني">
            </div>

            <!-- رفع الصور -->
            <div class="border-t pt-4">
                <label class="block text-gray-700 text-sm font-medium mb-3">
                    <i class="fa fa-camera ml-1 text-primary"></i> صور المكان
                </label>
                <div class="upload-box rounded-xl p-4 text-center cursor-pointer mb-3" id="uploadTrigger">
                    <input type="file" id="imageUpload" accept="image/*" multiple class="hidden">
                    <i class="fa fa-cloud-upload text-3xl text-primary mb-2"></i>
                    <p class="text-sm text-gray-600">اضغط لاختيار الصور أو اسحبها هنا</p>
                    <p class="text-xs text-gray-400 mt-1">يمكنك اختيار أكثر من صورة</p>
                </div>
                <div class="bg-blue-50 rounded-xl p-3 mb-3 border border-blue-100">
                    <p class="text-sm text-blue-700 mb-2 font-medium">
                    <i class="fa fa-info-circle ml-1"></i> واجهة رفع خارجية سهلة:
                    </p>
                    <a href="https://imgur.com" target="_blank" 
                    class="inline-flex items-center gap-1.5 bg-blue-600 text-white text-sm px-3 py-1.5 rounded-lg hover:bg-blue-700 transition">
                        <i class="fa fa-external-link"></i> فتح موقع رفع الصور مجاناً
                    </a>
                    <p class="text-xs text-blue-600 mt-2">✅ رفع → نسخ رابط الصورة → لصقه في المربع أدناه</p>
                </div>
                <div class="mb-3">
                    <label class="block text-gray-600 text-xs font-medium mb-1.5">أو الصق رابط الصورة مباشرة:</label>
                    <input type="url" id="imageUrlInput"
                        class="w-full p-2.5 border border-gray-200 rounded-lg text-sm input-focus outline-none"
                        placeholder="https://i.imgur.com/xxxxxx.jpg">
                    <button type="button" id="addUrlImage"
                        class="mt-2 text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg transition">
                        <i class="fa fa-plus ml-1"></i> إضافة الرابط
                    </button>
                </div>
                <div id="imagePreviewContainer" class="grid grid-cols-3 gap-2 mt-3"></div>
                <p id="noImagesNote" class="text-xs text-gray-400 mt-2">لم يتم اختيار أي صور بعد</p>
            </div>

            <!-- التقييم بالنجوم -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-star ml-1 text-accent"></i> التقييم
                </label>
                <div class="star-rating flex gap-1" id="starRating">
                    <i class="fa fa-star star-inactive" data-rating="1"></i>
                    <i class="fa fa-star star-inactive" data-rating="2"></i>
                    <i class="fa fa-star star-inactive" data-rating="3"></i>
                    <i class="fa fa-star star-inactive" data-rating="4"></i>
                    <i class="fa fa-star star-inactive" data-rating="5"></i>
                </div>
                <p class="text-xs text-gray-400 mt-1">اختر من 1 إلى 5 نجوم</p>
            </div>

            <!-- الوصف والملاحظات -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-2">
                    <i class="fa fa-file-text-o ml-1 text-primary"></i> وصف المكان والملاحظات
                </label>
                <textarea id="placeDescription" rows="4"
                    class="w-full p-3 border border-gray-200 rounded-xl input-focus outline-none transition resize-none"
                    placeholder="اكتب وصفاً للمكان، الخدمات، أوقات العمل..."></textarea>
            </div>

            <hr class="my-4">

            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-primary to-secondary text-white py-3.5 rounded-xl font-semibold hover:opacity-95 transition-all text-lg shadow-lg shadow-green-100">
                <i class="fa fa-save ml-2"></i> حفظ ونشر المكان
            </button>

            <div id="formMessage" class="mt-4 text-sm text-center hidden p-3 rounded-lg"></div>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedRating = 0;
        let imageUrls = [];
        let allCities = [];

        const citySelect = document.getElementById('citySelect');
        const newCityInput = document.getElementById('newCityInput');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'home.html';
                return;
            }
            currentUser = user;
            loadCities();
        });

        // تحميل المدن في القائمة
        async function loadCities() {
            try {
                const snap = await getDocs(collection(db, 'cities'));
                allCities = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                allCities.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
                
                citySelect.innerHTML = '<option value="">اختر المدينة...</option><option value="__new__">➕ إضافة مدينة جديدة</option>';
                allCities.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.name;
                    option.textContent = c.name;
                    citySelect.appendChild(option);
                });
            } catch (err) {
                console.error('خطأ في تحميل المدن:', err);
            }
        }

        // إظهار حقل إضافة مدينة جديدة
        citySelect.addEventListener('change', () => {
            if (citySelect.value === '__new__') {
                newCityInput.classList.remove('hidden');
                newCityInput.focus();
            } else {
                newCityInput.classList.add('hidden');
            }
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'home.html';
        });

        // التقييم بالنجوم
        const stars = document.querySelectorAll('#starRating i');
        stars.forEach(star => {
            star.addEventListener('mouseover', () => {
                highlightStars(parseInt(star.dataset.rating));
            });
            star.addEventListener('mouseout', () => {
                highlightStars(selectedRating);
            });
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.rating);
                highlightStars(selectedRating);
            });
        });

        function highlightStars(count) {
            stars.forEach(star => {
                const r = parseInt(star.dataset.rating);
                star.classList.toggle('star-active', r <= count);
                star.classList.toggle('star-inactive', r > count);
            });
        }

        // رفع الصور
        const uploadTrigger = document.getElementById('uploadTrigger');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const noImagesNote = document.getElementById('noImagesNote');
        const imageUrlInput = document.getElementById('imageUrlInput');
        const addUrlImage = document.getElementById('addUrlImage');

        uploadTrigger.addEventListener('click', () => imageUpload.click());
        imageUpload.addEventListener('change', (e) => processFiles(Array.from(e.target.files)));
        
        uploadTrigger.addEventListener('dragover', e => { e.preventDefault(); uploadTrigger.classList.add('border-primary', 'bg-green-50'); });
        uploadTrigger.addEventListener('dragleave', () => uploadTrigger.classList.remove('border-primary', 'bg-green-50'));
        uploadTrigger.addEventListener('drop', e => {
            e.preventDefault();
            uploadTrigger.classList.remove('border-primary', 'bg-green-50');
            processFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
        });

        function processFiles(files) {
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imageUrls.push(e.target.result);
                    addImagePreview(e.target.result, imageUrls.length - 1);
                    updateImagesNote();
                };
                reader.readAsDataURL(file);
            });
        }

        addUrlImage.addEventListener('click', () => {
            const url = imageUrlInput.value.trim();
            if (!url) return;
            const img = new Image();
            img.onload = () => {
                imageUrls.push(url);
                addImagePreview(url, imageUrls.length - 1);
                imageUrlInput.value = '';
                updateImagesNote();
            };
            img.onerror = () => alert('❌ الرابط غير صالح');
            img.src = url;
        });

        function addImagePreview(src, index) {
            const div = document.createElement('div');
            div.className = 'relative group';
            div.innerHTML = `
                <img src="${src}" class="image-preview w-full h-24 object-cover" alt="صورة">
                <button type="button" data-index="${index}" 
                    class="absolute top-1 left-1 bg-black/60 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition remove-img">
                    <i class="fa fa-times"></i>
                </button>
            `;
            imagePreviewContainer.appendChild(div);
            div.querySelector('.remove-img').addEventListener('click', () => {
                imageUrls.splice(parseInt(div.querySelector('.remove-img').dataset.index), 1);
                div.remove();
                document.querySelectorAll('.remove-img').forEach((btn, i) => btn.dataset.index = i);
                updateImagesNote();
            });
        }

        function updateImagesNote() {
            noImagesNote.style.display = imageUrls.length === 0 ? 'block' : 'none';
        }

        // حفظ النموذج
        const placeForm = document.getElementById('placeForm');
        const formMessage = document.getElementById('formMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showFormMessage(text, isSuccess) {
            formMessage.textContent = text;
            formMessage.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            formMessage.classList.add(isSuccess ? 'bg-green-50' : 'bg-red-50', isSuccess ? 'text-green-600' : 'text-red-600');
            formMessage.classList.remove('hidden');
            setTimeout(() => formMessage.classList.add('hidden'), 5000);
        }

        placeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let cityName = citySelect.value;
            const newCityName = newCityInput.value.trim();

            if (cityName === '__new__') {
                if (!newCityName) {
                    showFormMessage('❌ أدخل اسم المدينة الجديدة', false);
                    return;
                }
                // تحقق من عدم تكرار المدينة
                const exists = allCities.some(c => c.name.trim().toLowerCase() === newCityName.toLowerCase());
                if (exists) {
                    showFormMessage('⚠️ المدينة موجودة بالفعل، اخترها من القائمة', false);
                    return;
                }
                // إضافة المدينة الجديدة
                await addDoc(collection(db, 'cities'), {
                    name: newCityName,
                    sortOrder: allCities.length,
                    addedBy: currentUser.uid,
                    createdAt: new Date()
                });
                cityName = newCityName;
            }

            const name = document.getElementById('placeName').value.trim();
            const category = document.getElementById('placeCategory').value;
            const phone = document.getElementById('placePhone').value.trim();
            const location = document.getElementById('placeLocation').value.trim();
            const price = document.getElementById('placePrice').value.trim();
            const description = document.getElementById('placeDescription').value.trim();

            if (!name || !cityName || cityName === '__new__' || cityName === '') {
                showFormMessage('❌ يرجى تحديد المدينة واسم المكان', false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin ml-2"></i> جاري الحفظ...';

            try {
                await addDoc(collection(db, 'places'), {
                    name,
                    city: cityName,
                    category: category || 'غير مصنف',
                    phone,
                    location,
                    price,
                    description,
                    images: imageUrls,
                    rating: selectedRating,
                    averageRating: selectedRating,
                    totalReviews: selectedRating > 0 ? 1 : 0,
                    createdBy: currentUser.uid,
                    userEmail: currentUser.email,
                    createdAt: serverTimestamp()
                });

                showFormMessage('✅ تم حفظ المكان بنجاح!', true);
                placeForm.reset();
                imageUrls = [];
                selectedRating = 0;
                highlightStars(0);
                imagePreviewContainer.innerHTML = '';
                updateImagesNote();
                newCityInput.classList.add('hidden');
                setTimeout(() => window.location.href = 'home.html', 1500);
            } catch (err) {
                console.error(err);
                showFormMessage('❌ حدث خطأ، تحقق من اتصالك', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa fa-save ml-2"></i> حفظ ونشر المكان';
            }
        });
    </script>
</body>
</html>
