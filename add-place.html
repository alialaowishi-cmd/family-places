<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#34C759', secondary: '#007AFF', accent: '#FF9500', dark: '#1C1C1E' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #E8F5E9 0%, #F0F9FF 50%, #FEF3C7 100%); min-height: 100vh; padding-bottom: 40px; }
        .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8); }
        .input-glass { background: rgba(118,118,128,0.12); border: none; }
        .input-glass:focus { background: rgba(118,118,128,0.18); outline: none; }
        .star-input .fa-star { cursor: pointer; font-size: 28px; color: #D1D5DB; transition: color 0.15s ease; }
        .star-input .fa-star.selected { color: #FFCC00; }
        .btn-primary { background: linear-gradient(135deg, #34C759 0%, #30B350 100%); transition: all 0.2s ease; }
        .btn-primary:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <header class="glass sticky top-0 z-40 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="w-10 h-10 rounded-full glass flex items-center justify-center">
                <i class="fa fa-arrow-right text-secondary"></i>
            </button>
            <h1 class="text-lg font-bold text-dark">إضافة مكان جديد</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <form id="placeForm" class="space-y-5 glass rounded-3xl p-6 shadow-sm">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">اسم المدينة *</label>
                <input type="text" id="placeCity" class="w-full p-3.5 rounded-xl input-glass" placeholder="اكتب اسم المدينة" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">اسم المكان *</label>
                <input type="text" id="placeName" class="w-full p-3.5 rounded-xl input-glass" placeholder="أدخل اسم المكان" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">التصنيف</label>
                <select id="placeCategory" class="w-full p-3.5 rounded-xl input-glass">
                    <option value="مطعم">مطعم</option>
                    <option value="كوفي">كوفي</option>
                    <option value="منتزه">منتزه</option>
                    <option value="محل">محل</option>
                    <option value="أخرى" selected>أخرى</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">وصف المكان</label>
                <textarea id="placeDescription" class="w-full p-3.5 rounded-xl input-glass" rows="3" placeholder="أدخل وصفاً للمكان..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">رقم الجوال</label>
                <input type="tel" id="placePhone" class="w-full p-3.5 rounded-xl input-glass" placeholder="05xxxxxxxx">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">السعر التقريبي</label>
                <input type="text" id="placePrice" class="w-full p-3.5 rounded-xl input-glass" placeholder="مثال: 50 ريال">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">رابط الموقع في جوجل ماب</label>
                <input type="url" id="placeMap" class="w-full p-3.5 rounded-xl input-glass" placeholder="https://goo.gl/maps/...">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">التقييم</label>
                <div class="star-input flex gap-1" id="starRating">
                    <i class="fa fa-star" data-value="1"></i>
                    <i class="fa fa-star" data-value="2"></i>
                    <i class="fa fa-star" data-value="3"></i>
                    <i class="fa fa-star" data-value="4"></i>
                    <i class="fa fa-star" data-value="5"></i>
                </div>
                <input type="hidden" id="placeRating" value="0">
            </div>
            <button type="submit" class="w-full btn-primary text-white py-3.5 rounded-xl font-medium mt-4">
                <i class="fa fa-save ml-2"></i> حفظ ونشر المكان
            </button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // نظام التقييم بالنجوم
        const stars = document.querySelectorAll('#starRating .fa-star');
        let currentRating = 0;
        stars.forEach(star => {
            star.addEventListener('click', () => {
                currentRating = parseInt(star.dataset.value);
                document.getElementById('placeRating').value = currentRating;
                stars.forEach((s, i) => {
                    s.classList.toggle('selected', i < currentRating);
                });
            });
            star.addEventListener('mouseover', () => {
                const val = parseInt(star.dataset.value);
                stars.forEach((s, i) => {
                    s.style.color = i < val ? '#FFCC00' : '#D1D5DB';
                });
            });
        });
        document.getElementById('starRating').addEventListener('mouseleave', () => {
            stars.forEach((s, i) => {
                s.style.color = i < currentRating ? '#FFCC00' : '#D1D5DB';
            });
        });

        // حفظ المكان
        document.getElementById('placeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('placeName').value.trim();
            const city = document.getElementById('placeCity').value.trim();
            if (!name || !city) { alert('❌ الرجاء إدخال اسم المدينة واسم المكان'); return; }

            const placeData = {
                name: name,
                city: city,
                category: document.getElementById('placeCategory').value,
                description: document.getElementById('placeDescription').value.trim(),
                phone: document.getElementById('placePhone').value.trim(),
                price: document.getElementById('placePrice').value.trim(),
                mapUrl: document.getElementById('placeMap').value.trim(),
                rating: parseInt(document.getElementById('placeRating').value) || 0,
                createdAt: new Date(),
                createdBy: localStorage.getItem('userName') || 'مستخدم مجهول'
            };

            try {
                console.log('جاري الحفظ...', placeData);
                await addDoc(collection(db, 'places'), placeData);
                alert('✅ تم حفظ المكان بنجاح!');
                window.location.href = 'home.html';
            } catch (err) {
                console.error('خطأ في الحفظ:', err);
                alert(`❌ حدث خطأ: ${err.message}\n\nتأكد من تحديث Firebase Rules أولاً!`);
            }
        });
    </script>
</body>
</html>
