<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1E40AF', secondary: '#3B82F6', dark: '#0F172A' }, fontFamily: { sans: ['Tajawal', 'sans-serif'] } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { background: #0F172A; font-family: 'Tajawal', sans-serif; min-height: 100vh; padding-bottom: 85px; }
        .btn-primary { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); }
        .input-field { background: #1E293B; border: 1px solid #334155; }
        .input-field:focus { border-color: #3B82F6; outline: none; }
        .star { cursor: pointer; color: #475569; }
        .star.active { color: #FBBF24; }
        button { cursor: pointer; font-family: inherit; }
    </style>
    <script type="module">
        import { getCities, addCity, addPlace, uploadImage } from './db.js';
        import { getCurrentUser, requireAuth } from './auth.js';

        const currentUser = requireAuth();
        if (!currentUser) throw new Error('يجب تسجيل الدخول');

        let selectedRating = 0;
        let uploadedImageUrls = [];
        let allCities = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCities();
            
            const params = new URLSearchParams(window.location.search);
            const preCity = params.get('city');
            if (preCity) document.getElementById('citySelect').value = preCity;

            document.querySelectorAll('.star').forEach(star => {
                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.dataset.value);
                    updateStars();
                });
            });

            document.getElementById('add-place-form').addEventListener('submit', handleSubmit);
            document.getElementById('imageUpload').addEventListener('change', handleImageUpload);
            document.getElementById('backBtn').onclick = () => history.back();
            document.getElementById('cancelBtn').onclick = () => history.back();
        });

        async function loadCities() {
            allCities = await getCities();
            const select = document.getElementById('citySelect');
            select.innerHTML = '<option value="">-- اختر المدينة --</option>';
            allCities.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                select.appendChild(opt);
            });
        }

        function updateStars() {
            document.querySelectorAll('.star').forEach((s, i) => {
                s.classList.toggle('active', i < selectedRating);
            });
        }

        async function handleImageUpload(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const path = `places/${Date.now()}_${file.name}`;
                const url = await uploadImage(file, path);
                uploadedImageUrls.push(url);
                const preview = document.getElementById('imagePreview');
                preview.innerHTML += `<img src="${url}" class="w-20 h-20 object-cover rounded-lg">`;
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('placeName').value.trim();
            let city = document.getElementById('citySelect').value.trim();
            const newCity = document.getElementById('newCityInput').value.trim();
            const category = document.getElementById('placeCategory').value;
            const phone = document.getElementById('placePhone').value.trim();
            const mapUrl = document.getElementById('placeMapUrl').value.trim();
            const price = document.getElementById('placePrice').value.trim();
            const notes = document.getElementById('placeNotes').value.trim();

            if (!name) return alert('أدخل اسم المكان');
            if (!city && !newCity) return alert('اختر المدينة أو اكتب جديدة');

            if (newCity) {
                city = newCity;
                const exists = allCities.some(c => c.name === city);
                if (!exists) await addCity(city, currentUser.uid, currentUser.name);
            }

            const placeData = {
                name, city, category, phone, mapUrl, price, notes,
                rating: selectedRating,
                images: uploadedImageUrls,
                ownerId: currentUser.uid,
                ownerName: currentUser.name || 'مستخدم',
                ownerPhone: currentUser.phone,
                ownerAvatar: localStorage.getItem('userAvatar_' + (currentUser.uid || currentUser.phone)) || ''
            };

            document.getElementById('saveText').classList.add('hidden');
            document.getElementById('loadingIcon').classList.remove('hidden');

            await addPlace(placeData);
            
            alert('✅ تم حفظ المكان بنجاح!');
            window.location.href = 'city.html?name=' + encodeURIComponent(city);
        }
    </script>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 p-2"><i class="fa fa-arrow-right fa-lg"></i></button>
            <h1 class="text-lg font-bold">إضافة مكان جديد</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="px-4 py-6">
        <form id="add-place-form" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">اسم المكان *</label>
                <input type="text" id="placeName" class="w-full px-4 py-3 rounded-lg input-field text-white" required>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">المدينة *</label>
                <div class="flex gap-2">
                    <select id="citySelect" class="flex-1 px-4 py-3 rounded-lg input-field text-white">
                        <option value="">-- اختر المدينة --</option>
                    </select>
                    <button type="button" onclick="document.getElementById('newCityInput').classList.toggle('hidden')" class="px-4 py-3 bg-secondary/20 text-secondary rounded-lg">
                        <i class="fa fa-plus"></i>
                    </button>
                </div>
                <input type="text" id="newCityInput" class="w-full px-4 py-3 rounded-lg input-field text-white mt-2 hidden" placeholder="أو اكتب مدينة جديدة">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">التصنيف</label>
                <select id="placeCategory" class="w-full px-4 py-3 rounded-lg input-field text-white">
                    <option value="مطعم">مطعم</option>
                    <option value="كوفي">كوفي</option>
                    <option value="منتزه">منتزه</option>
                    <option value="محل">محل</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">رقم الجوال</label>
                <input type="tel" id="placePhone" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="05XXXXXXXX">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">رابط قوقل ماب</label>
                <input type="url" id="placeMapUrl" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="https://goo.gl/maps/...">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">السعر</label>
                <input type="text" id="placePrice" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="متوسط">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">التقييم</label>
                <div id="starRating" class="flex gap-1">
                    <span class="star text-2xl" data-value="1">★</span>
                    <span class="star text-2xl" data-value="2">★</span>
                    <span class="star text-2xl" data-value="3">★</span>
                    <span class="star text-2xl" data-value="4">★</span>
                    <span class="star text-2xl" data-value="5">★</span>
                </div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">الصور</label>
                <input type="file" id="imageUpload" accept="image/*" multiple class="w-full text-sm">
                <div id="imagePreview" class="flex flex-wrap gap-2 mt-2"></div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">ملاحظات</label>
                <textarea id="placeNotes" rows="3" class="w-full px-4 py-3 rounded-lg input-field text-white"></textarea>
            </div>
            <div class="flex gap-3 pt-4">
                <button type="button" id="cancelBtn" class="flex-1 py-3 rounded-lg bg-slate-700">إلغاء</button>
                <button type="submit" class="flex-1 btn-primary py-3 rounded-lg font-medium">
                    <span id="saveText">حفظ المكان</span>
                    <i id="loadingIcon" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </div>
        </form>
    </main>
</body>
</html>
