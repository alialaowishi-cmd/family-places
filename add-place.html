<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#22C55E' } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #F0FDF4 0%, #EFF6FF 100%); min-height: 100vh; padding-bottom: 40px; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
        .star { font-size: 28px; cursor: pointer; color: #D1D5DB; transition: color 0.15s; }
        .star.active { color: #FACC15; }
        .img-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px dashed #ccc; }
    </style>
</head>
<body>
    <header class="glass sticky top-0 z-30 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="location.href='home.html'" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center border-0">
                <i class="fa fa-arrow-right"></i>
            </button>
            <h1 class="text-lg font-bold">إضافة مكان جديد</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-5">
        <form id="placeForm" class="glass rounded-2xl p-5 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2">المدينة *</label>
                <select id="placeCity" class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none">
                    <option value="">-- اختر المدينة أدناه أو اكتب مدينة جديدة --</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">أو اكتب مدينة جديدة</p>
                <input type="text" id="newCity" placeholder="اسم مدينة جديدة" 
                    class="w-full p-3 rounded-xl bg-gray-50/50 border border-gray-200/70 outline-none mt-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">اسم المكان *</label>
                <input type="text" id="placeName" required
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">التصنيف</label>
                <select id="placeCategory" class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none">
                    <option value="مطعم">مطعم</option>
                    <option value="كوفي">كوفي</option>
                    <option value="منتزه">منتزه</option>
                    <option value="محل">محل</option>
                    <option value="أخرى" selected>أخرى</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">رابط جوجل ماب</label>
                <input type="url" id="placeMap" placeholder="https://goo.gl/maps/..."
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">رقم الجوال</label>
                <input type="tel" id="placePhone" placeholder="05xxxxxxxx"
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">التقييم</label>
                <div id="starBox" class="flex gap-1">
                    <span class="star" data-v="1">★</span>
                    <span class="star" data-v="2">★</span>
                    <span class="star" data-v="3">★</span>
                    <span class="star" data-v="4">★</span>
                    <span class="star" data-v="5">★</span>
                </div>
                <input type="hidden" id="placeRating" value="0">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">السعر التقريبي</label>
                <input type="text" id="placePrice" placeholder="مثال: 50 ريال"
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">ملاحظات</label>
                <textarea id="placeNotes" rows="3" placeholder="أضف ملاحظاتك هنا..."
                    class="w-full p-3.5 rounded-xl bg-gray-50/70 border border-gray-200 outline-none"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">صور للمكان</label>
                <input type="file" id="imgUpload" accept="image/*" multiple class="mb-2">
                <div id="imgPreviewBox" class="flex flex-wrap gap-2"></div>
            </div>
            <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-medium mt-2">
                <i class="fa fa-save ml-2"></i> حفظ المكان
            </button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // نجوم التقييم
        let rating = 0;
        const stars = document.querySelectorAll('.star');
        stars.forEach(s => {
            s.addEventListener('click', () => {
                rating = parseInt(s.dataset.v);
                document.getElementById('placeRating').value = rating;
                stars.forEach((st,i) => st.classList.toggle('active', i < rating));
            });
        });

        // تحميل قائمة المدن
            async function loadCityOptions() {
            const sel = document.getElementById('placeCity');
            try {
                const snap = await getDocs(collection(db, 'cities'));
                snap.forEach(d => {
                    const c = d.data();
                    sel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
                });
            } catch (e) {
                console.log('لا توجد مدن بعد');
            }
        }
        loadCityOptions();

        // رفع الصور
        let uploadedUrls = [];
        document.getElementById('imgUpload').addEventListener('change', async e => {
            const files = Array.from(e.target.files);
            const previewBox = document.getElementById('imgPreviewBox');
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.className = 'img-preview';
                    previewBox.appendChild(img);
                };
                reader.readAsDataURL(file);
                
                // رفع لـ Firebase Storage
                try {
                    const ext = file.name.split('.').pop();
                    const imgRef = ref(storage, `places/${Date.now()}-${Math.random().toString(36).substr(2)}.${ext}`);
                    const snap = await uploadBytes(imgRef, file);
                    const url = await getDownloadURL(snap.ref);
                    uploadedUrls.push(url);
                } catch (err) {
                    console.log('لم يتم رفع الصورة:', err);
                }
            }
        });

        // حفظ
        document.getElementById('placeForm').addEventListener('submit', async e => {
            e.preventDefault();
            const selCity = document.getElementById('placeCity').value;
            const newCity = document.getElementById('newCity').value.trim();
            const finalCity = newCity || selCity;
            const name = document.getElementById('placeName').value.trim();
            if (!finalCity || !name) return alert('أدخل المدينة واسم المكان');

            const userData = JSON.parse(localStorage.getItem('user') || '{}');
            const placeData = {
                city: finalCity,
                name: name,
                category: document.getElementById('placeCategory').value,
                mapUrl: document.getElementById('placeMap').value.trim(),
                phone: document.getElementById('placePhone').value.trim(),
                rating: parseInt(document.getElementById('placeRating').value) || 0,
                price: document.getElementById('placePrice').value.trim(),
                notes: document.getElementById('placeNotes').value.trim(),
                images: uploadedUrls,
                createdAt: new Date(),
                createdBy: userData.name || 'مجهول'
            };

            try {
                // إذا كانت مدينة جديدة أضيفيها
                if (newCity) await addDoc(collection(db, 'cities'), { name: newCity, createdAt: new Date() });
                await addDoc(collection(db, 'places'), placeData);
                alert('✅ تم حفظ المكان بنجاح');
                location.href = 'home.html';
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
            }
        });
    </script>
</body>
</html>
