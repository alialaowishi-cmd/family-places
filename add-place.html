<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد — كشكات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22c55e', secondary: '#15803d' }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-3 py-3 flex items-center">
            <a href="home.html" class="text-white mr-2"><i class="fa fa-arrow-left text-lg"></i></a>
            <h1 class="text-lg font-bold">إضافة مكان جديد</h1>
        </div>
    </header>

    <main class="container mx-auto px-3 py-6 max-w-lg">
        <div class="bg-white rounded-2xl shadow-sm p-5">
            <form id="addPlaceForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">اسم المكان *</label>
                    <input type="text" id="placeName" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">المدينة *</label>
                    <select id="placeCity" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                        <option value="">اختر المدينة</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">التصنيف *</label>
                    <select id="placeCategory" required class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                        <option value="">اختر التصنيف</option>
                        <option value="مطاعم">مطاعم</option>
                        <option value="مقاهي">مقاهي</option>
                        <option value="حدائق">حدائق</option>
                        <option value="مراكز ترفيه">مراكز ترفيه</option>
                        <option value="معالم سياحية">معالم سياحية</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">رقم الجوال</label>
                    <input type="tel" id="placePhone" placeholder="05xxxxxxxx" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">التقييم (من 5)</label>
                    <select id="placeRating" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                        <option value="5">⭐⭐⭐⭐⭐ 5 من 5</option>
                        <option value="4">⭐⭐⭐⭐ 4 من 5</option>
                        <option value="3" selected>⭐⭐⭐ 3 من 5</option>
                        <option value="2">⭐⭐ 2 من 5</option>
                        <option value="1">⭐ 1 من 5</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">رابط الموقع على الخريطة</label>
                    <input type="url" id="placeMapLink" placeholder="رابط من Google Maps" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                </div>
                
                <!-- قسم رفع الصور -->
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">صورة المكان</label>
                    
                    <!-- معاينة الصورة -->
                    <div id="imagePreviewContainer" class="mb-3 hidden">
                        <img id="imagePreview" class="w-full h-40 object-cover rounded-lg border">
                        <button type="button" id="removeImage" class="mt-2 text-red-500 text-sm flex items-center gap-1">
                            <i class="fa fa-times-circle"></i> إزالة الصورة
                        </button>
                    </div>
                    
                    <!-- زر رفع الصورة -->
                    <label class="block w-full cursor-pointer">
                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:border-primary transition bg-gray-50">
                            <i class="fa fa-cloud-upload text-2xl text-gray-400 mb-2"></i>
                            <p class="text-sm text-gray-500">اضغط لاختيار صورة من هاتفك</p>
                            <p class="text-xs text-gray-400 mt-1">أو أدخل رابط الصورة أدناه</p>
                        </div>
                        <input type="file" id="imageUpload" accept="image/*" class="hidden">
                    </label>
                    
                    <div class="mt-3">
                        <label class="block text-gray-600 text-xs mb-1">أو أدخل رابط الصورة مباشرة:</label>
                        <input type="url" id="placeImageUrl" placeholder="https://example.com/image.jpg" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <p class="text-xs text-gray-400 mt-1">💡 نصيحة: انسخ رابط الصورة من الإنترنت والصقه في المربع أعلاه، أو اختر صورة من هاتفك</p>
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">الوصف</label>
                    <textarea id="placeDescription" rows="3" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg font-medium text-sm">
                    <i class="fa fa-plus ml-1"></i> إضافة المكان
                </button>
            </form>
            <div id="successMessage" class="mt-4 p-3 bg-green-50 text-green-700 rounded-lg hidden text-sm">
                <i class="fa fa-check-circle ml-1"></i> تم الإضافة بنجاح! <a href="home.html" class="text-primary font-medium">العودة للرئيسية</a>
            </div>
            <div id="errorMessage" class="mt-3 p-3 bg-red-50 text-red-600 rounded-lg hidden text-sm"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let imageBase64 = "";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert('يرجى تسجيل الدخول أولاً');
                window.location.href = "home.html";
                return;
            }
            currentUser = user;
            loadCities();
        });

        // تحميل قائمة المدن
        async function loadCities() {
            try {
                const citiesSnap = await getDocs(query(collection(db, 'cities'), orderBy('name', 'asc')));
                const cities = citiesSnap.docs.map(doc => doc.data());
                const select = document.getElementById('placeCity');
                select.innerHTML = '<option value="">اختر المدينة</option>' + 
                    cities.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            } catch {
                console.log('لم يتم تحميل المدن');
            }
        }

        // معالجة رفع الصورة من الهاتف
        const imageUpload = document.getElementById('imageUpload');
        const imageUrlInput = document.getElementById('placeImageUrl');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImage');

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                imageBase64 = event.target.result;
                imagePreview.src = imageBase64;
                previewContainer.classList.remove('hidden');
                imageUrlInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        // عند إدخال رابط صورة - عرض المعاينة
        imageUrlInput.addEventListener('input', () => {
            if (imageUrlInput.value.trim()) {
                imagePreview.src = imageUrlInput.value;
                previewContainer.classList.remove('hidden');
                imageBase64 = '';
                imageUpload.value = '';
            } else {
                previewContainer.classList.add('hidden');
            }
        });

        // إزالة الصورة المختارة
        removeImageBtn.addEventListener('click', () => {
            previewContainer.classList.add('hidden');
            imagePreview.src = '';
            imageUpload.value = '';
            imageUrlInput.value = '';
            imageBase64 = '';
        });

        // إرسال النموذج
        document.getElementById('addPlaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let finalImageUrl = imageUrlInput.value.trim() || imageBase64 || '';
            
            const placeData = {
                name: document.getElementById('placeName').value,
                city: document.getElementById('placeCity').value,
                category: document.getElementById('placeCategory').value,
                phone: document.getElementById('placePhone').value,
                rating: parseInt(document.getElementById('placeRating').value),
                mapLink: document.getElementById('placeMapLink').value,
                imageUrl: finalImageUrl,
                description: document.getElementById('placeDescription').value,
                createdBy: currentUser.uid,
                userEmail: currentUser.email,
                createdAt: new Date()
            };

            try {
                await addDoc(collection(db, 'places'), placeData);
                document.getElementById('successMessage').classList.remove('hidden');
                document.getElementById('errorMessage').classList.add('hidden');
                document.getElementById('addPlaceForm').reset();
                previewContainer.classList.add('hidden');
                imageBase64 = '';
            } catch (err) {
                document.getElementById('errorMessage').textContent = '❌ حدث خطأ أثناء الإضافة، حاول مرة أخرى';
                document.getElementById('errorMessage').classList.remove('hidden');
                console.error(err);
            }
        });
    </script>
</body>
</html>
