<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { background: #0F172A; font-family: 'Tajawal', sans-serif; min-height: 100vh; padding-bottom: 85px; }
        .btn-primary { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); transition: all 0.2s ease; }
        .btn-primary:active { transform: scale(0.97); }
        .input-field { background: #1E293B; border: 1px solid #334155; transition: border 0.2s ease; }
        .input-field:focus { border-color: #3B82F6; outline: none; }
        .star { cursor: pointer; color: #475569; transition: color 0.15s ease; }
        .star.active, .star:hover { color: #FBBF24; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
        button { cursor: pointer; font-family: inherit; }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 hover:text-white transition p-2">
                <i class="fa fa-arrow-right fa-lg"></i>
            </button>
            <h1 id="pageTitle" class="text-lg font-bold">إضافة مكان جديد</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="px-4 py-6">
        <form id="placeForm" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">اسم المكان *</label>
                <input type="text" id="placeName" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="أدخل اسم المكان" required>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">المدينة *</label>
                <div class="flex gap-2">
                    <select id="citySelect" class="flex-1 px-4 py-3 rounded-lg input-field text-white">
                        <option value="">-- جاري تحميل المدن --</option>
                    </select>
                    <button type="button" id="addNewCityBtn" class="px-4 py-3 rounded-lg bg-secondary/20 text-secondary hover:bg-secondary/30 transition" title="إضافة مدينة جديدة">
                        <i class="fa fa-plus"></i>
                    </button>
                </div>
                <input type="text" id="newCityInput" class="w-full px-4 py-3 rounded-lg input-field text-white mt-2 hidden" placeholder="أو اكتب اسم مدينة جديدة">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">التصنيف</label>
                <select id="placeCategory" class="w-full px-4 py-3 rounded-lg input-field text-white">
                    <option value="مطعم">مطعم</option>
                    <option value="كوفي">كوفي</option>
                    <option value="منتزه">منتزه</option>
                    <option value="محل">محل</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">رقم الجوال</label>
                <input type="tel" id="placePhone" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="05XXXXXXXX">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">رابط الموقع في قوقل ماب</label>
                <input type="url" id="placeMapUrl" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="https://goo.gl/maps/...">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">السعر</label>
                <input type="text" id="placePrice" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="مثال: متوسط / مرتفع / 50 ريال">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-2">التقييم</label>
                <div id="starRating" class="flex gap-1">
                    <span class="star text-2xl" data-value="1">★</span>
                    <span class="star text-2xl" data-value="2">★</span>
                    <span class="star text-2xl" data-value="3">★</span>
                    <span class="star text-2xl" data-value="4">★</span>
                    <span class="star text-2xl" data-value="5">★</span>
                </div>
                <input type="hidden" id="placeRating" value="0">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">وصف أو ملاحظات</label>
                <textarea id="placeNotes" rows="3" class="w-full px-4 py-3 rounded-lg input-field text-white" placeholder="أدخل وصفاً أو ملاحظات إضافية"></textarea>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-2">صور المكان</label>
                <div class="border-2 border-dashed border-slate-600 rounded-xl p-4 text-center hover:border-secondary/50 transition cursor-pointer" id="uploadArea">
                    <i class="fa fa-cloud-upload text-3xl text-slate-500 mb-2"></i>
                    <p class="text-sm text-slate-400">اضغط لاختيار الصور (ستُرفع إلى التخزين السحابي)</p>
                    <input type="file" id="imageUpload" accept="image/*" multiple class="hidden">
                </div>
                <div id="imagePreviewContainer" class="flex flex-wrap gap-2 mt-3"></div>
                <p id="uploadProgress" class="text-xs text-slate-500 mt-2 hidden"></p>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="button" id="cancelBtn" class="flex-1 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 transition">إلغاء</button>
                <button type="submit" id="saveBtn" class="flex-1 btn-primary py-3 rounded-lg font-medium">
                    <span id="saveText">حفظ المكان</span>
                    <i id="loadingIcon" class="fa fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </div>
        </form>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-dark/95 backdrop-blur-md border-t border-slate-700 px-2 py-2">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-home text-lg mb-1"></i>الرئيسية
            </button>
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-building text-lg mb-1"></i>مدينة
            </button>
            <button class="flex flex-col items-center text-xs py-1 text-secondary">
                <div class="w-11 h-11 bg-secondary/20 rounded-full flex items-center justify-center -mt-5 border border-secondary/50">
                    <i class="fa fa-plus text-lg text-secondary"></i>
                </div>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-user text-lg mb-1"></i>حسابي
            </button>
            <button onclick="window.location.href='admin-dashboard.html'" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-cog text-lg mb-1"></i>المشرف
            </button>
        </div>
    </nav>

    <script type="module">
        import {
            getCurrentUser, isAdmin, logout,
            getCities, addCity, getPlaceById, addPlace, updatePlace, uploadImage
        } from './auth.js';

        const currentUser = getCurrentUser();
        if (!currentUser || !currentUser.phone) {
            alert('يرجى تسجيل الدخول أولاً');
            window.location.href = 'login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const editId = params.get('edit');
        const preCity = params.get('city');

        const placeForm = document.getElementById('placeForm');
        const pageTitle = document.getElementById('pageTitle');
        const backBtn = document.getElementById('backBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const citySelect = document.getElementById('citySelect');
        const addNewCityBtn = document.getElementById('addNewCityBtn');
        const newCityInput = document.getElementById('newCityInput');
        const stars = document.querySelectorAll('.star');
        const placeRating = document.getElementById('placeRating');
        const uploadArea = document.getElementById('uploadArea');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const saveText = document.getElementById('saveText');
        const loadingIcon = document.getElementById('loadingIcon');
        const uploadProgress = document.getElementById('uploadProgress');

        let selectedRating = 0;
        let imageFiles = [];          // ملفات الصور الجديدة للرفع
        let existingImageUrls = [];   // روابط الصور الموجودة (في وضع التعديل)
        let editingPlace = null;

        if (editId) {
            pageTitle.textContent = 'تعديل المكان';
            saveText.textContent = 'حفظ التعديلات';
            loadPlaceForEdit(editId);
        }

        // ===== تحميل المدن من Firestore =====
        async function loadCities() {
            citySelect.innerHTML = '<option value="">-- اختر المدينة --</option>';
            const cities = await getCities();
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city.name;
                option.textContent = city.name;
                citySelect.appendChild(option);
            });
            if (preCity) citySelect.value = preCity;
        }
        loadCities();

        // ===== تحميل بيانات المكان في وضع التعديل =====
        async function loadPlaceForEdit(id) {
            editingPlace = await getPlaceById(id);
            if (!editingPlace) {
                alert('المكان غير موجود');
                window.location.href = 'home.html';
                return;
            }
            // التحقق من الصلاحية: المشرف أو صاحب المكان
            if (!isAdmin() && editingPlace.createdBy !== currentUser.phone) {
                alert('غير مصرح لك بتعديل هذا المكان');
                window.location.href = `place-detail.html?id=${id}`;
                return;
            }
            document.getElementById('placeName').value = editingPlace.name || '';
            document.getElementById('placeCategory').value = editingPlace.category || 'مطعم';
            document.getElementById('placePhone').value = editingPlace.phone || '';
            document.getElementById('placeMapUrl').value = editingPlace.mapUrl || '';
            document.getElementById('placePrice').value = editingPlace.price || '';
            document.getElementById('placeNotes').value = editingPlace.notes || '';
            selectedRating = editingPlace.rating || 0;
            placeRating.value = selectedRating;
            updateStars();
            existingImageUrls = editingPlace.images || [];
            renderExistingImages();
            // انتظار تحميل المدن ثم اختيار المدينة
            const check = setInterval(() => {
                if (citySelect.options.length > 1) {
                    citySelect.value = editingPlace.city || '';
                    clearInterval(check);
                }
            }, 200);
        }

        function renderExistingImages() {
            existingImageUrls.forEach(url => {
                const div = document.createElement('div');
                div.className = 'relative';
                div.innerHTML = `
                    <img src="${url}" class="preview-img">
                    <button type="button" class="absolute top-0 left-0 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-xs remove-existing">×</button>
                `;
                div.querySelector('.remove-existing').addEventListener('click', () => {
                    existingImageUrls = existingImageUrls.filter(u => u !== url);
                    div.remove();
                });
                imagePreviewContainer.appendChild(div);
            });
        }

        // ===== إضافة مدينة جديدة =====
        addNewCityBtn.addEventListener('click', () => {
            newCityInput.classList.toggle('hidden');
            if (!newCityInput.classList.contains('hidden')) newCityInput.focus();
        });

        // ===== التقييم بالنجوم =====
        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.value);
                placeRating.value = selectedRating;
                updateStars();
            });
            star.addEventListener('mouseover', function() {
                const value = parseInt(this.dataset.value);
                stars.forEach((s, i) => s.classList.toggle('active', i < value));
            });
        });
        document.getElementById('starRating').addEventListener('mouseleave', updateStars);
        function updateStars() {
            stars.forEach((s, i) => s.classList.toggle('active', i < selectedRating));
        }

        // ===== اختيار الصور (معاينة محلية فقط) =====
        uploadArea.addEventListener('click', () => imageUpload.click());
        imageUpload.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                imageFiles.push(file);
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const div = document.createElement('div');
                    div.className = 'relative';
                    div.innerHTML = `
                        <img src="${ev.target.result}" class="preview-img">
                        <button type="button" class="absolute top-0 left-0 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-xs remove-new">×</button>
                    `;
                    div.querySelector('.remove-new').addEventListener('click', () => {
                        imageFiles = imageFiles.filter(f => f !== file);
                        div.remove();
                    });
                    imagePreviewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
            imageUpload.value = '';
        });

        // ===== الأزرار =====
        backBtn.addEventListener('click', () => history.back());
        cancelBtn.addEventListener('click', () => history.back());

        // ===== حفظ المكان =====
        placeForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('placeName').value.trim();
            let city = citySelect.value.trim();
            const newCity = newCityInput.value.trim();
            const category = document.getElementById('placeCategory').value;
            const phone = document.getElementById('placePhone').value.trim();
            const mapUrl = document.getElementById('placeMapUrl').value.trim();
            const price = document.getElementById('placePrice').value.trim();
            const notes = document.getElementById('placeNotes').value.trim();

            if (!name) { alert('أدخل اسم المكان'); return; }
            if (!city && !newCity) { alert('اختر المدينة أو اكتب مدينة جديدة'); return; }

            saveText.classList.add('hidden');
            loadingIcon.classList.remove('hidden');

            try {
                // إنشاء مدينة جديدة إذا لزم الأمر
                if (newCity) {
                    city = newCity;
                    const exists = Array.from(citySelect.options).some(o => o.value === city);
                    if (!exists) {
                        await addCity({ name: city });
                    }
                }

                // رفع الصور الجديدة إلى Storage
                uploadProgress.classList.remove('hidden');
                const uploadedUrls = [...existingImageUrls];
                for (let i = 0; i < imageFiles.length; i++) {
                    uploadProgress.textContent = `جاري رفع الصورة ${i + 1} من ${imageFiles.length}...`;
                    const { url } = await uploadImage(imageFiles[i]);
                    uploadedUrls.push(url);
                }
                uploadProgress.classList.add('hidden');

                const placeData = {
                    name, city, category, phone, mapUrl, price,
                    rating: selectedRating, notes, images: uploadedUrls
                };
                // صورة واسم صاحب المكان (تظهر للجميع ليعرفوا من رفعه)
                if (!editId || (editingPlace && editingPlace.createdBy === currentUser.phone)) {
                    placeData.createdByAvatar = currentUser.avatarUrl || '';
                    placeData.createdByName = currentUser.name || 'مستخدم';
                }

                if (editId) {
                    // تحديث مكان موجود
                    await updatePlace(editId, placeData);
                    alert('✅ تم تحديث المكان بنجاح');
                    window.location.href = `place-detail.html?id=${editId}`;
                } else {
                    // إضافة مكان جديد مع بيانات المالك
                    placeData.createdBy = currentUser.phone;
                    placeData.createdByName = currentUser.name || 'مستخدم';
                    placeData.createdByPhone = currentUser.phone;
                    await addPlace(placeData);
                    alert('✅ تم حفظ المكان بنجاح');
                    window.location.href = 'city.html?name=' + encodeURIComponent(city);
                }
            } catch (error) {
                console.error(error);
                alert('❌ حدث خطأ أثناء الحفظ: ' + error.message);
                saveText.classList.remove('hidden');
                loadingIcon.classList.add('hidden');
                uploadProgress.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
