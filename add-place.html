<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مكان جديد — كشكات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22c55e',
                        secondary: '#15803d',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex items-center">
            <a href="home.html" class="text-white mr-3">
                <i class="fa fa-arrow-left text-xl"></i>
            </a>
            <h1 class="text-xl font-bold">إضافة مكان جديد</h1>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-lg">
        <div class="bg-white rounded-2xl shadow-sm p-6">
            <form id="addPlaceForm" class="space-y-5">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">اسم المكان</label>
                    <input type="text" id="placeName" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">المدينة</label>
                    <select id="placeCity" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                        <option value="">اختر المدينة</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">التصنيف</label>
                    <select id="placeCategory" required 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                        <option value="">اختر التصنيف</option>
                        <option value="مطاعم">مطاعم</option>
                        <option value="مقاهي">مقاهي</option>
                        <option value="حدائق">حدائق</option>
                        <option value="مراكز ترفيه">مراكز ترفيه</option>
                        <option value="معالم سياحية">معالم سياحية</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">الوصف</label>
                    <textarea id="placeDescription" rows="4" 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50"></textarea>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-2">الموقع الإلكتروني (اختياري)</label>
                    <input type="url" id="placeWebsite" 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>

                <button type="submit" 
                    class="w-full bg-primary hover:bg-secondary text-white py-3 rounded-lg font-medium transition">
                    <i class="fa fa-plus ml-2"></i>
                    إضافة المكان
                </button>
            </form>

            <div id="successMessage" class="mt-6 p-4 bg-green-50 text-green-700 rounded-lg hidden">
                <i class="fa fa-check-circle ml-2"></i>
                تم إضافة المكان بنجاح!
                <a href="home.html" class="text-primary hover:underline mr-2">العودة للرئيسية</a>
            </div>

            <div id="errorMessage" class="mt-4 p-3 bg-red-50 text-red-600 rounded-lg hidden"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // ✅ إعداد Firebase الصحيح
        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const placeCity = document.getElementById('placeCity');
        const addPlaceForm = document.getElementById('addPlaceForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        // التحقق من تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'home.html';
            }
        });

        // تحميل قائمة المدن
        async function loadCities() {
            try {
                const citiesSnap = await getDocs(collection(db, 'cities'));
                citiesSnap.docs.forEach(doc => {
                    const city = doc.data();
                    const option = document.createElement('option');
                    option.value = city.name;
                    option.textContent = city.name;
                    placeCity.appendChild(option);
                });
            } catch (error) {
                console.error("خطأ في تحميل المدن:", error);
                errorMessage.textContent = "حدث خطأ أثناء تحميل قائمة المدن";
                errorMessage.classList.remove('hidden');
            }
        }

        // إضافة مكان جديد
        addPlaceForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            const name = document.getElementById('placeName').value;
            const city = document.getElementById('placeCity').value;
            const category = document.getElementById('placeCategory').value;
            const description = document.getElementById('placeDescription').value;
            const website = document.getElementById('placeWebsite').value;

            try {
                await addDoc(collection(db, 'places'), {
                    name,
                    city,
                    category,
                    description,
                    website: website || null,
                    createdAt: new Date()
                });

                successMessage.classList.remove('hidden');
                addPlaceForm.reset();
            } catch (error) {
                console.error("خطأ في إضافة المكان:", error);
                errorMessage.textContent = "حدث خطأ أثناء إضافة المكان، حاول مرة أخرى";
                errorMessage.classList.remove('hidden');
            }
        });

        loadCities();
    </script>
</body>
</html>
