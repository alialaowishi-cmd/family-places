<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | كشتات عائلة حسين العويشي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 26px; color: #4ade80; margin-bottom: 5px; }
        .logo p { color: #94a3b8; font-size: 14px; }
        .tab-buttons { display: flex; margin-bottom: 25px; border-radius: 12px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: #4ade80; color: #000; }
        .form-container { display: none; }
        .form-container.active { display: block; }
        input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; margin-bottom: 15px; outline: none;
        }
        input:focus { border-color: #4ade80; }
        button[type="submit"] {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s; margin-top: 5px;
        }
        button[type="submit"]:hover { transform: translateY(-2px); }
        .forgot-link { text-align: center; margin-top: 15px; }
        .forgot-link a { color: #4ade80; text-decoration: none; font-size: 14px; }
        .message { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
        .success { background: rgba(74,222,128,0.1); color: #4ade80; display: block; }
        .error { background: rgba(239,68,68,0.1); color: #f87171; display: block; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">
            <h1>🌿 كشتات عائلة حسين العويشي</h1>
            <p>استكشف وأشارك أجمل الأماكن</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('register')">تسجيل جديد</button>
        </div>

        <!-- تسجيل الدخول -->
        <div id="loginForm" class="form-container active">
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="loginUser()">دخول</button>
            <div class="forgot-link">
                <a href="#" onclick="switchTab('forgot'); return false;">هل نسيت كلمة المرور؟</a>
            </div>
            <div id="loginMsg" class="message"></div>
        </div>

        <!-- تسجيل جديد -->
        <div id="registerForm" class="form-container">
            <input type="text" id="regName" placeholder="الاسم الكامل">
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="regPassword" placeholder="كلمة المرور (6 أحرف على الأقل)">
            <button onclick="registerUser()">إنشاء حساب</button>
            <div id="regMsg" class="message"></div>
        </div>

        <!-- استعادة كلمة المرور -->
        <div id="forgotForm" class="form-container">
            <input type="email" id="forgotEmail" placeholder="أدخل بريدك الإلكتروني">
            <button onclick="resetPassword()">إرسال رابط الاستعادة</button>
            <div class="forgot-link">
                <a href="#" onclick="switchTab('login'); return false;">← العودة لتسجيل الدخول</a>
            </div>
            <div id="forgotMsg" class="message"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.appspot.com",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else if (tab === 'register') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            } else if (tab === 'forgot') {
                document.getElementById('loginForm').classList.remove('active');
                document.getElementById('forgotForm').classList.add('active');
            }
        }
        window.switchTab = switchTab;

        async function loginUser() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMsg');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                msg.textContent = '✅ تم الدخول بنجاح! جاري التوجيه...'; msg.className = 'message success';
                setTimeout(() => window.location.href = 'home.html', 1200);
            } catch (err) {
                msg.textContent = '❌ خطأ: ' + err.message; msg.className = 'message error';
            }
        }
        window.loginUser = loginUser;

        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;
            const msg = document.getElementById('regMsg');
            if (!name || !email || pass.length < 6) {
                msg.textContent = '❌ تأكد من ملء جميع الحقول وكلمة المرور 6 أحرف على الأقل'; msg.className = 'message error';
                return;
            }
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: name });
                msg.textContent = '✅ تم إنشاء الحساب! جاري التوجيه...'; msg.className = 'message success';
                setTimeout(() => window.location.href = 'home.html', 1200);
            } catch (err) {
                msg.textContent = '❌ خطأ: ' + err.message; msg.className = 'message error';
            }
        }
        window.registerUser = registerUser;

        async function resetPassword() {
            const email = document.getElementById('forgotEmail').value.trim();
            const msg = document.getElementById('forgotMsg');
            try {
                await sendPasswordResetEmail(auth, email);
                msg.textContent = '✅ أُرسل رابط الاستعادة إلى بريدك!'; msg.className = 'message success';
            } catch (err) {
                msg.textContent = '❌ خطأ: ' + err.message; msg.className = 'message error';
            }
        }
        window.resetPassword = resetPassword;
    </script>
</body>
</html>
