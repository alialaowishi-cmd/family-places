<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي — كشتات العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#22C55E', secondary: '#3B82F6', danger: '#EF4444' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%); min-height: 100vh; padding-bottom: 90px; }
    </style>
</head>
<body class="px-4 py-6">
    <header class="mb-8">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center">
                <i class="fa fa-arrow-right text-gray-600"></i>
            </button>
            <h1 class="text-xl font-bold">حسابي</h1>
            <div class="w-10"></div>
        </div>
    </header>

    <div id="profileContent" class="max-w-md mx-auto space-y-4">
        <!-- معلومات المستخدم -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 text-center">
            <div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa fa-user text-primary text-4xl"></i>
            </div>
            <h2 class="text-xl font-bold" id="userName">اسم المستخدم</h2>
            <p class="text-gray-500 mt-1" id="userPhone">05xxxxxxxx</p>
            <span id="userBadge" class="inline-block mt-2 px-3 py-1 bg-sky-100 text-sky-700 rounded-full text-sm">مستخدم</span>
        </div>

        <!-- إجراءات الحساب -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100 space-y-3">
            <button onclick="window.location.href='home.html'" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50">
                <i class="fa fa-home text-gray-500"></i>
                <span>الصفحة الرئيسية</span>
            </button>
            
            <!-- ✅ زر المشرف يظهر فقط للمشرف -->
            <button id="adminBtn" onclick="window.location.href='admin-dashboard.html'" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-sky-50 hidden">
                <i class="fa fa-cog text-secondary"></i>
                <span>لوحة تحكم المشرف</span>
            </button>
            
            <hr class="my-2 border-gray-100">
            
            <button onclick="logout()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-red-50 text-danger">
                <i class="fa fa-sign-out"></i>
                <span>تسجيل الخروج</span>
            </button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg px-4 py-3 z-40">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-home text-lg"></i><span>الرئيسية</span>
            </button>
            <button onclick="window.location.href='add-place.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary">
                <i class="fa fa-plus-circle text-lg"></i><span>إضافة مكان</span>
            </button>
            <button onclick="window.location.href='home.html'" class="flex flex-col items-center gap-1 text-xs text-gray-500 hover:text-primary relative">
                <i class="fa fa-bell text-lg"></i><span>الإشعارات</span>
            </button>
            <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-xs text-primary">
                <i class="fa fa-user text-lg"></i><span>حسابي</span>
            </button>
        </div>
    </nav>

    <script>
        // التحقق من تسجيل الدخول
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // عرض بيانات المستخدم
        document.getElementById('userName').textContent = currentUser.name || 'مستخدم';
        document.getElementById('userPhone').textContent = currentUser.phone || '';

        // ✅ إظهار زر المشرف إذا كان المستخدم مشرفاً
        if (currentUser.type === 'admin') {
            document.getElementById('adminBtn').classList.remove('hidden');
            document.getElementById('userBadge').textContent = 'مشرف';
            document.getElementById('userBadge').className = 'inline-block mt-2 px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-sm';
        }

        function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
