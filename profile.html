<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script type="module" src="./auth.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007AFF',
                        primaryLight: 'rgba(0, 122, 255, 0.08)',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(180deg, rgba(0, 122, 255, 0.04) 0%, rgba(94, 92, 230, 0.03) 100%);
            min-height: 100vh;
            padding-bottom: 85px;
            font-family: 'Tajawal', sans-serif;
        }
        .glass-ios {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .input-ios {
            background: rgba(118, 118, 128, 0.08);
            border: none;
        }
        .input-ios:focus {
            background: rgba(118, 118, 128, 0.04);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
            outline: none;
        }
        .btn-primary-ios {
            background: linear-gradient(135deg, #007AFF 0%, #0066DD 100%);
        }
        .avatar-ring {
            background: linear-gradient(135deg, #007AFF, #5856D6);
            padding: 3px;
        }
        .bottom-nav {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: saturate(180%) blur(25px);
            border-top: 1px solid rgba(0, 122, 255, 0.08);
        }
        .nav-item { transition: all 0.2s ease; }
        .nav-item.active { color: #007AFF; }
        .nav-item:not(.active) { color: #8E8E93; }
    </style>
</head>
<body>
    <header class="glass-ios sticky top-0 z-40 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="flex items-center gap-2 text-gray-500 hover:text-primary text-sm">
                <i class="fa fa-arrow-right"></i> رجوع
            </button>
            <h1 class="text-lg font-bold text-gray-800">حسابي</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-5">
        <!-- صورة الملف الشخصي -->
        <div class="flex flex-col items-center mb-8">
            <div class="avatar-ring rounded-full mb-3">
                <div class="w-24 h-24 rounded-full bg-gray-100 overflow-hidden" id="avatarContainer">
                    <img id="avatarPreview" src="" alt="صورة شخصية" class="w-full h-full object-cover hidden">
                    <i id="avatarIcon" class="fa fa-user text-4xl text-gray-400 flex items-center justify-center w-full h-full"></i>
                </div>
            </div>
            <label for="avatarInput" class="text-primary text-sm font-medium cursor-pointer hover:underline">
                <i class="fa fa-camera ml-1"></i> تغيير الصورة الشخصية
            </label>
            <input type="file" id="avatarInput" accept="image/*" class="hidden">
        </div>

        <!-- بيانات المستخدم -->
        <form id="profileForm" class="glass-ios rounded-3xl p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-500 mb-2">الاسم الكامل</label>
                <input type="text" id="userName" placeholder="أدخل اسمك الكامل"
                    class="w-full px-4 py-3 rounded-xl input-ios">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-500 mb-2">رقم الجوال</label>
                <input type="tel" id="userPhone" placeholder="05XXXXXXXX" readonly
                    class="w-full px-4 py-3 rounded-xl input-ios bg-gray-50">
                <p class="text-xs text-gray-400 mt-1">لا يمكن تغيير رقم الجوال</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-500 mb-2">البريد الإلكتروني (اختياري)</label>
                <input type="email" id="userEmail" placeholder="بريدك الإلكتروني"
                    class="w-full px-4 py-3 rounded-xl input-ios">
            </div>
            <button type="submit" class="w-full btn-primary-ios text-white font-medium py-3.5 rounded-xl mt-2">
                حفظ التغييرات
            </button>
        </form>

        <!-- إحصائيات سريعة -->
        <div class="glass-ios rounded-3xl p-5 mt-6">
            <h3 class="font-bold text-gray-800 mb-4">نشاطي</h3>
            <div class="grid grid-cols-2 gap-4 text-center">
                <div>
                    <p class="text-2xl font-bold text-primary" id="myPlacesCount">0</p>
                    <p class="text-xs text-gray-500">مكان أضفته</p>
                </div>
                <div>
                    <p class="text-2xl font-bold text-primary" id="joinDate">-</p>
                    <p class="text-xs text-gray-500">عضو منذ</p>
                </div>
            </div>
        </div>

        <!-- زر تسجيل الخروج -->
        <button id="logoutBtn" class="w-full mt-6 py-3 rounded-xl bg-red-50 text-red-500 font-medium hover:bg-red-100 transition">
            <i class="fa fa-sign-out ml-2"></i> تسجيل الخروج
        </button>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bottom-nav z-50">
        <div class="max-w-lg mx-auto px-2 py-2.5 flex items-end justify-around">
            <button class="nav-item flex flex-col items-center gap-1 px-2 py-1 text-gray-500" onclick="window.location.href='home.html'">
                <i class="fa fa-home text-lg"></i>
                <span class="text-xs">الرئيسية</span>
            </button>
            <button class="nav-item flex flex-col items-center gap-1 px-2 py-1 text-gray-500" onclick="alert('قيد التطوير')">
                <i class="fa fa-building-o text-lg"></i>
                <span class="text-xs">مدينة</span>
            </button>
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 text-lg">
                <i class="fa fa-plus"></i>
            </button>
            <button class="nav-item flex flex-col items-center gap-1 px-2 py-1 active" onclick="window.location.href='profile.html'">
                <i class="fa fa-user text-lg"></i>
                <span class="text-xs">حسابي</span>
            </button>
            <button id="navAdmin" class="nav-item flex flex-col items-center gap-1 px-2 py-1 text-gray-500 hidden" onclick="window.location.href='admin-dashboard.html'">
                <i class="fa fa-cog text-lg"></i>
                <span class="text-xs">المشرف</span>
            </button>
        </div>
    </nav>

    <script type="module">
        import { getCurrentUser, isUserLoggedIn, isAdmin, updateUserProfile, uploadImage, getAllPlaces, logout } from './auth.js';

        if (!isUserLoggedIn()) window.location.href = 'login.html';
        if (isAdmin()) document.getElementById('navAdmin').classList.remove('hidden');

        const user = getCurrentUser();
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarIcon = document.getElementById('avatarIcon');
        let avatarUrl = user?.avatar || '';

        // تحميل بيانات المستخدم
        document.getElementById('userName').value = user?.name || '';
        document.getElementById('userPhone').value = user?.phone || '';
        document.getElementById('userEmail').value = user?.email || '';

        // عرض الصورة الشخصية
        if (avatarUrl) {
            avatarPreview.src = avatarUrl;
            avatarPreview.classList.remove('hidden');
            avatarIcon.classList.add('hidden');
        }

        // إحصائيات
        async function loadStats() {
            const allPlaces = await getAllPlaces();
            const myPlaces = allPlaces.filter(p => p.createdBy === (user?.phone || user?.email));
            document.getElementById('myPlacesCount').textContent = myPlaces.length;
            document.getElementById('joinDate').textContent = user?.createdAt 
                ? new Date(user.createdAt.toDate ? user.createdAt.toDate() : user.createdAt).toLocaleDateString('ar-SA')
                : '-';
        }
        loadStats();

        // تغيير الصورة الشخصية
        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const result = await uploadImage(file);
            avatarUrl = result.url;
            
            avatarPreview.src = avatarUrl;
            avatarPreview.classList.remove('hidden');
            avatarIcon.classList.add('hidden');
        });

        // حفظ التغييرات
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            
            if (!name) return alert('الاسم مطلوب ❌');
            
            try {
                await updateUserProfile({
                    name,
                    email: email || null,
                    avatar: avatarUrl || null
                });
                alert('✅ تم حفظ بياناتك بنجاح!');
            } catch (err) {
                console.error(err);
                alert('❌ حدث خطأ أثناء الحفظ');
            }
        });

        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                logout();
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
