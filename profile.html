<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { 
            background: #0F172A; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 85px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); 
            transition: all 0.2s ease;
        }
        .menu-item { 
            transition: all 0.2s ease; 
        }
        .menu-item:active { 
            background: #334155; 
        }
        button { cursor: pointer; font-family: inherit; }
        .avatar-upload:hover .edit-icon { opacity: 1; }
        .edit-icon { transition: opacity 0.2s ease; }
    </style>
</head>
<body class="text-white">
    <!-- الهيدر بنفس الشكل القديم -->
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 p-2"><i class="fa fa-arrow-right fa-lg"></i></button>
            <h1 class="text-lg font-bold">حسابي</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="px-4 py-6">
        <!-- بطاقة الصورة الشخصية والمعلومات -->
        <section class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 mb-6 text-center">
            <!-- رفع وتغيير الصورة الشخصية -->
            <div class="relative inline-block mb-4">
                <div class="w-28 h-28 mx-auto rounded-full overflow-hidden border-4 border-secondary/30 avatar-upload relative cursor-pointer" id="avatarContainer">
                    <img id="userAvatar" src="" class="w-full h-full object-cover" alt="صورة شخصية">
                    <div class="absolute inset-0 bg-black/50 flex items-center justify-center edit-icon opacity-0">
                        <i class="fa fa-camera text-white text-xl"></i>
                    </div>
                </div>
                <input type="file" id="avatarInput" accept="image/*" class="hidden">
            </div>
            
            <h2 id="userName" class="text-xl font-bold mb-1">اسم المستخدم</h2>
            <p id="userPhone" class="text-slate-400 mb-2">رقم الجوال</p>
            <p id="userEmail" class="text-sm text-slate-500 mb-4"></p>
            
            <button id="changeAvatarBtn" class="px-4 py-2 bg-secondary/20 text-secondary rounded-lg text-sm hover:bg-secondary/30 transition">
                <i class="fa fa-camera ml-1"></i> تغيير الصورة الشخصية
            </button>
        </section>

        <!-- إحصائيات بنفس الشكل القديم -->
        <section class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 text-center">
                <p id="myPlacesCount" class="text-2xl font-bold text-secondary">0</p>
                <p class="text-xs text-slate-400">مكان مضاف</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 text-center">
                <p class="text-2xl font-bold text-yellow-400">⭐</p>
                <p class="text-xs text-slate-400">تقييمات</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 text-center">
                <p class="text-2xl font-bold text-green-400">📅</p>
                <p class="text-xs text-slate-400">منذ</p>
            </div>
        </section>

        <!-- القائمة والأزرار بنفس الترتيب والشكل القديم -->
        <section class="space-y-3">
            <button id="editProfileBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-pencil text-secondary"></i>
                    تعديل بياناتي
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="myPlacesBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-map-marker text-green-400"></i>
                    أماكني المضافة
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="notificationsBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-bell text-yellow-400"></i>
                    الإشعارات
                </span>
                <span class="bg-secondary text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">3</span>
            </button>
            
            <button id="adminPanelBtn" class="w-full flex items-center justify-between p-4 bg-yellow-900/20 border border-yellow-700/30 rounded-xl menu-item hidden">
                <span class="flex items-center gap-3 text-yellow-400">
                    <i class="fa fa-cog"></i>
                    لوحة تحكم المشرف
                </span>
                <i class="fa fa-chevron-left text-yellow-600 text-sm"></i>
            </button>

            <button id="aboutBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-info-circle text-slate-400"></i>
                    عن المنصة
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="helpBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-question-circle text-slate-400"></i>
                    المساعدة والدعم
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="logoutBtn" class="w-full flex items-center justify-center gap-2 p-4 bg-red-900/20 border border-red-700/30 rounded-xl text-red-400 menu-item mt-4">
                <i class="fa fa-sign-out"></i>
                تسجيل الخروج
            </button>
        </section>
    </main>

    <!-- شريط التنقل السفلي بنفس الشكل القديم -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-dark/95 backdrop-blur-md border-t border-slate-700 px-2 py-2">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button id="navHomeBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-home text-lg mb-1"></i>الرئيسية
            </button>
            <button id="navCitiesBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-building text-lg mb-1"></i>المدن
            </button>
            <button id="navAddBtn" class="flex flex-col items-center text-xs py-1">
                <div class="w-12 h-12 bg-secondary rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-secondary/30">
                    <i class="fa fa-plus text-xl text-white"></i>
                </div>
            </button>
            <button id="navNotificationsBottomBtn" class="flex flex-col items-center text-xs text-slate-400 py-1">
                <i class="fa fa-bell text-lg mb-1"></i>الإشعارات
            </button>
            <button class="flex flex-col items-center text-xs text-secondary py-1">
                <i class="fa fa-user text-lg mb-1"></i>حسابي
            </button>
        </div>
    </nav>

    <script type="module">
        import { getCurrentUser, logout } from './auth.js';
        import { getPlaces } from './db.js';
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
        import { db, storage } from './firebase-config.js';
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const currentUser = getCurrentUser();
        if (!currentUser) window.location.href = 'login.html';

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('✅ صفحة الملف الشخصي محملة');
            renderUserData();
            await loadUserStats();
            bindEvents();
        });

        function renderUserData() {
            document.getElementById('userName').textContent = currentUser.name || 'مستخدم';
            document.getElementById('userPhone').textContent = currentUser.phone || 'غير متوفر';
            document.getElementById('userEmail').textContent = currentUser.email || '';

            // تحميل الصورة الشخصية
            const avatarEl = document.getElementById('userAvatar');
            if (currentUser.avatarUrl) {
                avatarEl.src = currentUser.avatarUrl;
            } else {
                avatarEl.src = 'https://via.placeholder.com/200x200/1E293B/FFFFFF?text=' + (currentUser.name ? currentUser.name.charAt(0) : 'م');
            }

            // إظهار زر المشرف
            if (currentUser.isAdmin) {
                document.getElementById('adminPanelBtn').classList.remove('hidden');
            }
        }

        async function loadUserStats() {
            try {
                const allPlaces = await getPlaces();
                const myPlaces = allPlaces.filter(p => p.ownerId === currentUser.uid);
                document.getElementById('myPlacesCount').textContent = myPlaces.length;
            } catch (error) {
                console.error('❌ خطأ تحميل الإحصائيات:', error);
            }
        }

        function bindEvents() {
            // التنقل
            document.getElementById('backBtn').onclick = () => history.back();
            document.getElementById('navHomeBtn').onclick = () => window.location.href = 'home.html';
            document.getElementById('navAddBtn').onclick = () => window.location.href = 'add-place.html';
            document.getElementById('navNotificationsBottomBtn').onclick = () => alert('قيد التطوير ⏳');

            // رفع الصورة الشخصية
            document.getElementById('avatarContainer').onclick = () => document.getElementById('avatarInput').click();
            document.getElementById('changeAvatarBtn').onclick = () => document.getElementById('avatarInput').click();
            document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);

            // أزرار القائمة
            document.getElementById('editProfileBtn').onclick = () => alert('تعديل البيانات قيد التطوير، تواصل مع المشرف');
            document.getElementById('myPlacesBtn').onclick = () => alert('عرض أماكنك المضافة قيد التطوير');
            document.getElementById('notificationsBtn').onclick = () => alert('لا توجد إشعارات جديدة ✅');
            document.getElementById('adminPanelBtn').onclick = () => window.location.href = 'admin-dashboard.html';
            document.getElementById('aboutBtn').onclick = () => {
                alert('🏠 كشتات عائلة حسين العويشي\nمنصة عائلية لمشاركة الأماكن المفضلة\nالإصدار 1.0.0\nتم التطوير 2026 🇸🇦');
            };
            document.getElementById('helpBtn').onclick = () => {
                alert('📞 للمساعدة تواصل مع المشرف:\n0500509134');
            };
            document.getElementById('logoutBtn').onclick = handleLogout;
        }

        async function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            try {
                console.log('⏳ جاري رفع الصورة...');
                
                // عرض معاينة فورية
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('userAvatar').src = event.target.result;
                };
                reader.readAsDataURL(file);

                // رفع إلى Firebase Storage
                const path = `avatars/${currentUser.uid}_${Date.now()}_${file.name}`;
                const storageRef = ref(storage, path);
                await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(storageRef);

                // حفظ الرابط في بيانات المستخدم
                const userRef = doc(db, 'users', currentUser.uid);
                await setDoc(userRef, { avatarUrl: downloadURL }, { merge: true });

                // تحديث البيانات المحلية
                currentUser.avatarUrl = downloadURL;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                alert('✅ تم تحديث الصورة الشخصية بنجاح!');
                console.log('✅ رابط الصورة:', downloadURL);
            } catch (error) {
                console.error('❌ خطأ في رفع الصورة:', error);
                alert('❌ حدث خطأ أثناء رفع الصورة، حاول مرة أخرى');
            }
        }

        async function handleLogout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                await logout();
            }
        }
    </script>
</body>
</html>
