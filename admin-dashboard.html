<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف — كشتات العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        primary: '#22C55E', 
                        secondary: '#3B82F6', 
                        danger: '#EF4444',
                        warning: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(180deg, #F0FDF4 0%, #FFFFFF 100%); min-height: 100vh; padding-bottom: 40px; }
        .tab-btn.active { background: #22C55E; color: white; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="px-4 py-6">
    <header class="mb-8">
        <div class="flex items-center justify-between">
            <button onclick="window.location.href='home.html'" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center">
                <i class="fa fa-arrow-right text-gray-600"></i>
            </button>
            <h1 class="text-xl font-bold">لوحة تحكم المشرف</h1>
            <button onclick="logout()" class="text-gray-500 hover:text-danger text-sm">
                <i class="fa fa-sign-out"></i>
            </button>
        </div>
    </header>

    <!-- علامات التبويب -->
    <div class="flex flex-wrap gap-2 mb-6">
        <button class="tab-btn active px-4 py-2 rounded-xl text-sm font-medium" onclick="switchTab('users')">
            <i class="fa fa-users ml-1"></i> المستخدمين
        </button>
        <button class="tab-btn bg-gray-100 px-4 py-2 rounded-xl text-sm font-medium" onclick="switchTab('cities')">
            <i class="fa fa-building ml-1"></i> المدن
        </button>
        <button class="tab-btn bg-gray-100 px-4 py-2 rounded-xl text-sm font-medium" onclick="switchTab('places')">
            <i class="fa fa-map-marker ml-1"></i> الأماكن
        </button>
    </div>

    <!-- قسم المستخدمين -->
    <div id="usersSection" class="tab-content">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">قائمة المشتركين</h2>
            <button onclick="openAddUserModal()" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-medium">
                <i class="fa fa-plus ml-1"></i> إضافة مستخدم
            </button>
        </div>

        <div id="usersList" class="space-y-3">
            <div class="text-center py-8 text-gray-400">جاري تحميل البيانات...</div>
        </div>
    </div>

    <!-- قسم المدن -->
    <div id="citiesSection" class="tab-content hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">إدارة المدن</h2>
            <button onclick="openAddCityModal()" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-medium">
                <i class="fa fa-plus ml-1"></i> إضافة مدينة
            </button>
        </div>

        <div id="citiesList" class="space-y-3">
            <div class="text-center py-8 text-gray-400">لا توجد مدن مضافة</div>
        </div>
    </div>

    <!-- قسم الأماكن -->
    <div id="placesSection" class="tab-content hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">إدارة جميع الأماكن</h2>
        </div>

        <div id="allPlacesList" class="space-y-3">
            <div class="text-center py-8 text-gray-400">لا توجد أماكن مضافة</div>
        </div>
    </div>

    <!-- نافذة إضافة مستخدم جديد -->
    <div id="addUserModal" class="modal fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl p-6">
            <h3 class="text-lg font-bold mb-4 text-center">إضافة مستخدم جديد</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الاسم الكامل *</label>
                    <input type="text" id="newUserName" placeholder="أدخل الاسم"
                        class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">رقم الجوال *</label>
                    <input type="tel" id="newUserPhone" placeholder="05xxxxxxxx"
                        class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني (اختياري)</label>
                    <input type="email" id="newUserEmail" placeholder="بريدك@email.com"
                        class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none">
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeAddUserModal()" class="flex-1 p-3 rounded-xl bg-gray-100">إلغاء</button>
                <button onclick="saveNewUser()" class="flex-1 p-3 bg-primary text-white rounded-xl">حفظ ✅</button>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة مدينة -->
    <div id="addCityModal" class="modal fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl p-6">
            <h3 class="text-lg font-bold mb-4 text-center">إضافة مدينة جديدة</h3>
            <input type="text" id="adminNewCityName" placeholder="أدخل اسم المدينة"
                class="w-full p-3.5 rounded-xl bg-gray-50 border border-gray-200 outline-none mb-4">
            <div class="flex gap-3">
                <button onclick="closeAddCityModal()" class="flex-1 p-3 rounded-xl bg-gray-100">إلغاء</button>
                <button onclick="saveAdminCity()" class="flex-1 p-3 bg-primary text-white rounded-xl">إضافة ✅</button>
            </div>
        </div>
    </div>

    <script>
        // التحقق من صلاحية المشرف
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        if (!currentUser || currentUser.type !== 'admin') {
            alert('❌ غير مصرح لك بالدخول لهذه الصفحة');
            window.location.href = 'login.html';
        }

        function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }

        // تبديل علامات التبويب
        function switchTab(tabName) {
            // إخفاء جميع الأقسام
            document.querySelectorAll('.tab-content').forEach(section => {
                section.classList.add('hidden');
            });
            // إلغاء تنشيط جميع الأزرار
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-primary', 'text-white');
                btn.classList.add('bg-gray-100');
            });
            
            // إظهار القسم المحدد
            document.getElementById(tabName + 'Section').classList.remove('hidden');
            // تنشيط الزر المحدد
            event.target.classList.add('active');
            event.target.classList.remove('bg-gray-100');
            
            // تحميل البيانات
            if (tabName === 'users') loadUsers();
            if (tabName === 'cities') loadCitiesAdmin();
            if (tabName === 'places') loadAllPlaces();
        }

        // ==================== إدارة المستخدمين ====================
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
            const container = document.getElementById('usersList');
            
            if (users.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">لا يوجد مستخدمين مسجلين حتى الآن</div>`;
                return;
            }

            container.innerHTML = '';
            users.forEach(user => {
                const statusColor = user.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
                const statusText = user.status === 'approved' ? 'مفعل ✅' : 'بانتظار الموافقة ⏳';
                const isAdmin = user.type === 'admin';
                
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                        <div class="flex items-start justify-between">
                            <div class="flex items-start gap-3">
                                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                                    <i class="fa fa-user text-primary"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold">${user.name || 'بدون اسم'}</h4>
                                    <p class="text-sm text-gray-500">📱 ${user.phone}</p>
                                    ${user.email ? `<p class="text-sm text-gray-400">✉️ ${user.email}</p>` : ''}
                                    <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs ${statusColor}">${statusText}</span>
                                    ${isAdmin ? '<span class="inline-block mt-1 mr-1 px-2 py-0.5 rounded-full text-xs bg-amber-100 text-amber-700">مشرف 👑</span>' : ''}
                                </div>
                            </div>
                            ${!isAdmin ? `
                                <div class="flex flex-col gap-1">
                                    ${user.status !== 'approved' ? `
                                        <button onclick="approveUser('${user.id}')" class="text-xs bg-green-50 text-green-600 px-2 py-1 rounded-lg">
                                            <i class="fa fa-check ml-1"></i> موافقة
                                        </button>
                                    ` : ''}
                                    <button onclick="deleteUser('${user.id}')" class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded-lg">
                                        <i class="fa fa-trash ml-1"></i> حذف
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function openAddUserModal() {
            document.getElementById('newUserName').value = '';
            document.getElementById('newUserPhone').value = '';
            document.getElementById('newUserEmail').value = '';
            document.getElementById('addUserModal').classList.remove('hidden');
            document.getElementById('addUserModal').classList.add('flex');
        }

        function closeAddUserModal() {
            document.getElementById('addUserModal').classList.add('hidden');
            document.getElementById('addUserModal').classList.remove('flex');
        }

        function saveNewUser() {
            const name = document.getElementById('newUserName').value.trim();
            const phone = document.getElementById('newUserPhone').value.trim().replace(/\s/g, '');
            const email = document.getElementById('newUserEmail').value.trim();

            if (!name || !phone) {
                alert('⚠️ الرجاء إدخال الاسم ورقم الجوال');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
            
            // تحقق من عدم تكرار الرقم
            const exists = users.find(u => u.phone.replace(/\s/g, '') === phone);
            if (exists) {
                alert('⚠️ هذا الرقم مسجل مسبقاً!');
                return;
            }

            const newUser = {
                id: 'user_' + Date.now(),
                name: name,
                phone: phone,
                email: email,
                status: 'approved',
                type: 'user',
                registeredAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('pendingUsers', JSON.stringify(users));
            alert(`✅ تم إضافة المستخدم "${name}" بنجاح`);
            closeAddUserModal();
            loadUsers();
        }

        function approveUser(userId) {
            let users = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
            const idx = users.findIndex(u => u.id === userId);
            if (idx !== -1) {
                users[idx].status = 'approved';
                localStorage.setItem('pendingUsers', JSON.stringify(users));
                alert('✅ تمت الموافقة على المستخدم');
                loadUsers();
            }
        }

        function deleteUser(userId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا المستخدم؟ لا يمكن التراجع!')) return;
            let users = JSON.parse(localStorage.getItem('pendingUsers') || '[]');
            users = users.filter(u => u.id !== userId);
            localStorage.setItem('pendingUsers', JSON.stringify(users));
            alert('✅ تم حذف المستخدم بنجاح');
            loadUsers();
        }

        // ==================== إدارة المدن ====================
        function loadCitiesAdmin() {
            const cities = JSON.parse(localStorage.getItem('cities') || '[]');
            const places = JSON.parse(localStorage.getItem('places') || '[]');
            const container = document.getElementById('citiesList');
            
            if (cities.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">لا توجد مدن مضافة حتى الآن</div>`;
                return;
            }

            container.innerHTML = '';
            cities.forEach(city => {
                const count = places.filter(p => p.city === city.name).length;
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex items-center justify-between">
                        <div>
                            <h4 class="font-bold">${city.name}</h4>
                            <p class="text-sm text-gray-500">${count} مكان مسجل</p>
                        </div>
                        <button onclick="deleteCity('${city.name}')" class="text-red-500 text-sm p-2 hover:bg-red-50 rounded-lg">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        function openAddCityModal() {
            document.getElementById('adminNewCityName').value = '';
            document.getElementById('addCityModal').classList.remove('hidden');
            document.getElementById('addCityModal').classList.add('flex');
        }

        function closeAddCityModal() {
            document.getElementById('addCityModal').classList.add('hidden');
            document.getElementById('addCityModal').classList.remove('flex');
        }

        function saveAdminCity() {
            const name = document.getElementById('adminNewCityName').value.trim();
            if (!name) {
                alert('⚠️ أدخل اسم المدينة');
                return;
            }
            let cities = JSON.parse(localStorage.getItem('cities') || '[]');
            const exists = cities.find(c => c.name.trim() === name.trim());
            if (exists) {
                alert('⚠️ هذه المدينة موجودة مسبقاً!');
                return;
            }
            cities.push({ name: name, createdAt: new Date().toISOString() });
            localStorage.setItem('cities', JSON.stringify(cities));
            alert(`✅ تمت إضافة مدينة "${name}" بنجاح`);
            closeAddCityModal();
            loadCitiesAdmin();
        }

        function deleteCity(cityName) {
            if (!confirm(`⚠️ حذف مدينة "${cityName}"؟ سيتم حذف جميع الأماكن التابعة لها أيضاً! لا يمكن التراجع!`)) return;
            
            let cities = JSON.parse(localStorage.getItem('cities') || '[]');
            let places = JSON.parse(localStorage.getItem('places') || '[]');
            
            cities = cities.filter(c => c.name !== cityName);
            places = places.filter(p => p.city !== cityName);
            
            localStorage.setItem('cities', JSON.stringify(cities));
            localStorage.setItem('places', JSON.stringify(places));
            
            alert(`✅ تم حذف مدينة "${cityName}" وجميع أماكنها بنجاح`);
            loadCitiesAdmin();
        }

        // ==================== إدارة جميع الأماكن ====================
        function loadAllPlaces() {
            const places = JSON.parse(localStorage.getItem('places') || '[]');
            const container = document.getElementById('allPlacesList');
            
            if (places.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400">لا توجد أماكن مضافة حتى الآن</div>`;
                return;
            }

            container.innerHTML = '';
            places.forEach(place => {
                const stars = '★'.repeat(place.rating || 0) + '☆'.repeat(5 - (place.rating || 0));
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                        <div class="flex items-start justify-between">
                            <div>
                                <h4 class="font-bold">${place.name || 'بدون اسم'}</h4>
                                <p class="text-sm text-sky-600">📍 ${place.city || 'بدون مدينة'} — ${place.category || 'أخرى'}</p>
                                <p class="text-yellow-400 text-sm">${stars}</p>
                                ${place.phone ? `<p class="text-sm text-gray-500">📱 ${place.phone}</p>` : ''}
                            </div>
                            <button onclick="deletePlaceByAdmin('${place.id}')" class="text-red-500 text-sm p-2 hover:bg-red-50 rounded-lg">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function deletePlaceByAdmin(placeId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا المكان؟ لا يمكن التراجع!')) return;
            let places = JSON.parse(localStorage.getItem('places') || '[]');
            places = places.filter(p => p.id !== placeId);
            localStorage.setItem('places', JSON.stringify(places));
            alert('✅ تم حذف المكان بنجاح');
            loadAllPlaces();
        }

        // إغلاق النوافذ عند النقر خارجها
        document.getElementById('addUserModal').addEventListener('click', (e) => {
            if (e.target.id === 'addUserModal') closeAddUserModal();
        });
        document.getElementById('addCityModal').addEventListener('click', (e) => {
            if (e.target.id === 'addCityModal') closeAddCityModal();
        });

        // تحميل عند فتح الصفحة
        loadUsers();
    </script>
</body>
</html>
