<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المشرف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1E40AF', secondary: '#3B82F6', dark: '#0F172A' },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { background: #0F172A; font-family: 'Tajawal', sans-serif; min-height: 100vh; }
        .tab-active { background: #1E40AF; color: white; }
        input, select, textarea { background: #1E293B; border: 1px solid #334155; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3B82F6; }
        .btn-primary { background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); }
        .btn-primary:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="text-white">
    <header class="bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <a href="home.html" class="text-slate-400 hover:text-white transition"><i class="fa fa-arrow-right ml-1"></i> العودة</a>
        <h1 class="text-lg font-bold">لوحة المشرف</h1>
        <button id="logoutBtn" class="text-red-400 hover:text-red-300 transition"><i class="fa fa-sign-out mr-1"></i> تسجيل الخروج</button>
    </header>

    <div class="px-4 py-4 max-w-2xl mx-auto">
        <div class="flex bg-slate-800 rounded-xl p-1 mb-6 overflow-x-auto">
            <button class="admin-tab tab-active flex-1 min-w-max py-2 px-3 rounded-lg text-sm" data-tab="users">المستخدمين</button>
            <button class="admin-tab flex-1 min-w-max py-2 px-3 rounded-lg text-sm text-slate-400" data-tab="cities">المدن</button>
            <button class="admin-tab flex-1 min-w-max py-2 px-3 rounded-lg text-sm text-slate-400" data-tab="places">الأماكن</button>
            <button class="admin-tab flex-1 min-w-max py-2 px-3 rounded-lg text-sm text-slate-400" data-tab="settings">الإعدادات</button>
        </div>

        <div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-center text-sm"></div>

        <!-- المستخدمين -->
        <div id="usersTab" class="tab-content">
            <div class="bg-slate-800/60 rounded-2xl p-5 mb-6">
                <h2 class="text-lg font-semibold mb-4 text-center">إضافة مستخدم جديد</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">الاسم الكامل *</label>
                        <input type="text" id="newUserName" placeholder="أدخل الاسم الكامل" class="w-full px-4 py-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">رقم الجوال *</label>
                        <input type="tel" id="newUserPhone" placeholder="05XXXXXXXX" maxlength="10" class="w-full px-4 py-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">البريد الإلكتروني (اختياري — لتسجيل الدخول بالبريد)</label>
                        <input type="email" id="newUserEmail" placeholder="example@email.com" class="w-full px-4 py-3 rounded-lg">
                    </div>
                    <button id="addUserBtn" class="w-full btn-primary py-3 rounded-lg font-medium transition">
                        <i class="fa fa-plus-circle ml-2"></i> إضافة
                    </button>
                </div>
            </div>
            <div class="bg-slate-800/60 rounded-2xl p-5">
                <h2 class="text-lg font-semibold mb-4 text-center">قائمة المستخدمين</h2>
                <div id="usersList" class="space-y-3"><p class="text-slate-400 text-center py-4">جاري تحميل البيانات...</p></div>
            </div>
        </div>

        <!-- المدن -->
        <div id="citiesTab" class="tab-content hidden">
            <div class="bg-slate-800/60 rounded-2xl p-5 mb-6">
                <h2 class="text-lg font-semibold mb-4 text-center">إضافة مدينة جديدة</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">اسم المدينة</label>
                        <input type="text" id="newCityName" placeholder="اسم المدينة" class="w-full px-4 py-3 rounded-lg">
                    </div>
                    <button id="addCityBtn" class="w-full btn-primary py-3 rounded-lg font-medium transition">
                        <i class="fa fa-plus-circle ml-2"></i> إضافة مدينة
                    </button>
                </div>
            </div>
            <div class="bg-slate-800/60 rounded-2xl p-5">
                <h2 class="text-lg font-semibold mb-4 text-center">قائمة المدن</h2>
                <div id="citiesList" class="space-y-3"><p class="text-slate-400 text-center py-4">جاري تحميل البيانات...</p></div>
            </div>
        </div>

        <!-- الأماكن -->
        <div id="placesTab" class="tab-content hidden">
            <div class="bg-slate-800/60 rounded-2xl p-5">
                <h2 class="text-lg font-semibold mb-4 text-center">قائمة الأماكن</h2>
                <div id="placesList" class="space-y-3"><p class="text-slate-400 text-center py-4">جاري تحميل البيانات...</p></div>
            </div>
        </div>

        <!-- الإعدادات -->
        <div id="settingsTab" class="tab-content hidden">
            <div class="bg-slate-800/60 rounded-2xl p-5">
                <h2 class="text-lg font-semibold mb-4 text-center">إعدادات الموقع</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">اسم الموقع</label>
                        <input type="text" id="siteTitle" class="w-full px-4 py-3 rounded-lg" placeholder="كشتات عائلة حسين العويشي">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">رسالة المشرف (تظهر أعلى الصفحة الرئيسية)</label>
                        <textarea id="siteBannerText" rows="3" class="w-full px-4 py-3 rounded-lg" placeholder="اكتب رسالة تظهر لجميع الأعضاء..."></textarea>
                    </div>
                    <div class="pt-4 mt-4 border-t border-slate-700">
                        <label class="block text-sm text-slate-400 mb-2">إرسال إشعار فوري لكل الأعضاء</label>
                        <input type="text" id="notifTitle" placeholder="عنوان الإشعار" class="w-full px-4 py-3 rounded-lg mb-2">
                        <textarea id="notifMessage" rows="2" placeholder="نص الإشعار..." class="w-full px-4 py-3 rounded-lg"></textarea>
                        <button id="sendNotifBtn" class="w-full mt-3 py-3 rounded-lg bg-secondary/20 text-secondary hover:bg-secondary/30 transition font-medium">
                            <i class="fa fa-paper-plane ml-2"></i> إرسال الإشعار للجميع
                        </button>
                    </div>
                    <button id="saveSettingsBtn" class="w-full btn-primary py-3 rounded-lg font-medium transition mt-4">
                        <i class="fa fa-save ml-2"></i> حفظ الإعدادات
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            getCurrentUser, isAdmin, logout,
            getAllUsers, addUserByAdmin, deleteUserByAdmin,
            getCities, addCity, deleteCityDoc,
            getPlaces, deletePlace,
            getSettings, saveSettings, addNotification
        } from './auth.js';

        if (!isAdmin()) {
            alert('غير مصرح لك بالدخول لهذه الصفحة');
            window.location.href = 'home.html';
        }

        const tabs = document.querySelectorAll('.admin-tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, isError = false) {
            messageBox.textContent = text;
            messageBox.className = `mb-4 p-3 rounded-xl text-center text-sm ${isError ? 'bg-red-500/20 text-red-300' : 'bg-green-500/20 text-green-300'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 4000);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                tabs.forEach(t => { t.classList.remove('tab-active'); t.classList.add('text-slate-400'); });
                tab.classList.add('tab-active'); tab.classList.remove('text-slate-400');
                tabContents.forEach(c => c.classList.add('hidden'));
                document.getElementById(`${tabName}Tab`).classList.remove('hidden');
                if (tabName === 'users') loadUsers();
                if (tabName === 'cities') loadCities();
                if (tabName === 'places') loadAllPlaces();
                if (tabName === 'settings') loadSiteSettings();
            });
        });

        // ===== المستخدمين =====
        async function loadUsers() {
            const list = document.getElementById('usersList');
            list.innerHTML = '<p class="text-slate-400 text-center py-4">جاري التحميل...</p>';
            const users = await getAllUsers();
            if (!users || users.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-4">لا يوجد مستخدمين مسجلين</p>';
                return;
            }
            list.innerHTML = '';
            users.forEach(user => {
                list.innerHTML += `
                    <div class="bg-slate-700/50 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <p class="font-medium">${user.name || 'بدون اسم'}</p>
                            <p class="text-sm text-slate-400">${user.phone || 'بدون رقم'}${user.email ? ' • ' + user.email : ''}</p>
                        </div>
                        <button class="text-red-400 hover:text-red-300 delete-user-btn" data-phone="${user.phone || ''}">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>`;
            });
            document.querySelectorAll('.delete-user-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const phone = e.currentTarget.dataset.phone;
                    if (!phone) { alert('لا يمكن حذف مستخدم بدون رقم جوال — احذفه من Firebase Console'); return; }
                    if (confirm('هل أنت متأكد من حذف هذا المستخدم؟')) {
                        const result = await deleteUserByAdmin(phone);
                        showMessage(result.message, !result.success);
                        loadUsers();
                    }
                });
            });
        }

        document.getElementById('addUserBtn').addEventListener('click', async () => {
            const name = document.getElementById('newUserName').value.trim();
            const phone = document.getElementById('newUserPhone').value.trim();
            const email = document.getElementById('newUserEmail').value.trim();
            if (!name || !phone) { showMessage('أدخل الاسم ورقم الجوال', true); return; }
            if (phone.length < 9) { showMessage('أدخل رقم جوال صحيح', true); return; }
            const btn = document.getElementById('addUserBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin ml-2"></i> جاري الإضافة...';
            const result = await addUserByAdmin(phone, name, email);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-plus-circle ml-2"></i> إضافة';
            showMessage(result.message, !result.success);
            if (result.success) {
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserPhone').value = '';
                document.getElementById('newUserEmail').value = '';
                loadUsers();
            }
        });

        // ===== المدن =====
        async function loadCities() {
            const list = document.getElementById('citiesList');
            list.innerHTML = '<p class="text-slate-400 text-center py-4">جاري التحميل...</p>';
            const cities = await getCities();
            if (!cities || cities.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-4">لا يوجد مدن مضافة</p>';
                return;
            }
            list.innerHTML = '';
            cities.forEach(city => {
                list.innerHTML += `
                    <div class="bg-slate-700/50 p-3 rounded-xl flex justify-between items-center">
                        <p class="font-medium">${city.name}</p>
                        <button class="text-red-400 hover:text-red-300 delete-city-btn" data-id="${city.id}"><i class="fa fa-trash"></i></button>
                    </div>`;
            });
            document.querySelectorAll('.delete-city-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if (confirm('هل أنت متأكد من حذف هذه المدينة؟')) {
                        await deleteCityDoc(e.currentTarget.dataset.id);
                        loadCities();
                    }
                });
            });
        }

        document.getElementById('addCityBtn').addEventListener('click', async () => {
            const name = document.getElementById('newCityName').value.trim();
            if (!name) { showMessage('أدخل اسم المدينة', true); return; }
            try {
                await addCity({ name });
                showMessage('✅ تم إضافة المدينة');
                document.getElementById('newCityName').value = '';
                loadCities();
            } catch (e) {
                showMessage('خطأ: ' + e.message, true);
            }
        });

        // ===== الأماكن =====
        async function loadAllPlaces() {
            const list = document.getElementById('placesList');
            list.innerHTML = '<p class="text-slate-400 text-center py-4">جاري التحميل...</p>';
            const places = await getPlaces();
            if (!places || places.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-4">لا يوجد أماكن مضافة</p>';
                return;
            }
            list.innerHTML = '';
            places.forEach(place => {
                list.innerHTML += `
                    <div class="bg-slate-700/50 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <p class="font-medium">${place.name}</p>
                            <p class="text-sm text-slate-400">${place.city || 'بدون مدينة'} • ${place.category || 'أخرى'} • ${place.createdByName || 'مجهول'}</p>
                        </div>
                        <button class="text-red-400 hover:text-red-300 delete-place-btn" data-id="${place.id}"><i class="fa fa-trash"></i></button>
                    </div>`;
            });
            document.querySelectorAll('.delete-place-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if (confirm('هل أنت متأكد من حذف هذا المكان؟')) {
                        await deletePlace(e.currentTarget.dataset.id);
                        loadAllPlaces();
                    }
                });
            });
        }

        // ===== الإعدادات (تحميل وحفظ في Firestore) =====
        async function loadSiteSettings() {
            const settings = await getSettings();
            document.getElementById('siteTitle').value = settings.siteTitle || '';
            document.getElementById('siteBannerText').value = settings.adminMessage || '';
        }

        document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
            const siteTitle = document.getElementById('siteTitle').value.trim();
            const adminMessage = document.getElementById('siteBannerText').value.trim();
            const btn = document.getElementById('saveSettingsBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin ml-2"></i> جاري الحفظ...';
            const result = await saveSettings({ siteTitle, adminMessage });
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-save ml-2"></i> حفظ الإعدادات';
            if (result.success) {
                showMessage('✅ تم حفظ الإعدادات بنجاح — ستظهر في الصفحة الرئيسية');
            } else {
                showMessage('❌ خطأ في حفظ الإعدادات', true);
            }
        });

        // ===== إرسال إشعار عام =====
        document.getElementById('sendNotifBtn').addEventListener('click', async () => {
            const title = document.getElementById('notifTitle').value.trim();
            const message = document.getElementById('notifMessage').value.trim();
            if (!title && !message) { showMessage('اكتب عنواناً أو نصاً للإشعار', true); return; }
            const btn = document.getElementById('sendNotifBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin ml-2"></i> جاري الإرسال...';
            try {
                await addNotification({ title: title || 'إشعار من المشرف', message });
                showMessage('✅ تم إرسال الإشعار لجميع الأعضاء');
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifMessage').value = '';
            } catch (e) {
                showMessage('❌ خطأ: ' + e.message, true);
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-paper-plane ml-2"></i> إرسال الإشعار للجميع';
        });

        // ===== تسجيل الخروج =====
        document.getElementById('logoutBtn').addEventListener('click', () => {
            logout();
            window.location.href = 'login.html';
        });

        loadUsers();
    </script>
</body>
</html>
