<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المشرف — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { 
            background: #0F172A; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 30px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); 
            transition: all 0.2s ease;
        }
        .menu-item { 
            transition: all 0.2s ease; 
        }
        .menu-item:active { 
            background: #334155; 
        }
        button { cursor: pointer; font-family: inherit; }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 p-2"><i class="fa fa-arrow-right fa-lg"></i></button>
            <h1 class="text-lg font-bold">لوحة تحكم المشرف</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <main class="px-4 py-6">
        <!-- بطاقة ترحيب المشرف -->
        <section class="bg-yellow-900/20 border border-yellow-700/30 rounded-2xl p-6 mb-6 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-yellow-500/20 rounded-full flex items-center justify-center">
                <i class="fa fa-user-shield text-3xl text-yellow-400"></i>
            </div>
            <h2 class="text-xl font-bold text-yellow-400 mb-1">مرحباً أيها المشرف</h2>
            <p class="text-sm text-yellow-200/70">تحكم كامل بالموقع والمستخدمين</p>
        </section>

        <!-- إحصائيات سريعة -->
        <section class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3 text-center">
                <p class="text-xl font-bold text-secondary" id="totalUsers">0</p>
                <p class="text-xs text-slate-400">المستخدمين</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3 text-center">
                <p class="text-xl font-bold text-green-400" id="totalPlaces">0</p>
                <p class="text-xs text-slate-400">الأماكن</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-3 text-center">
                <p class="text-xl font-bold text-yellow-400" id="totalCities">0</p>
                <p class="text-xs text-slate-400">المدن</p>
            </div>
        </section>

        <!-- القائمة الرئيسية بنفس الشكل القديم -->
        <section class="space-y-3">
            <h3 class="text-sm font-medium text-slate-400 px-1 mb-2">إدارة المستخدمين</h3>
            
            <button id="addUserBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-user-plus text-green-400"></i>
                    إضافة مستخدم جديد
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="listUsersBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-users text-secondary"></i>
                    قائمة المستخدمين
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="pendingUsersBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-clock-o text-yellow-400"></i>
                    طلبات التسجيل المعلقة
                </span>
                <span class="bg-yellow-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center" id="pendingCount">0</span>
            </button>

            <div class="border-b border-slate-700 my-4"></div>

            <h3 class="text-sm font-medium text-slate-400 px-1 mb-2">إدارة المحتوى</h3>

            <button id="manageCitiesBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-building text-blue-400"></i>
                    إدارة المدن
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="managePlacesBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-map-marker text-red-400"></i>
                    إدارة الأماكن
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <div class="border-b border-slate-700 my-4"></div>

            <h3 class="text-sm font-medium text-slate-400 px-1 mb-2">إعدادات الموقع</h3>

            <button id="siteSettingsBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-cog text-slate-400"></i>
                    إعدادات الموقع
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="changeBannerBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-picture-o text-purple-400"></i>
                    تغيير صورة البنر
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <button id="editSiteNameBtn" class="w-full flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700 rounded-xl menu-item">
                <span class="flex items-center gap-3">
                    <i class="fa fa-font text-slate-400"></i>
                    تعديل اسم الموقع
                </span>
                <i class="fa fa-chevron-left text-slate-500 text-sm"></i>
            </button>

            <div class="border-b border-slate-700 my-4"></div>

            <button id="logoutBtn" class="w-full flex items-center justify-center gap-2 p-4 bg-red-900/20 border border-red-700/30 rounded-xl text-red-400 menu-item mt-2">
                <i class="fa fa-sign-out"></i>
                تسجيل الخروج
            </button>
        </section>
    </main>

    <script type="module">
        import { getCurrentUser, logout } from './auth.js';
        import { getPlaces, getCities } from './db.js';

        const currentUser = getCurrentUser();
        
        // التحقق من صلاحيات المشرف
        if (!currentUser || !currentUser.isAdmin) {
            alert('غير مصرح لك بالدخول إلى هذه الصفحة ❌');
            window.location.href = 'home.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ لوحة المشرف محملة');
            loadStats();
            bindEvents();
        });

        async function loadStats() {
            try {
                const places = await getPlaces();
                const cities = await getCities();
                
                document.getElementById('totalPlaces').textContent = places.length;
                document.getElementById('totalCities').textContent = cities.length;
                document.getElementById('totalUsers').textContent = localStorage.getItem('userCount') || '1';
            } catch (error) {
                console.error('❌ خطأ تحميل الإحصائيات:', error);
            }
        }

        function bindEvents() {
            document.getElementById('backBtn').onclick = () => history.back();

            // إدارة المستخدمين
            document.getElementById('addUserBtn').onclick = () => {
                alert('إضافة مستخدم جديد:\nأدخل رقم الجوال والاسم الكامل\nسيتم إرسال دعوة للتسجيل ✅');
            };
            document.getElementById('listUsersBtn').onclick = () => {
                alert('قائمة المستخدمين:\nقيد التطوير ⏳');
            };
            document.getElementById('pendingUsersBtn').onclick = () => {
                alert('لا يوجد طلبات تسجيل معلقة ✅');
            };

            // إدارة المحتوى
            document.getElementById('manageCitiesBtn').onclick = () => {
                alert('إدارة المدن:\nيمكنك تعديل وحذف وترتيب المدن من هنا ✅');
            };
            document.getElementById('managePlacesBtn').onclick = () => {
                alert('إدارة الأماكن:\nيمكنك تعديل وحذف جميع الأماكن من هنا ✅');
            };

            // إعدادات الموقع
            document.getElementById('siteSettingsBtn').onclick = () => {
                alert('إعدادات الموقع:\nقيد التطوير ⏳');
            };
            document.getElementById('changeBannerBtn').onclick = () => {
                alert('تغيير صورة البنر:\nقيد التطوير ⏳');
            };
            document.getElementById('editSiteNameBtn').onclick = () => {
                const newName = prompt('أدخل اسم الموقع الجديد:', 'كشتات عائلة حسين العويشي');
                if (newName) {
                    alert(`✅ تم تغيير اسم الموقع إلى: ${newName}`);
                }
            };

            // تسجيل الخروج
            document.getElementById('logoutBtn').onclick = async () => {
                if (confirm('هل تريد تسجيل الخروج؟')) {
                    await logout();
                }
            };
        }
    </script>
</body>
</html>
