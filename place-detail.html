<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="placeTitle">تفاصيل المكان — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { 
            background: #0F172A; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 30px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); 
            transition: all 0.2s ease;
        }
        .btn-danger { background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%); }
        button { cursor: pointer; font-family: inherit; }
        .image-gallery-main img { max-height: 300px; object-fit: cover; width: 100%; }
        .thumbnail { cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
        .thumbnail:hover, .thumbnail.active { opacity: 1; }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 p-2"><i class="fa fa-arrow-right fa-lg"></i></button>
            <h1 id="pageName" class="text-lg font-bold">تفاصيل المكان</h1>
            <div class="w-8"></div>
        </div>
    </header>

    <div id="authLoading" class="flex flex-col items-center justify-center py-20">
        <i class="fa fa-spinner fa-spin text-3xl text-secondary mb-4"></i>
        <p class="text-slate-400">جاري التحقق من الحالة...</p>
    </div>

    <div id="mainContent" class="hidden">
        <main class="px-4 py-6 max-w-lg mx-auto">
            <div id="loadingState" class="text-center py-12">
                <i class="fa fa-spinner fa-spin text-3xl text-secondary"></i>
                <p class="mt-3 text-slate-400">جاري تحميل التفاصيل...</p>
            </div>

            <div id="errorState" class="text-center py-12 hidden">
                <i class="fa fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                <h3 class="text-lg font-medium text-slate-300 mb-2">حدث خطأ</h3>
                <p class="text-sm text-slate-500 mb-6">لم يتم العثور على بيانات المكان</p>
                <button onclick="window.history.back()" class="btn-primary px-6 py-2 rounded-lg">العودة</button>
            </div>

            <div id="placeContent" class="hidden">
                <!-- معرض الصور -->
                <div class="bg-slate-800/60 border border-slate-700 rounded-xl overflow-hidden mb-6">
                    <div class="image-gallery-main">
                        <img id="mainImage" src="https://via.placeholder.com/600x300/1E293B/FFFFFF?text=لا+صورة" alt="صورة المكان">
                    </div>
                    <div id="thumbnailsContainer" class="flex gap-2 p-3 overflow-x-auto"></div>
                </div>

                <!-- معلومات المكان -->
                <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-5 mb-6">
                    <h2 id="placeName" class="text-xl font-bold mb-2">اسم المكان</h2>
                    <p id="placeCityCategory" class="text-sm text-slate-400 mb-4">المدن · التصنيف</p>
                    
                    <div class="flex items-center gap-2 mb-4">
                        <span id="placeRating" class="text-yellow-400 text-lg"></span>
                        <span id="placePrice" class="text-sm text-slate-400"></span>
                    </div>

                    <div id="placeNotes" class="text-sm text-slate-300 mb-6 leading-relaxed"></div>

                    <div class="space-y-3 mb-6">
                        <a id="phoneLink" href="#" class="flex items-center gap-3 p-3 bg-green-900/20 rounded-lg text-green-400 hover:bg-green-900/40 transition">
                            <i class="fa fa-phone"></i>
                            <span id="phoneText">اتصال بالرقم</span>
                        </a>
                        <a id="mapLink" href="#" target="_blank" class="flex items-center gap-3 p-3 bg-blue-900/20 rounded-lg text-blue-400 hover:bg-blue-900/40 transition">
                            <i class="fa fa-map-marker"></i>
                            <span>فتح في قوقل ماب</span>
                            <i class="fa fa-external-link ml-auto text-xs opacity-50"></i>
                        </a>
                        <button id="shareBtn" class="w-full flex items-center gap-3 p-3 bg-slate-700/50 rounded-lg text-slate-300 hover:bg-slate-700 transition">
                            <i class="fa fa-share-alt"></i>
                            مشاركة هذا المكان
                        </button>
                    </div>

                    <p id="authorInfo" class="text-xs text-slate-500 pt-3 border-t border-slate-700">أضيف بواسطة: اسم المستخدم</p>
                </div>

                <!-- أزرار التعديل والحذف (تظهر للمالك والمشرف فقط) -->
                <div id="adminActions" class="flex gap-3 mb-6 hidden">
                    <button id="editBtn" class="flex-1 btn-primary py-3 rounded-lg font-medium">
                        <i class="fa fa-pencil mr-1"></i> تعديل
                    </button>
                    <button id="deleteBtn" class="flex-1 btn-danger py-3 rounded-lg font-medium">
                        <i class="fa fa-trash mr-1"></i> حذف
                    </button>
                </div>

                <button id="backBottomBtn" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-medium transition">
                    <i class="fa fa-arrow-right mr-1"></i> العودة للخلف
                </button>
            </div>
        </main>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getPlaceById, deletePlace } from './db.js';
        import './firebase-config.js';

        const auth = getAuth();
        let currentPlace = null;
        let firebaseUser = null;

        // ✅ التحقق من Firebase Authentication وليس localStorage
        onAuthStateChanged(auth, (user) => {
            document.getElementById('authLoading').classList.add('hidden');
            
            if (!user) {
                console.log('⚠️ المستخدم غير مسجل، الانتقال لصفحة الدخول');
                window.location.href = 'login.html';
                return;
            }

            firebaseUser = user;
            console.log('✅ المستخدم مسجل الدخول:', user.uid);
            document.getElementById('mainContent').classList.remove('hidden');
            initPage();
        });

        function initPage() {
            const params = new URLSearchParams(window.location.search);
            const placeId = params.get('id');
            
            if (!placeId) {
                showErrorState();
                return;
            }

            loadPlaceData(placeId);
        }

        async function loadPlaceData(placeId) {
            try {
                console.log('⏳ جاري تحميل بيانات المكان:', placeId);
                document.getElementById('loadingState').classList.remove('hidden');
                document.getElementById('placeContent').classList.add('hidden');
                
                currentPlace = await getPlaceById(placeId);
                
                document.getElementById('loadingState').classList.add('hidden');
                
                if (!currentPlace) {
                    showErrorState();
                    return;
                }

                renderPlaceData();
                checkPermissions();
                bindEvents();
                document.getElementById('placeContent').classList.remove('hidden');
            } catch (error) {
                console.error('❌ خطأ تحميل المكان:', error);
                document.getElementById('loadingState').classList.add('hidden');
                showErrorState();
            }
        }

        function showErrorState() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
        }

        function renderPlaceData() {
            document.getElementById('placeName').textContent = currentPlace.name || 'بدون اسم';
            document.getElementById('pageName').textContent = currentPlace.name || 'تفاصيل المكان';
            document.getElementById('placeTitle').textContent = (currentPlace.name || 'مكان') + ' — كشتات عائلة حسين العويشي';
            
            const cityText = currentPlace.city || 'مدينة غير محددة';
            const catText = currentPlace.category || 'غير مصنف';
            document.getElementById('placeCityCategory').textContent = `${cityText} · ${catText}`;
            
            // التقييم
            const stars = '★'.repeat(currentPlace.rating || 0) + '☆'.repeat(5 - (currentPlace.rating || 0));
            document.getElementById('placeRating').textContent = stars;
            
            // السعر
            document.getElementById('placePrice').textContent = currentPlace.price || '';
            
            // الملاحظات
            document.getElementById('placeNotes').textContent = currentPlace.notes || 'لا توجد ملاحظات إضافية';
            
            // رقم الجوال
            const phoneLink = document.getElementById('phoneLink');
            const phoneText = document.getElementById('phoneText');
            if (currentPlace.phone) {
                phoneLink.href = `tel:${currentPlace.phone}`;
                phoneText.textContent = currentPlace.phone;
                phoneLink.style.display = 'flex';
            } else {
                phoneLink.style.display = 'none';
            }
            
            // رابط الخريطة
            const mapLink = document.getElementById('mapLink');
            if (currentPlace.mapUrl) {
                mapLink.href = currentPlace.mapUrl;
                mapLink.style.display = 'flex';
            } else {
                mapLink.style.display = 'none';
            }
            
            // معلومه المضيف
            document.getElementById('authorInfo').textContent = `أضيف بواسطة: ${currentPlace.ownerName || 'مستخدم مجهول'}`;
            
            // معرض الصور
            renderImages();
        }

        function renderImages() {
            const images = currentPlace.images || [];
            const mainImage = document.getElementById('mainImage');
            const thumbnails = document.getElementById('thumbnailsContainer');
            
            thumbnails.innerHTML = '';
            
            if (images.length === 0) {
                mainImage.src = 'https://via.placeholder.com/600x300/1E293B/FFFFFF?text=لا+توجد+صور';
                return;
            }
            
            mainImage.src = images[0];
            
            images.forEach((img, index) => {
                const thumb = document.createElement('img');
                thumb.src = img;
                thumb.className = `thumbnail w-16 h-16 rounded-lg object-cover ${index === 0 ? 'active ring-2 ring-secondary' : ''}`;
                thumb.onclick = () => {
                    mainImage.src = img;
                    thumbnails.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active', 'ring-2', 'ring-secondary'));
                    thumb.classList.add('active', 'ring-2', 'ring-secondary');
                };
                thumbnails.appendChild(thumb);
            });
        }

        function checkPermissions() {
            const adminActions = document.getElementById('adminActions');
            // تحقق إذا كان المالك الحالي أو مشرف
            const isOwner = currentPlace.ownerId === firebaseUser?.uid;
            const isAdmin = firebaseUser?.email === 'Alihossin28@gmail.com';
            
            if (isOwner || isAdmin) {
                adminActions.classList.remove('hidden');
            }
        }

        function bindEvents() {
            document.getElementById('backBtn').onclick = () => history.back();
            document.getElementById('backBottomBtn').onclick = () => history.back();
            
            // مشاركة
            document.getElementById('shareBtn').onclick = async () => {
                const shareData = {
                    title: currentPlace.name,
                    text: `تفضل بزيارة ${currentPlace.name} في ${currentPlace.city || ''}`,
                    url: window.location.href
                };
                if (navigator.share) {
                    try {
                        await navigator.share(shareData);
                    } catch (e) {
                        copyToClipboard();
                    }
                } else {
                    copyToClipboard();
                }
            };
            
            // تعديل
            document.getElementById('editBtn').onclick = () => {
                window.location.href = `add-place.html?edit=${encodeURIComponent(currentPlace.id)}`;
            };
            
            // حذف
            document.getElementById('deleteBtn').onclick = async () => {
                if (confirm('⚠️ هل أنت متأكد من حذف هذا المكان؟ لا يمكن التراجع عن هذا الإجراء.')) {
                    const result = await deletePlace(currentPlace.id);
                    if (result.success) {
                        alert('✅ تم حذف المكان بنجاح');
                        window.history.back();
                    } else {
                        alert('❌ حدث خطأ أثناء الحذف');
                    }
                }
            };
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('✅ تم نسخ الرابط بنجاح!');
            }).catch(() => {
                alert('❌ لم يتم نسخ الرابط، حاول مرة أخرى');
            });
        }
    </script>
</body>
</html>
