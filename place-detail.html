<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المكان — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { background: #0F172A; font-family: 'Tajawal', sans-serif; min-height: 100vh; padding-bottom: 85px; }
        .avatar-md { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        button { cursor: pointer; font-family: inherit; }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 hover:text-white transition p-2">
                <i class="fa fa-arrow-right fa-lg"></i>
            </button>
            <h1 class="text-lg font-bold">تفاصيل المكان</h1>
            <div class="flex gap-1">
                <button id="shareBtn" class="text-slate-400 hover:text-white transition p-2" title="مشاركة">
                    <i class="fa fa-share-alt"></i>
                </button>
                <button id="editBtn" class="text-slate-400 hover:text-white transition p-2 hidden" title="تعديل">
                    <i class="fa fa-pencil"></i>
                </button>
                <button id="deleteBtn" class="text-slate-400 hover:text-red-400 transition p-2 hidden" title="حذف">
                    <i class="fa fa-trash"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="px-4 py-6">
        <div id="placeNotFound" class="text-center py-16 hidden">
            <i class="fa fa-exclamation-circle text-5xl text-slate-600 mb-4"></i>
            <h3 class="text-lg font-medium text-slate-400">المكان غير موجود</h3>
            <button onclick="window.location.href='home.html'" class="mt-4 px-4 py-2 bg-secondary rounded-lg text-sm">العودة للرئيسية</button>
        </div>

        <div id="placeContent" class="hidden">
            <!-- معرض الصور -->
            <div id="imageGallery" class="mb-6 rounded-xl overflow-hidden bg-slate-800">
                <!-- الصور هنا -->
            </div>

            <!-- اسم المدينة والتصنيف -->
            <div class="mb-4">
                <h2 id="placeName" class="text-2xl font-bold mb-1">اسم المكان</h2>
                <p id="placeCityCat" class="text-sm text-slate-400">
                    <i class="fa fa-map-marker ml-1"></i> المدينة · التصنيف
                </p>
            </div>

            <!-- التقييم والسعر -->
            <div class="flex flex-wrap gap-4 mb-6">
                <div class="bg-yellow-500/10 text-yellow-400 px-3 py-1 rounded-full text-sm">
                    <span id="placeStars">★★★★★</span>
                </div>
                <div id="placePriceWrap" class="bg-green-500/10 text-green-400 px-3 py-1 rounded-full text-sm hidden">
                    <i class="fa fa-tag ml-1"></i> <span id="placePrice">—</span>
                </div>
            </div>

            <!-- معلومات الاتصال والموقع -->
            <div class="space-y-3 mb-6">
                <div id="phoneWrap" class="flex items-center justify-between p-3 bg-slate-800/60 rounded-xl border border-slate-700 hidden">
                    <span class="flex items-center text-slate-300">
                        <i class="fa fa-phone ml-3 text-green-400"></i> رقم الجوال
                    </span>
                    <a id="placePhone" href="#" class="text-secondary text-sm">اتصال</a>
                </div>
                <div id="mapWrap" class="flex items-center justify-between p-3 bg-slate-800/60 rounded-xl border border-slate-700 hidden">
                    <span class="flex items-center text-slate-300">
                        <i class="fa fa-map-marker ml-3 text-red-400"></i> الموقع على الخريطة
                    </span>
                    <a id="placeMap" href="#" target="_blank" class="text-secondary text-sm">فتح في الخريطة ↗</a>
                </div>
            </div>

            <!-- وصف المكان -->
            <div id="notesWrap" class="mb-6 hidden">
                <h3 class="text-sm font-medium text-slate-400 mb-2">الوصف والملاحظات</h3>
                <p id="placeNotes" class="text-slate-300 bg-slate-800/60 p-3 rounded-xl border border-slate-700"></p>
            </div>

            <!-- معلومات صاحب المكان ✅ -->
            <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 mb-6">
                <h3 class="text-sm font-medium text-slate-400 mb-3">معلومات المالك</h3>
                <div class="flex items-center gap-3">
                    <div id="ownerAvatarWrap" class="avatar-md bg-secondary/20 flex items-center justify-center overflow-hidden rounded-full">
                        <img id="ownerAvatarImg" src="" class="w-full h-full object-cover hidden">
                        <i id="ownerAvatarIcon" class="fa fa-user text-secondary"></i>
                    </div>
                    <div>
                        <p id="ownerName" class="font-bold text-lg">اسم المالك</p>
                        <p id="ownerPhone" class="text-sm text-slate-400">📞 —</p>
                        <p id="addedDate" class="text-xs text-slate-500 mt-1">أضيف في: —</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const placeId = params.get('id');
            if (!placeId) {
                window.location.href = 'home.html';
                return;
            }

            const places = JSON.parse(localStorage.getItem('places') || '[]');
            const place = places.find(p => p.id === placeId);
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');

            const placeNotFound = document.getElementById('placeNotFound');
            const placeContent = document.getElementById('placeContent');

            if (!place) {
                placeNotFound.classList.remove('hidden');
                return;
            }

            placeNotFound.classList.add('hidden');
            placeContent.classList.remove('hidden');

            // تعبئة البيانات الأساسية
            document.getElementById('placeName').textContent = place.name;
            document.getElementById('placeCityCat').innerHTML = `
                <i class="fa fa-map-marker ml-1"></i> ${place.city} · ${place.category}
            `;
            document.getElementById('placeStars').textContent = '★'.repeat(place.rating) + '☆'.repeat(5 - place.rating);

            if (place.price) {
                document.getElementById('placePriceWrap').classList.remove('hidden');
                document.getElementById('placePrice').textContent = place.price;
            }
            if (place.phone) {
                document.getElementById('phoneWrap').classList.remove('hidden');
                document.getElementById('placePhone').href = 'tel:' + place.phone;
                document.getElementById('placePhone').textContent = place.phone;
            }
            if (place.mapUrl) {
                document.getElementById('mapWrap').classList.remove('hidden');
                document.getElementById('placeMap').href = place.mapUrl;
            }
            if (place.notes) {
                document.getElementById('notesWrap').classList.remove('hidden');
                document.getElementById('placeNotes').textContent = place.notes;
            }

            // معرض الصور
            const gallery = document.getElementById('imageGallery');
            if (place.images && place.images.length > 0) {
                gallery.innerHTML = place.images.map(img => 
                    `<img src="${img}" class="w-full h-56 object-cover">`
                ).join('');
            } else {
                gallery.innerHTML = '<div class="w-full h-48 flex items-center justify-center"><i class="fa fa-map-marker text-4xl text-slate-500"></i></div>';
            }

            // ✅ بيانات صاحب المكان
            document.getElementById('ownerName').textContent = place.ownerName || 'مستخدم';
            document.getElementById('ownerPhone').textContent = place.ownerPhone 
                ? '📞 ' + place.ownerPhone 
                : '📞 رقم غير متوفر';
            document.getElementById('addedDate').textContent = 
                'أضيف في: ' + new Date(place.createdAt).toLocaleDateString('ar-SA');
            
            // صورة المالك
            const ownerAvatarImg = document.getElementById('ownerAvatarImg');
            const ownerAvatarIcon = document.getElementById('ownerAvatarIcon');
            if (place.ownerAvatar) {
                ownerAvatarImg.src = place.ownerAvatar;
                ownerAvatarImg.classList.remove('hidden');
                ownerAvatarIcon.classList.add('hidden');
            }

            // أزرار التعديل والحذف (للمالك والمشرف فقط)
            const editBtn = document.getElementById('editBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const isOwner = currentUser && (currentUser.phone === place.ownerPhone || currentUser.uid === place.ownerId);
            const isAdmin = currentUser && currentUser.isAdmin;
            
            if (isOwner || isAdmin) {
                editBtn.classList.remove('hidden');
                deleteBtn.classList.remove('hidden');
            }

            // أحداث الأزرار
            document.getElementById('backBtn').addEventListener('click', () => history.back());
            
            document.getElementById('shareBtn').addEventListener('click', function() {
                const shareUrl = window.location.href;
                if (navigator.share) {
                    navigator.share({
                        title: place.name,
                        text: `مكان مميز: ${place.name} في ${place.city}`,
                        url: shareUrl
                    });
                } else {
                    navigator.clipboard.writeText(shareUrl);
                    alert('✅ تم نسخ الرابط');
                }
            });

            editBtn.addEventListener('click', function() {
                alert('🚧 تعديل المكان قيد التطوير');
            });

            deleteBtn.addEventListener('click', function() {
                if (confirm('هل أنت متأكد من حذف هذا المكان؟')) {
                    const updatedPlaces = places.filter(p => p.id !== placeId);
                    localStorage.setItem('places', JSON.stringify(updatedPlaces));
                    alert('✅ تم الحذف');
                    history.back();
                }
            });
        });
    </script>
</body>
</html>
