<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المكان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#F59E0B',
                        success: '#10B981',
                        danger: '#EF4444',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: #0F172A;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
            transition: all 0.2s ease;
        }
        .btn-danger {
            background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%);
        }
        .btn-outline {
            border: 1px solid #3B82F6;
            color: #3B82F6;
            background: transparent;
            transition: all 0.2s ease;
        }
        .star-rating { color: #F59E0B; font-size: 1.2rem; }
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
        .image-placeholder {
            background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
        }
        button { cursor: pointer; border: none; }
    </style>
</head>
<body class="text-white">
    <!-- رأس الصفحة -->
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3 flex items-center justify-between">
        <button id="backBtn" class="text-slate-400 hover:text-white bg-transparent text-lg">
            <i class="fa fa-arrow-right"></i>
        </button>
        <h1 class="text-lg font-bold" id="placeName">تفاصيل المكان</h1>
        <div class="w-6"></div>
    </header>

    <main class="px-4 py-4">
        <!-- صور المكان -->
        <div class="rounded-2xl overflow-hidden mb-6 image-placeholder h-48 flex items-center justify-center" id="placeImages">
            <i class="fa fa-image text-4xl text-slate-500"></i>
        </div>

        <!-- معلومات المكان -->
        <div class="bg-slate-800/60 rounded-2xl p-5 mb-4 border border-slate-700">
            <h2 class="text-xl font-bold mb-2" id="detailName">اسم المكان</h2>
            <p class="text-slate-400 text-sm mb-4" id="detailCity">
                <i class="fa fa-map-marker ml-1 text-secondary"></i>
                المدينة
            </p>
            
            <div class="flex items-center mb-4" id="detailRating">
                <span class="star-rating" id="starsDisplay">
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                </span>
                <span class="text-sm text-slate-400 mr-2" id="ratingText">لا تقييم</span>
            </div>

            <div class="space-y-3 text-sm">
                <div class="flex items-start">
                    <span class="text-slate-500 w-20">التصنيف:</span>
                    <span id="detailCategory" class="text-white">غير مصنف</span>
                </div>
                <div class="flex items-start">
                    <span class="text-slate-500 w-20">السعر:</span>
                    <span id="detailPrice" class="text-white">غير محدد</span>
                </div>
                <div class="flex items-start" id="phoneRow" style="display:none;">
                    <span class="text-slate-500 w-20">جوال:</span>
                    <a href="#" id="detailPhone" class="text-secondary hover:underline">-</a>
                </div>
                <div class="flex items-start" id="mapRow" style="display:none;">
                    <span class="text-slate-500 w-20">الموقع:</span>
                    <a href="#" id="detailMapLink" target="_blank" class="text-secondary hover:underline">عرض في قوقل ماب</a>
                </div>
                <div class="flex items-start">
                    <span class="text-slate-500 w-20">ملاحظات:</span>
                    <span id="detailNotes" class="text-white">لا توجد ملاحظات</span>
                </div>
                <div class="flex items-start">
                    <span class="text-slate-500 w-20">تاريخ:</span>
                    <span id="detailDate" class="text-slate-400">-</span>
                </div>
            </div>
        </div>

        <!-- أزرار الإجراءات -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="shareBtn" class="btn-outline rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-share-alt"></i>
                <span>مشاركة المكان</span>
            </button>
            <button id="mapViewBtn" class="btn-outline rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-map-o"></i>
                <span>فتح في قوقل ماب</span>
            </button>
            <button id="callBtn" class="btn-outline rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-phone"></i>
                <span>اتصال مباشر</span>
            </button>
            <button id="editBtn" class="btn-primary rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-pencil"></i>
                <span>تعديل</span>
            </button>
            <button id="deleteBtn" class="btn-danger rounded-xl py-3 px-4 flex items-center justify-center gap-2 col-span-2">
                <i class="fa fa-trash"></i>
                <span>حذف المكان</span>
            </button>
        </div>
    </main>

    <!-- نافذة تأكيد الحذف -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-backdrop">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl border border-slate-700">
            <h3 class="text-lg font-bold mb-4 text-center">تأكيد الحذف</h3>
            <p class="text-slate-300 text-center mb-6">هل أنت متأكد من حذف هذا المكان؟</p>
            <div class="flex gap-3">
                <button id="confirmCancel" class="flex-1 py-3 rounded-lg bg-slate-700">إلغاء</button>
                <button id="confirmOk" class="flex-1 py-3 rounded-lg bg-danger text-white">نعم، احذف</button>
            </div>
        </div>
    </div>

    <script>
        // === دوال مساعدة ===
        function getAllPlaces() {
            try {
                const data = localStorage.getItem('places');
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        function savePlaces(places) {
            localStorage.setItem('places', JSON.stringify(places));
        }

        function getCurrentUser() {
            try {
                const data = localStorage.getItem('currentUser');
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        function isAdmin() {
            const user = getCurrentUser();
            return user?.isAdmin === true;
        }

        // === قراءة المعرف من الرابط ===
        const params = new URLSearchParams(window.location.search);
        const index = parseInt(params.get('index') || '0');
        let allPlaces = getAllPlaces();
        let place = allPlaces[index];

        // === التحميل الأولي ===
        if (!place) {
            alert('المكان غير موجود ❌');
            window.location.href = 'home.html';
        } else {
            renderPlace();
            checkPermissions();
        }

        // === عرض بيانات المكان ===
        function renderPlace() {
            document.getElementById('placeName').textContent = place.name || 'تفاصيل المكان';
            document.getElementById('detailName').textContent = place.name || 'بدون اسم';
            document.getElementById('detailCity').innerHTML = `<i class="fa fa-map-marker ml-1 text-secondary"></i>${place.city || 'بدون مدينة'}`;
            document.getElementById('detailCategory').textContent = place.category || 'غير مصنف';
            document.getElementById('detailPrice').textContent = place.price || 'غير محدد';
            document.getElementById('detailNotes').textContent = place.notes || 'لا توجد ملاحظات';
            document.getElementById('detailDate').textContent = place.createdAt ? new Date(place.createdAt).toLocaleDateString('ar-SA') : '-';

            // التقييم - النجوم
            const rating = parseInt(place.rating) || 0;
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<i class="fa fa-star ${i <= rating ? '' : 'fa-o'}"></i>`;
            }
            document.getElementById('starsDisplay').innerHTML = starsHtml;
            document.getElementById('ratingText').textContent = rating > 0 ? `${rating} من 5` : 'لا تقييم';

            // رقم الجوال
            const phoneRow = document.getElementById('phoneRow');
            if (place.phone) {
                phoneRow.style.display = 'flex';
                document.getElementById('detailPhone').textContent = place.phone;
                document.getElementById('detailPhone').href = 'tel:' + place.phone;
            } else {
                phoneRow.style.display = 'none';
            }

            // رابط الخريطة
            const mapRow = document.getElementById('mapRow');
            if (place.mapUrl) {
                mapRow.style.display = 'flex';
                document.getElementById('detailMapLink').href = place.mapUrl;
            } else {
                mapRow.style.display = 'none';
            }

            // الصور
            const imgContainer = document.getElementById('placeImages');
            if (place.images && place.images.length > 0) {
                imgContainer.innerHTML = `<img src="${place.images[0]}" alt="${place.name}" class="w-full h-full object-cover">`;
            } else {
                imgContainer.innerHTML = '<i class="fa fa-image text-4xl text-slate-500"></i>';
            }
        }

        // === صلاحيات التعديل والحذف ===
        function checkPermissions() {
            const user = getCurrentUser();
            const editBtn = document.getElementById('editBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            
            if (!place || !user) {
                editBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
                return;
            }
            
            const isOwner = place.createdBy === (user.phone || user.email);
            const userIsAdmin = isAdmin();

            if (isOwner || userIsAdmin) {
                editBtn.style.display = 'flex';
                deleteBtn.style.display = 'flex';
            } else {
                editBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
            }
        }

        // === أحداث الأزرار ===
        document.getElementById('backBtn').onclick = function() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'home.html';
            }
        };

        // ✏️ تعديل المكان — تم تفعيله
        document.getElementById('editBtn').onclick = function() {
            const user = getCurrentUser();
            const isOwner = place.createdBy === (user?.phone || user?.email);
            const userIsAdmin = isAdmin();

            if (!isOwner && !userIsAdmin) {
                alert('أنت لست صاحب هذا المكان ❌');
                return;
            }
            // الانتقال لصفحة الإضافة مع تمرير الفهرس للتعديل
            window.location.href = `add-place.html?editIndex=${index}`;
        };

        // 🗑️ حذف المكان
        document.getElementById('deleteBtn').onclick = function() {
            const user = getCurrentUser();
            const isOwner = place.createdBy === (user?.phone || user?.email);
            const userIsAdmin = isAdmin();

            if (!isOwner && !userIsAdmin) {
                alert('أنت لست صاحب هذا المكان ❌');
                return;
            }
            document.getElementById('confirmModal').classList.remove('hidden');
        };

        // إلغاء الحذف
        document.getElementById('confirmCancel').onclick = function() {
            document.getElementById('confirmModal').classList.add('hidden');
        };

        // تأكيد الحذف
        document.getElementById('confirmOk').onclick = function() {
            document.getElementById('confirmModal').classList.add('hidden');
            allPlaces.splice(index, 1);
            savePlaces(allPlaces);
            alert('تم حذف المكان بنجاح ✅');
            window.location.href = 'home.html';
        };

        // 📞 اتصال مباشر
        document.getElementById('callBtn').onclick = function() {
            if (place.phone) {
                window.location.href = 'tel:' + place.phone;
            } else {
                alert('لا يوجد رقم جوال لهذا المكان 😊');
            }
        };

        // 📍 فتح في قوقل ماب
        document.getElementById('mapViewBtn').onclick = function() {
            if (place.mapUrl) {
                window.open(place.mapUrl, '_blank');
            } else {
                alert('لا يوجد رابط خريطة لهذا المكان 😊');
            }
        };

        // 🔗 مشاركة المكان
        document.getElementById('shareBtn').onclick = function() {
            const shareText = `📍 ${place.name}\n🏙️ ${place.city || ''}\n💰 السعر: ${place.price || 'غير محدد'}\n🔗 رابط المكان: ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: place.name,
                    text: shareText,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('تم نسخ الرابط ✅');
                });
            }
        };
    </script>
</body>
</html>
