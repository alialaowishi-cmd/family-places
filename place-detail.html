<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المكان — كشتات عائلة حسين العويشي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        dark: '#0F172A',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body { 
            background: #0F172A; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 30px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%); 
            transition: all 0.2s ease;
        }
        .image-gallery img { 
            transition: transform 0.2s ease; 
        }
        .image-gallery img:hover { 
            transform: scale(1.05); 
        }
        button { cursor: pointer; font-family: inherit; }
        .skeleton { background: linear-gradient(90deg, #1E293B 25%, #334155 50%, #1E293B 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="text-white">
    <header class="sticky top-0 z-40 bg-dark/80 backdrop-blur-md border-b border-slate-700 px-4 py-3">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="text-slate-400 p-2"><i class="fa fa-arrow-right fa-lg"></i></button>
            <h1 class="text-lg font-bold">تفاصيل المكان</h1>
            <button id="shareBtn" class="text-slate-400 p-2"><i class="fa fa-share-alt fa-lg"></i></button>
        </div>
    </header>

    <main class="px-4 py-6">
        <!-- حالة التحميل -->
        <div id="loadingState">
            <div class="w-full h-48 rounded-xl skeleton mb-4"></div>
            <div class="h-6 w-3/4 rounded skeleton mb-2"></div>
            <div class="h-4 w-1/2 rounded skeleton mb-4"></div>
            <div class="h-20 rounded skeleton mb-4"></div>
        </div>

        <!-- محتوى التفاصيل -->
        <div id="detailContent" class="hidden">
            <!-- معرض الصور -->
            <div id="mainImageContainer" class="mb-4">
                <img id="mainImage" src="" class="w-full h-48 object-cover rounded-xl" alt="">
            </div>
            <div id="noImageContainer" class="w-full h-48 bg-slate-800 rounded-xl flex items-center justify-center mb-4 hidden">
                <i class="fa fa-map-marker text-4xl text-slate-500"></i>
            </div>

            <!-- معرض الصور المصغرة -->
            <div id="thumbnailsContainer" class="flex gap-2 overflow-x-auto pb-2 mb-4 image-gallery hidden">
            </div>

            <!-- معلومات المكان -->
            <h2 id="placeName" class="text-2xl font-bold mb-1">اسم المكان</h2>
            <p id="placeLocation" class="text-slate-400 mb-4">
                <i class="fa fa-map-pin ml-1"></i>
                <span id="placeCity"></span> · <span id="placeCategory"></span>
            </p>

            <!-- التقييم والسعر -->
            <div class="flex items-center gap-4 mb-6">
                <div class="flex items-center">
                    <span id="placeRating" class="text-yellow-400 text-lg"></span>
                </div>
                <div id="placePriceWrapper" class="text-slate-300">
                    <i class="fa fa-tag ml-1 text-sm text-slate-500"></i>
                    <span id="placePrice"></span>
                </div>
            </div>

            <!-- ملاحظات -->
            <div id="placeNotesWrapper" class="bg-slate-800/50 rounded-xl p-4 mb-6">
                <h3 class="font-medium text-sm text-slate-400 mb-2">الوصف والملاحظات</h3>
                <p id="placeNotes" class="text-slate-200"></p>
            </div>

            <!-- معلومات المالك -->
            <div class="bg-slate-800/50 rounded-xl p-4 mb-6">
                <h3 class="font-medium text-sm text-slate-400 mb-2">مضاف بواسطة</h3>
                <p id="placeOwner" class="text-slate-200"></p>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <a id="phoneLink" href="#" class="btn-primary py-3 rounded-xl font-medium flex items-center justify-center gap-2">
                    <i class="fa fa-phone"></i> اتصال
                </a>
                <a id="mapLink" href="#" target="_blank" class="bg-green-600 hover:bg-green-500 py-3 rounded-xl font-medium flex items-center justify-center gap-2 transition">
                    <i class="fa fa-map-o"></i> الموقع
                </a>
            </div>

            <!-- أزرار التعديل والحذف -->
            <div id="ownerActions" class="flex gap-3 hidden">
                <button id="editBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-medium transition">
                    <i class="fa fa-pencil ml-1"></i> تعديل
                </button>
                <button id="deleteBtn" class="flex-1 bg-red-600/20 text-red-400 hover:bg-red-600/30 py-3 rounded-xl font-medium transition">
                    <i class="fa fa-trash ml-1"></i> حذف
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import { getPlaceById, deletePlace, getPlaces } from './db.js';
        import { getCurrentUser } from './auth.js';

        const currentUser = getCurrentUser();
        if (!currentUser) window.location.href = 'login.html';

        let placeId = '';
        let placeData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            placeId = params.get('id');
            
            if (!placeId) {
                alert('معرف المكان غير صالح ❌');
                window.location.href = 'home.html';
                return;
            }

            bindEvents();
            await loadPlaceDetails();
        });

        function bindEvents() {
            document.getElementById('backBtn').onclick = () => history.back();
            document.getElementById('shareBtn').onclick = sharePlace;
            document.getElementById('deleteBtn').onclick = confirmDelete;
            document.getElementById('editBtn').onclick = editPlace;
        }

        async function loadPlaceDetails() {
            try {
                console.log('⏳ تحميل تفاصيل المكان:', placeId);
                placeData = await getPlaceById(placeId);
                
                if (!placeData) {
                    alert('المكان غير موجود ❌');
                    window.location.href = 'home.html';
                    return;
                }

                console.log('✅ بيانات المكان:', placeData);
                renderDetails();
            } catch (error) {
                console.error('❌ خطأ تحميل التفاصيل:', error);
                alert('حدث خطأ في تحميل البيانات');
            }
        }

        function renderDetails() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('detailContent').classList.remove('hidden');

            // الاسم والمعلومات الأساسية
            document.getElementById('placeName').textContent = placeData.name;
            document.getElementById('placeCity').textContent = placeData.city;
            document.getElementById('placeCategory').textContent = placeData.category || 'غير مصنف';
            document.getElementById('placeOwner').textContent = placeData.ownerName || 'مستخدم مجهول';

            // التقييم
            const ratingStars = '★'.repeat(placeData.rating || 0) + '☆'.repeat(5 - (placeData.rating || 0));
            document.getElementById('placeRating').textContent = ratingStars;

            // السعر
            if (placeData.price) {
                document.getElementById('placePrice').textContent = placeData.price;
                document.getElementById('placePriceWrapper').classList.remove('hidden');
            } else {
                document.getElementById('placePriceWrapper').classList.add('hidden');
            }

            // الملاحظات
            if (placeData.notes) {
                document.getElementById('placeNotes').textContent = placeData.notes;
                document.getElementById('placeNotesWrapper').classList.remove('hidden');
            } else {
                document.getElementById('placeNotesWrapper').classList.add('hidden');
            }

            // الصور
            const images = placeData.images || [];
            if (images.length > 0) {
                document.getElementById('mainImage').src = images[0];
                document.getElementById('mainImageContainer').classList.remove('hidden');
                document.getElementById('noImageContainer').classList.add('hidden');

                if (images.length > 1) {
                    const thumbnails = document.getElementById('thumbnailsContainer');
                    thumbnails.innerHTML = '';
                    thumbnails.classList.remove('hidden');
                    images.forEach((img, idx) => {
                        const thumb = document.createElement('img');
                        thumb.src = img;
                        thumb.className = 'w-16 h-16 rounded-lg object-cover cursor-pointer border-2 border-transparent hover:border-secondary';
                        thumb.onclick = () => {
                            document.getElementById('mainImage').src = img;
                        };
                        thumbnails.appendChild(thumb);
                    });
                }
            } else {
                document.getElementById('mainImageContainer').classList.add('hidden');
                document.getElementById('noImageContainer').classList.remove('hidden');
                document.getElementById('thumbnailsContainer').classList.add('hidden');
            }

            // رابط الهاتف
            const phoneLink = document.getElementById('phoneLink');
            if (placeData.phone) {
                phoneLink.href = `tel:${placeData.phone}`;
                phoneLink.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                phoneLink.href = '#';
                phoneLink.classList.add('opacity-50', 'pointer-events-none');
                phoneLink.innerHTML = '<i class="fa fa-phone-slash"></i> لا يوجد رقم';
            }

            // رابط الخريطة
            const mapLink = document.getElementById('mapLink');
            if (placeData.mapUrl) {
                mapLink.href = placeData.mapUrl;
                mapLink.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeData.name + ', ' + placeData.city)}`;
            }

            // أزرار التعديل والحذف (للمالك أو المشرف فقط)
            const ownerActions = document.getElementById('ownerActions');
            if (currentUser.uid === placeData.ownerId || currentUser.isAdmin) {
                ownerActions.classList.remove('hidden');
            }
        }

        function sharePlace() {
            const shareText = `تفضل بزيارة ${placeData.name} في ${placeData.city} — عبر منصة كشتات عائلة حسين العويشي`;
            if (navigator.share) {
                navigator.share({
                    title: placeData.name,
                    text: shareText,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('✅ تم نسخ الرابط!');
            }
        }

        function editPlace() {
            alert('التعديل قيد التطوير، يمكنك إضافة مكان جديد بنفس المعلومات والتواصل مع المشرف للحذف');
        }

        async function confirmDelete() {
            if (!confirm('هل أنت متأكد من حذف هذا المكان؟ لا يمكن التراجع عن هذا الإجراء ❌')) return;
            
            try {
                await deletePlace(placeId);
                alert('✅ تم حذف المكان بنجاح!');
                window.location.href = `city.html?name=${encodeURIComponent(placeData.city)}`;
            } catch (error) {
                console.error(error);
                alert('❌ حدث خطأ أثناء الحذف');
            }
        }
    </script>
</body>
</html>
