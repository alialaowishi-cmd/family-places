<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المكان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script type="module" src="./config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007AFF',
                        secondary: '#3B82F6',
                        accent: '#FFCC00',
                        danger: '#EF4444',
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap');
        body {
            background: linear-gradient(180deg, rgba(0, 122, 255, 0.04) 0%, rgba(94, 92, 230, 0.03) 100%);
            min-height: 100vh;
            font-family: 'Tajawal', sans-serif;
        }
        .glass-ios {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #007AFF 0%, #0066DD 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%);
        }
        .btn-outline {
            border: 1px solid #007AFF;
            color: #007AFF;
            background: transparent;
        }
        .star-rating { color: #FFCC00; font-size: 1.2rem; }
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        button { cursor: pointer; border: none; }
    </style>
</head>
<body>
    <!-- رأس الصفحة -->
    <header class="glass-ios sticky top-0 z-40 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <button id="backBtn" class="flex items-center gap-2 text-gray-500 hover:text-primary text-sm">
                <i class="fa fa-arrow-right"></i> رجوع
            </button>
            <h1 class="text-lg font-bold text-gray-800" id="placeName">تفاصيل المكان</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-5">
        <!-- صور المكان -->
        <div class="rounded-2xl overflow-hidden mb-4 bg-gray-100 h-48 flex items-center justify-center" id="placeImages">
            <i class="fa fa-image text-4xl text-gray-400"></i>
        </div>

        <!-- معلومات المكان -->
        <div class="glass-ios rounded-2xl p-5 mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-2" id="detailName">اسم المكان</h2>
            <p class="text-gray-500 text-sm mb-4" id="detailCity">
                <i class="fa fa-map-marker ml-1 text-primary"></i>
                المدينة
            </p>
            
            <div class="flex items-center mb-4" id="detailRating">
                <span class="star-rating" id="starsDisplay">
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                    <i class="fa fa-star-o"></i>
                </span>
                <span class="text-sm text-gray-500 mr-2" id="ratingText">لا تقييم</span>
            </div>

            <div class="space-y-3 text-sm text-gray-700">
                <div class="flex items-start">
                    <span class="text-gray-400 w-20">التصنيف:</span>
                    <span id="detailCategory">غير مصنف</span>
                </div>
                <div class="flex items-start">
                    <span class="text-gray-400 w-20">السعر:</span>
                    <span id="detailPrice">غير محدد</span>
                </div>
                <div class="flex items-start" id="phoneRow" style="display:none;">
                    <span class="text-gray-400 w-20">جوال:</span>
                    <a href="#" id="detailPhone" class="text-primary hover:underline">-</a>
                </div>
                <div class="flex items-start" id="mapRow" style="display:none;">
                    <span class="text-gray-400 w-20">الموقع:</span>
                    <a href="#" id="detailMapLink" target="_blank" class="text-primary hover:underline">عرض في قوقل ماب</a>
                </div>
                <div class="flex items-start">
                    <span class="text-gray-400 w-20">ملاحظات:</span>
                    <span id="detailNotes">لا توجد ملاحظات</span>
                </div>
                <div class="flex items-start">
                    <span class="text-gray-400 w-20">تاريخ:</span>
                    <span id="detailDate">-</span>
                </div>
            </div>
        </div>

        <!-- أزرار الإجراءات -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="shareBtn" class="btn-outline rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-share-alt"></i>
                <span>مشاركة المكان</span>
            </button>
            <button id="mapViewBtn" class="btn-outline rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-map-o"></i>
                <span>فتح في قوقل ماب</span>
            </button>
            <button id="callBtn" class="btn-outline rounded-xl py-3 px-4 flex items-center justify-center gap-2">
                <i class="fa fa-phone"></i>
                <span>اتصال مباشر</span>
            </button>
            <button id="editBtn" class="btn-primary rounded-xl py-3 px-4 flex items-center justify-center gap-2 text-white">
                <i class="fa fa-pencil"></i>
                <span>تعديل</span>
            </button>
            <button id="deleteBtn" class="btn-danger rounded-xl py-3 px-4 flex items-center justify-center gap-2 text-white col-span-2">
                <i class="fa fa-trash"></i>
                <span>حذف المكان</span>
            </button>
        </div>
    </main>

    <!-- نافذة تأكيد الحذف -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-backdrop">
        <div class="glass-ios rounded-2xl p-6 w-full max-w-sm mx-4 shadow-lg">
            <h3 class="text-lg font-bold text-gray-800 mb-4 text-center">تأكيد الحذف</h3>
            <p class="text-gray-600 text-center mb-6">هل أنت متأكد من حذف هذا المكان؟</p>
            <div class="flex gap-3">
                <button id="confirmCancel" class="flex-1 py-3 rounded-lg bg-gray-200 text-gray-700">إلغاء</button>
                <button id="confirmOk" class="flex-1 py-3 rounded-lg bg-danger text-white">نعم، احذف</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            getPlaceById, 
            deletePlace,
            getCurrentUser, 
            isAdmin 
        } from './auth.js';

        // === المتغيرات العامة ===
        let placeId = null;
        let place = null;

        // === قراءة المعرف من الرابط ===
        const params = new URLSearchParams(window.location.search);
        placeId = params.get('id');

        // === عناصر الصفحة ===
        const backBtn = document.getElementById('backBtn');
        const editBtn = document.getElementById('editBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const confirmModal = document.getElementById('confirmModal');
        const confirmCancel = document.getElementById('confirmCancel');
        const confirmOk = document.getElementById('confirmOk');

        // === تحميل بيانات المكان ===
        async function loadPlace() {
            if (!placeId) {
                alert('معرف المكان مفقود ❌');
                window.location.href = 'home.html';
                return;
            }

            place = await getPlaceById(placeId);
            
            if (!place) {
                alert('المكان غير موجود ❌');
                window.location.href = 'home.html';
                return;
            }

            renderPlace();
            checkPermissions();
        }

        // === عرض بيانات المكان ===
        function renderPlace() {
            document.getElementById('placeName').textContent = place.name || 'تفاصيل المكان';
            document.getElementById('detailName').textContent = place.name || 'بدون اسم';
            document.getElementById('detailCity').innerHTML = `<i class="fa fa-map-marker ml-1 text-primary"></i>${place.city || 'بدون مدينة'}`;
            document.getElementById('detailCategory').textContent = place.category || 'غير مصنف';
            document.getElementById('detailPrice').textContent = place.price || 'غير محدد';
            document.getElementById('detailNotes').textContent = place.notes || 'لا توجد ملاحظات';
            document.getElementById('detailDate').textContent = place.createdAt ? new Date(place.createdAt.toDate ? place.createdAt.toDate() : place.createdAt).toLocaleDateString('ar-SA') : '-';

            // التقييم - النجوم
            const rating = parseInt(place.rating) || 0;
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<i class="fa fa-star ${i <= rating ? '' : 'fa-o'}"></i>`;
            }
            document.getElementById('starsDisplay').innerHTML = starsHtml;
            document.getElementById('ratingText').textContent = rating > 0 ? `${rating} من 5` : 'لا تقييم';

            // رقم الجوال
            const phoneRow = document.getElementById('phoneRow');
            if (place.phone) {
                phoneRow.style.display = 'flex';
                document.getElementById('detailPhone').textContent = place.phone;
                document.getElementById('detailPhone').href = 'tel:' + place.phone;
            } else {
                phoneRow.style.display = 'none';
            }

            // رابط الخريطة
            const mapRow = document.getElementById('mapRow');
            if (place.mapUrl) {
                mapRow.style.display = 'flex';
                document.getElementById('detailMapLink').href = place.mapUrl;
            } else {
                mapRow.style.display = 'none';
            }

            // الصور
            const imgContainer = document.getElementById('placeImages');
            if (place.images && place.images.length > 0) {
                imgContainer.innerHTML = `<img src="${place.images[0]}" alt="${place.name}" class="w-full h-full object-cover">`;
            } else {
                imgContainer.innerHTML = '<i class="fa fa-image text-4xl text-gray-400"></i>';
            }
        }

        // === صلاحيات التعديل والحذف ===
        function checkPermissions() {
            const user = getCurrentUser();
            
            if (!place || !user) {
                editBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
                return;
            }
            
            const isOwner = place.createdBy === (user.phone || user.email);
            const userIsAdmin = isAdmin();

            if (isOwner || userIsAdmin) {
                editBtn.style.display = 'flex';
                deleteBtn.style.display = 'flex';
            } else {
                editBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
            }
        }

        // === أحداث الأزرار ===
        backBtn.onclick = function() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'home.html';
            }
        };

        // ✏️ تعديل المكان
        editBtn.onclick = function() {
            const user = getCurrentUser();
            const isOwner = place.createdBy === (user?.phone || user?.email);
            const userIsAdmin = isAdmin();

            if (!isOwner && !userIsAdmin) {
                alert('أنت لست صاحب هذا المكان ❌');
                return;
            }
            // الانتقال لصفحة التعديل مع تمرير المعرف
            window.location.href = `add-place.html?editId=${placeId}`;
        };

        // 🗑️ حذف المكان
        deleteBtn.onclick = function() {
            const user = getCurrentUser();
            const isOwner = place.createdBy === (user?.phone || user?.email);
            const userIsAdmin = isAdmin();

            if (!isOwner && !userIsAdmin) {
                alert('أنت لست صاحب هذا المكان ❌');
                return;
            }
            // إظهار نافذة التأكيد
            confirmModal.classList.remove('hidden');
            confirmModal.style.display = 'flex';
        };

        // إلغاء الحذف
        confirmCancel.onclick = function() {
            confirmModal.classList.add('hidden');
            confirmModal.style.display = 'none';
        };

        // تأكيد الحذف
        confirmOk.onclick = async function() {
            confirmModal.classList.add('hidden');
            confirmModal.style.display = 'none';
            
            try {
                await deletePlace(placeId);
                alert('تم حذف المكان بنجاح ✅');
                window.location.href = 'home.html';
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الحذف ❌');
            }
        };

        // 📞 اتصال مباشر
        document.getElementById('callBtn').onclick = function() {
            if (place.phone) {
                window.location.href = 'tel:' + place.phone;
            } else {
                alert('لا يوجد رقم جوال لهذا المكان 😊');
            }
        };

        // 📍 فتح في قوقل ماب
        document.getElementById('mapViewBtn').onclick = function() {
            if (place.mapUrl) {
                window.open(place.mapUrl, '_blank');
            } else {
                alert('لا يوجد رابط خريطة لهذا المكان 😊');
            }
        };

        // 🔗 مشاركة المكان
        document.getElementById('shareBtn').onclick = function() {
            const shareText = `📍 ${place.name}\n🏙️ ${place.city || ''}\n💰 السعر: ${place.price || 'غير محدد'}\n🔗 رابط المكان: ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({
                    title: place.name,
                    text: shareText,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('تم نسخ الرابط ✅');
                });
            }
        };

        // === بدء التشغيل ===
        loadPlace();
    </script>
</body>
</html>
