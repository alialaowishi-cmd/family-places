<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - إدارة المدن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#16a34a',
                        secondary: '#15803d',
                        accent: '#f59e0b',
                        danger: '#dc2626',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { padding-top: 80px; background-color: #fafafa; }
        .city-item { transition: all 0.2s ease; }
        .city-item:hover { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- نافذة التحقق من كلمة المرور -->
    <div id="authModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-[90]">
        <div class="bg-white rounded-2xl p-7 w-full max-w-sm mx-4 shadow-2xl">
            <div class="text-center mb-5">
                <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa fa-shield text-amber-500 text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800">وصول المشرف فقط</h2>
                <p class="text-sm text-gray-500 mt-1">أدخل كلمة المرور للمتابعة</p>
            </div>
            <input type="password" id="adminPassInput" class="w-full p-3 border border-gray-300 rounded-xl mb-3 focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="كلمة المرور">
            <p id="errorMsg" class="text-red-500 text-sm mb-3 hidden text-center">❌ كلمة المرور غير صحيحة</p>
            <div class="flex gap-3">
                <button id="goBackBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 py-3 rounded-xl">العودة</button>
                <button id="confirmBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl font-medium">دخول</button>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل المدينة -->
    <div id="editCityModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800 mb-4">تعديل اسم المدينة</h3>
            <input type="text" id="editCityName" class="w-full p-3 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-primary/40">
            <div class="flex gap-3">
                <button id="cancelEditCity" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2.5 rounded-xl">إلغاء</button>
                <button id="saveEditCity" class="flex-1 bg-primary text-white py-2.5 rounded-xl hover:bg-secondary">حفظ</button>
            </div>
        </div>
    </div>

    <!-- نافذة تأكيد الحذف -->
    <div id="deleteConfirmModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800 mb-2">حذف المدينة</h3>
            <p class="text-sm text-gray-500 mb-4">هل أنت متأكد من حذف هذه المدينة؟ قد يتم حذف جميع الأماكن المرتبطة بها.</p>
            <div class="flex gap-3">
                <button id="cancelDelete" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2.5 rounded-xl">إلغاء</button>
                <button id="confirmDelete" class="flex-1 bg-danger text-white py-2.5 rounded-xl hover:bg-red-700">حذف</button>
            </div>
        </div>
    </div>

    <!-- محتوى لوحة التحكم -->
    <div id="adminContent" class="hidden">
        <header class="bg-gradient-to-r from-amber-500 to-amber-600 text-white shadow-lg fixed top-0 left-0 right-0 z-40">
            <div class="container mx-auto px-4 py-3">
                <div class="flex items-center justify-between">
                    <button id="backHomeBtn" class="bg-white/20 hover:bg-white/30 p-2 rounded-xl transition">
                        <i class="fa fa-arrow-right"></i>
                    </button>
                    <h1 class="text-lg font-bold">إدارة المدن</h1>
                    <div class="w-8"></div>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 py-6">
            <!-- إضافة مدينة جديدة -->
            <div class="bg-white rounded-2xl shadow-sm p-5 mb-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa fa-plus-circle text-primary"></i> إضافة مدينة جديدة
                </h3>
                <div class="flex gap-2">
                    <input type="text" id="newCityName" class="flex-1 p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-primary/30" placeholder="اسم المدينة الجديدة">
                    <button id="addNewCityBtn" class="bg-primary text-white px-5 rounded-xl hover:bg-secondary transition">
                        <i class="fa fa-plus ml-1"></i> إضافة
                    </button>
                </div>
                <p id="addCityMsg" class="text-sm mt-2 hidden"></p>
            </div>

            <!-- قائمة المدن مع التحكم -->
            <div class="bg-white rounded-2xl shadow-sm p-5 mb-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa fa-list text-primary"></i> قائمة المدن
                </h3>
                <div id="citiesList" class="space-y-2">
                    <div class="text-center py-4 text-gray-500">
                        <i class="fa fa-spinner fa-spin"></i> جاري التحميل...
                    </div>
                </div>
            </div>

            <!-- إعدادات إضافية -->
            <div class="bg-white rounded-2xl shadow-sm p-5">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa fa-cog text-primary"></i> إعدادات الموقع
                </h3>
                <div class="space-y-3">
                    <label class="flex items-center gap-2 text-gray-700">
                        <input type="checkbox" checked class="rounded text-primary"> السماح بالتعليقات والتقييمات
                    </label>
                    <label class="flex items-center gap-2 text-gray-700">
                        <input type="checkbox" class="rounded text-primary"> طلب موافقة المشرف قبل نشر الأماكن
                    </label>
                </div>
                <button class="mt-4 bg-primary text-white px-5 py-2 rounded-lg hover:bg-secondary">حفظ الإعدادات</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAppr7PHEnnsTYjL3LB0kkMQTnc4qgNR_4",
            authDomain: "ali-alaowishi.firebaseapp.com",
            projectId: "ali-alaowishi",
            storageBucket: "ali-alaowishi.firebasestorage.app",
            messagingSenderId: "536583940962",
            appId: "1:536583940962:web:1b101ab662b21e18d3da3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CORRECT_PASSWORD = "admin123";
        let isAuthenticated = false;
        let allCities = [];
        let currentEditingCityId = null;
        let currentDeletingCityId = null;

        const authModal = document.getElementById('authModal');
        const adminContent = document.getElementById('adminContent');
        const adminPassInput = document.getElementById('adminPassInput');
        const errorMsg = document.getElementById('errorMsg');
        const confirmBtn = document.getElementById('confirmBtn');
        const goBackBtn = document.getElementById('goBackBtn');
        const backHomeBtn = document.getElementById('backHomeBtn');
        const citiesList = document.getElementById('citiesList');

        // التحقق من كلمة المرور
        function checkPassword() {
            if (adminPassInput.value === CORRECT_PASSWORD) {
                isAuthenticated = true;
                authModal.classList.add('hidden');
                adminContent.classList.remove('hidden');
                errorMsg.classList.add('hidden');
                loadCities();
            } else {
                errorMsg.classList.remove('hidden');
                adminPassInput.value = '';
            }
        }

        confirmBtn.addEventListener('click', checkPassword);
        adminPassInput.addEventListener('keypress', (e) => e.key === 'Enter' && checkPassword());
        goBackBtn.addEventListener('click', () => window.location.href = 'home.html');
        backHomeBtn.addEventListener('click', () => window.location.href = 'home.html');

        // تحميل المدن
        async function loadCities() {
            try {
                const q = query(collection(db, 'cities'), orderBy('sortOrder', 'asc'));
                const snap = await getDocs(q);
                allCities = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCities();
            } catch (err) {
                console.error(err);
                citiesList.innerHTML = '<div class="text-center py-4 text-red-500">❌ خطأ في تحميل المدن</div>';
            }
        }

        function renderCities() {
            if (!allCities.length) {
                citiesList.innerHTML = '<div class="text-center py-4 text-gray-500">لا توجد مدن مضافة بعد</div>';
                return;
            citiesList.innerHTML = allCities.map((c, i) => `
                <div class="city-item flex items-center justify-between p-3 border rounded-xl" data-id="${c.id}" data-index="${i}">
                    <span class="font-medium text-gray-800">${i + 1}. ${c.name}</span>
                    <div class="flex items-center gap-1">
                        <button class="move-up text-gray-500 hover:text-primary px-1.5 py-1 rounded ${i === 0 ? 'opacity-30 cursor-not-allowed' : ''}" data-idx="${i}" title="نقل لأعلى">
                            <i class="fa fa-chevron-up"></i>
                        </button>
                        <button class="move-down text-gray-500 hover:text-primary px-1.5 py-1 rounded ${i === allCities.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}" data-idx="${i}" title="نقل لأسفل">
                            <i class="fa fa-chevron-down"></i>
                        </button>
                        <button class="edit-city text-blue-500 hover:text-blue-700 px-1.5 py-1 rounded" data-id="${c.id}" data-name="${c.name}" title="تعديل">
                            <i class="fa fa-pencil"></i>
                        </button>
                        <button class="delete-city text-danger hover:text-red-700 px-1.5 py-1 rounded" data-id="${c.id}" title="حذف">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            attachEventListeners();
        }

        function attachEventListeners() {
            // تعديل
            document.querySelectorAll('.edit-city').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentEditingCityId = btn.dataset.id;
                    document.getElementById('editCityName').value = btn.dataset.name;
                    document.getElementById('editCityModal').classList.remove('hidden');
                });
            });

            // حذف
            document.querySelectorAll('.delete-city').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentDeletingCityId = btn.dataset.id;
                    document.getElementById('deleteConfirmModal').classList.remove('hidden');
                });
            });

            // نقل لأعلى/أسفل
            document.querySelectorAll('.move-up').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idx = parseInt(btn.dataset.idx);
                    if (idx === 0) return;
                    await swapCities(idx, idx - 1);
                });
            });
            document.querySelectorAll('.move-down').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idx = parseInt(btn.dataset.idx);
                    if (idx === allCities.length - 1) return;
                    await swapCities(idx, idx + 1);
                });
            });
        }

        // تبديل ترتيب مدينتين
        async function swapCities(i, j) {
            const temp = allCities[i].sortOrder;
            allCities[i].sortOrder = allCities[j].sortOrder;
            allCities[j].sortOrder = temp;
            
            try {
                await updateDoc(doc(db, 'cities', allCities[i].id), { sortOrder: allCities[i].sortOrder });
                await updateDoc(doc(db, 'cities', allCities[j].id), { sortOrder: allCities[j].sortOrder });
                renderCities();
            } catch (err) {
                console.error(err);
                alert('❌ خطأ في تغيير الترتيب');
            }
        }

        // إضافة مدينة جديدة
        document.getElementById('addNewCityBtn').addEventListener('click', async () => {
            const name = document.getElementById('newCityName').value.trim();
            const msgEl = document.getElementById('addCityMsg');
            msgEl.classList.add('hidden');
            
            if (!name) {
                msgEl.textContent = '❌ أدخل اسم المدينة';
                msgEl.classList.remove('hidden', 'text-green-600', 'text-red-500');
                msgEl.classList.add('text-red-500');
                return;
            }
            
            const exists = allCities.some(c => c.name.trim().toLowerCase() === name.toLowerCase());
            if (exists) {
                msgEl.textContent = '⚠️ المدينة موجودة بالفعل';
                msgEl.classList.remove('hidden', 'text-green-600', 'text-red-500');
                msgEl.classList.add('text-amber-500');
                return;
            }
            
            try {
                await addDoc(collection(db, 'cities'), {
                    name,
                    sortOrder: allCities.length,
                    createdAt: new Date()
                });
                msgEl.textContent = '✅ تمت إضافة المدينة بنجاح';
                msgEl.classList.remove('hidden', 'text-red-500', 'text-amber-500');
                msgEl.classList.add('text-green-600');
                document.getElementById('newCityName').value = '';
                await loadCities();
                setTimeout(() => msgEl.classList.add('hidden'), 3000);
            } catch (err) {
                msgEl.textContent = '❌ حدث خطأ';
                msgEl.classList.remove('hidden', 'text-green-600', 'text-amber-500');
                msgEl.classList.add('text-red-500');
            }
        });

        // حفظ تعديل المدينة
        document.getElementById('saveEditCity').addEventListener('click', async () => {
            const newName = document.getElementById('editCityName').value.trim();
            if (!newName) return alert('❌ أدخل الاسم الجديد');
            
            try {
                await updateDoc(doc(db, 'cities', currentEditingCityId), { name: newName });
                document.getElementById('editCityModal').classList.add('hidden');
                currentEditingCityId = null;
                await loadCities();
            } catch (err) {
                console.error(err);
                alert('❌ خطأ في التحديث');
            }
        });
        document.getElementById('cancelEditCity').addEventListener('click', () => {
            document.getElementById('editCityModal').classList.add('hidden');
            currentEditingCityId = null;
        });

        // تأكيد الحذف
        document.getElementById('confirmDelete').addEventListener('click', async () => {
            try {
                await deleteDoc(doc(db, 'cities', currentDeletingCityId));
                document.getElementById('deleteConfirmModal').classList.add('hidden');
                currentDeletingCityId = null;
                await loadCities();
            } catch (err) {
                console.error(err);
                alert('❌ خطأ في الحذف');
            }
        });
        document.getElementById('cancelDelete').addEventListener('click', () => {
            document.getElementById('deleteConfirmModal').classList.add('hidden');
            currentDeletingCityId = null;
        });
    </script>
</body>
</html>
